[project]
name = "agentic-sql-context-mcp"
version = "0.1.0"
description = "Skill + MotherDuck context-MCP agent for DABStep: guides (list_guides/get_guide) as the semantic layer, MCP query/schema tools for data, aiming for 100% on the 26 template representatives."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "duckdb==1.5.3",
    "mcp>=1.27",
    "openai-agents>=0.12.5",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0",
    "rich>=13.0",
    "controllog",
]

[project.scripts]
asm = "src.run:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
controllog = { path = "../controllog", editable = true }

[tool.ruff]
target-version = "py311"
line-length = 100
