# A channel naming a column that is not a null spelling and is not in the query. Nothing can
# be assumed here, so this is what an error card is for: one card carries dbt Charts' own
# message and the rest of the board still draws.
source: dbt_charts_examples
queries:
  q: |
    SELECT region, SUM(revenue) AS revenue FROM {{ ref('fct_orders') }} GROUP BY 1 ORDER BY 1
charts:
  fine:
    title: Revenue by region
    type: bar
    query: q
    x: region
    y: revenue
  broken:
    title: Coloured by a column that is not there
    type: bar
    query: q
    x: region
    y: revenue
    color: no_such_column
rows:
  - cols: [fine, broken]
