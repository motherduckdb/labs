# Synthetic: a table with more rows than page_rows, date + timestamp columns,
# currency (anchored symbol), percent and custom strftime formats.
title: "Paged Table Fixture"
tags: [no-dive]   # a test fixture: never publish it as a Dive
source: dbt_charts_examples

queries:
  customers: |
    SELECT
      customer_id,
      COUNT(*)                                             AS orders,
      SUM(revenue)                                         AS revenue,
      SUM(revenue) / SUM(SUM(revenue)) OVER ()             AS share,
      MIN(order_date)                                      AS first_order,
      MAX(order_date)::TIMESTAMP                           AS last_seen,
      MIN(order_date)                                      AS cohort
    FROM {{ ref('fct_orders') }}
    GROUP BY 1
    ORDER BY revenue DESC, customer_id
    LIMIT 12

charts:
  paged:
    title: "Top Customers (paged)"
    type: table
    query: customers
    style:
      pagination:
        page_rows: 5
      columns:
        customer_id:
          label: "Customer"
        revenue:
          label: "Revenue"
          format: currency
        share:
          label: "Share"
          format: percent
        first_order:
          label: "First Order"
        last_seen:
          label: "Last Seen"
        cohort:
          label: "Cohort"
          format: "%b %Y"

rows:
  - paged
