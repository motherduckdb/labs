# Synthetic: two tab groups with no `id:`. Their Dive state key is whatever the compiler
# makes of them, and a viewer's open tab is kept under it — so it has to be the same key
# the next time the board is published.
title: "Anonymous Tabs Fixture"
tags: [no-dive]   # a test fixture: never publish it as a Dive
source: dbt_charts_examples

variables:
  show_extra:
    input: checkbox
    label: "Show extra"
    default: false

queries:
  by_region: |
    SELECT region, SUM(revenue) AS revenue
    FROM {{ ref('fct_orders') }}
    GROUP BY 1
    ORDER BY 1
  by_category: |
    SELECT product_category, SUM(revenue) AS revenue
    FROM {{ ref('fct_orders') }}
    WHERE product_category IS NOT NULL
    GROUP BY 1
    ORDER BY 1
  totals: |
    SELECT SUM(revenue) AS revenue, COUNT(*) AS orders
    FROM {{ ref('fct_orders') }}

charts:
  region_bar:
    title: "Revenue by Region"
    type: bar
    query: by_region
    x: region
    y: revenue
  category_table:
    title: "Categories"
    type: table
    query: by_category
  revenue_kpi:
    label: "Total Revenue"
    type: kpi
    query: totals
    value: revenue
  orders_kpi:
    label: "Total Orders"
    type: kpi
    query: totals
    value: orders

rows:
  - tabs:
      items:
        - title: "Overview"
          rows:
            - region_bar
        - title: "Detail"
          rows:
            - orders_kpi
  - tabs:
      items:
        - title: "Categories"
          rows:
            - category_table
        - title: "Total"
          rows:
            - revenue_kpi
