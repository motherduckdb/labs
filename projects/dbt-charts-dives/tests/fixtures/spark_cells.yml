source: dbt_charts_examples
queries:
  q: |
    SELECT shape,
           series AS trend,
           series AS marked,
           series AS flow,
           series AS bars,
           series AS swung
    FROM (VALUES
      ('rise',   [1, 5, 3, 9]::DOUBLE[]),
      ('fall',   [9, 3, 5, 1]::DOUBLE[]),
      ('flat',   [3, 3, 3]::DOUBLE[]),
      ('single', [7]::DOUBLE[]),
      ('empty',  []::DOUBLE[]),
      ('signed', [-4, 2, -6, 8]::DOUBLE[]),
      ('long',   [2, 7, 1, 8, 2, 8, 1, 8, 2, 8, 4, 5]::DOUBLE[])
    ) AS t(shape, series)
charts:
  cells:
    title: In-cell sparklines
    type: table
    query: q
    style:
      columns:
        trend:
          spark: {type: line, width: 72, height: 16}
        marked:
          spark: {type: line, width: 64, height: 18, color: "#b45309", last_visible: true, min_max_visible: true}
        flow:
          spark: {type: area, width: 72, height: 16, fill_opacity: 0.45, last_visible: true}
        bars:
          spark: {type: columns, width: 68, height: 16}
        swung:
          spark: {type: columns, width: 68, height: 20, color: "#0f766e", negative_color: true}
rows:
  - cols: [cells]
