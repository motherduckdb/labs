[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dbt-charts-dive"
version = "0.2.0"
description = "Publish dbt Charts boards as live MotherDuck Dives from an ordinary dbt build (dbt v2 + MotherDuck Flights)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.14"
authors = [{ name = "Alex-Monahan", email = "alexm91@vt.edu" }]
keywords = ["dbt", "dbt-charts", "motherduck", "duckdb", "dashboards", "vega-lite"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  # The compiler we drive; md_compat.py patches private functions of this exact minor.
  # The compiler is built out of dbt Charts' private functions (see md_compat.py and
  # tests/test_private_api.py, which names every one of them). 0.8.0 is what it was
  # written against; a newer release is allowed, and that test is what fails first if
  # one of those names has moved.
  "dbt-charts>=0.8.0",
  # Plugin API (BasePlugin.configure_cursor) and MotherDuck path handling.
  "dbt-duckdb>=1.9,<2",
  "dbt-core>=1.8,<2",
  "duckdb>=1.1",
  "pyyaml>=6",
]

[project.optional-dependencies]
test = ["pytest>=8", "pillow>=10", "numpy>=1.26", "pandas>=2.2"]

[project.scripts]
dctmd = "dbt_charts_dive.cli:main"

[project.urls]
Homepage = "https://github.com/motherduckdb/labs/tree/main/projects/dbt-charts-dives"
Documentation = "https://github.com/motherduckdb/labs/blob/main/projects/dbt-charts-dives/docs/internals.md"
Changelog = "https://github.com/motherduckdb/labs/blob/main/projects/dbt-charts-dives/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/dbt_charts_dive"]

[tool.hatch.build.targets.sdist]
include = ["src/dbt_charts_dive/**", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]
exclude = ["**/__pycache__"]
