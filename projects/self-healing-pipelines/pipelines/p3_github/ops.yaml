# Op profile (sqlguard). Declared here + learned from query_history for green runs by scripts/learn_ops.py.
# Adding a destructive op is a reviewed change: the L2 diff guard blocks it.
ops:
  - {kind: CREATE_OR_REPLACE, table: p3_github.issues, source: declared}
  - {kind: CREATE_OR_REPLACE, table: p3_github.search_issues, source: declared}
  - {kind: CREATE_OR_REPLACE, table: p3_github.products, source: declared}
