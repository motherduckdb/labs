file: c2_merchant_profiles.malloy
domain: Payment processing fee optimization — merchant monthly profiles for fee-rule matching
summary: >
  One source at merchant × natural-calendar-month grain. Aggregates each
  merchant's transactions per month into a total monthly volume and a monthly
  fraud rate, then buckets both into the EXACT band strings used by the fee
  ruleset (fees.monthly_volume = '<100k'/'100k-1m'/'1m-5m'/'>5m';
  fees.monthly_fraud_level = '<7.2%'/'7.2%-7.7%'/'7.7%-8.3%'/'>8.3%'). Carries
  the stable merchant attributes that also gate fee applicability — account_type
  (raw code + label), merchant_category_code (+ description), and the
  capture_delay reconciled to the fee-rule capture band. This is the merchant-side
  input for matching a merchant-month against applicable fee rules; downstream
  rule-matching sources join fees against these already-bucketed local columns.
exports:
  - name: c2_merchant_profiles
    kind: source
    summary: >
      Merchant × month profile. Grain = one row per merchant per natural month
      present in payments. Columns: merchant, transaction_month, total_amount,
      fraudulent_amount, transaction_count, fraud_rate, fraud_rate_pct,
      volume_band, fraud_band, account_type, account_type_label,
      merchant_category_code, mcc_description, merchant_capture_delay,
      capture_delay_band. volume_band and fraud_band are pre-bucketed to the fee
      ruleset's exact category strings so a downstream rule join matches by
      equality (with wildcard/NULL branches applied on the fee side).
    usage: >
      Scope with `where: merchant = '...'` and a month via
      `where: transaction_month ? @2023-02` (a coarse literal is the whole month),
      then `run: c2_merchant_profiles -> monthly_profile`. Use volume_band /
      fraud_band / account_type / merchant_category_code / capture_delay_band as
      the equality keys when joining the fee ruleset.
  - name: monthly_profile
    kind: view
    summary: >
      Flat merchant-month profile row including both bucketed bands and the
      attribute columns needed for fee-rule matching.
    usage: >
      `run: c2_merchant_profiles -> monthly_profile + { where: merchant = 'Rafa_AI' and transaction_month ? @2023-10 }`.
  - name: by_volume_band
    kind: view
    summary: Count of merchant-months falling in each monthly-volume band.
    usage: "`run: c2_merchant_profiles -> by_volume_band` (optionally filter to a merchant first)."
  - name: by_fraud_band
    kind: view
    summary: Count of merchant-months falling in each monthly-fraud-level band.
    usage: "`run: c2_merchant_profiles -> by_fraud_band`."
  - name: by_merchant
    kind: view
    summary: Per-merchant summary with nested month-by-month band trajectory.
    usage: "`run: c2_merchant_profiles -> by_merchant + { where: merchant = '...' }`."
provides_for:
  - "monthly volume band per merchant per natural month (fee-rule bucket strings)"
  - "monthly fraud-level band per merchant per natural month (fee-rule bucket strings)"
  - "merchant attributes (account_type, MCC, capture_delay band) that gate fee-rule applicability"
  - "merchant-month rows to match against the fee ruleset for applicable-fee and total-fees computations"
  - "time-scoped merchant profiles (filter transaction_month to a month or the whole year)"
