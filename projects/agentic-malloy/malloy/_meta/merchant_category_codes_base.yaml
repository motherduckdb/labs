file: merchant_category_codes_base.malloy
domain: Payment processing — merchant category code (MCC) reference lookup
summary: >
  Base semantic source over the merchant_category_codes reference table, the
  authoritative code-to-description lookup for four-digit Merchant Category Codes
  (MCC). Each row maps one MCC (e.g. '5812') to its business-type description.
  Used to resolve human-readable descriptions for a merchant's or a fee rule's
  MCC, and to enumerate the full universe of defined MCC values. Contains no join
  logic; join this into merchant/fee sources on the MCC code.
exports:
  - name: merchant_category_codes_base
    kind: source
    summary: >
      One row per Merchant Category Code. Fields: mcc (four-digit code string),
      description (business-type label), mcc_code (integer form of mcc for
      matching integer-typed MCC columns on fees/merchants), mcc_category_prefix
      (first two digits = category group). Measures: mcc_count (number of codes),
      distinct_descriptions.
    usage: >
      Filter to a code with `where: mcc = '5812'` (or `mcc_code = 5812`) and
      `select: description` to resolve a label; or `group_by: mcc_category_prefix;
      aggregate: mcc_count` to summarize the code universe. Join as
      `join_one: mcc is merchant_category_codes_base with merchant_category_code`
      (matching on mcc / mcc_code) from a merchant or fee source.
provides_for:
  - "Merchant Category Code (MCC) code-to-description lookup"
  - "MCC value universe enumeration"
  - "resolving MCC descriptions for merchants and fee rules"
