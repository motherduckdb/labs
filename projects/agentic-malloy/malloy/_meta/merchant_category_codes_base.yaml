file: merchant_category_codes_base.malloy
domain: payment processing — merchant category code (MCC) reference list
summary: >
  Base source over the MCC reference table (769 rows, one per four-digit merchant
  category code). Each row maps an MCC to a text description of the business type.
  mcc is stored as VARCHAR here but as BIGINT in merchants and inside fee-rule MCC
  lists, so the source exposes mcc_code (numeric cast) as the join/match key.
  No join logic; measures and dimensions only.
exports:
  - name: merchant_category_codes_base
    kind: source
    summary: >
      One row per MCC. Dimensions: mcc (VARCHAR, primary key), mcc_code (numeric
      cast for matching merchants.merchant_category_code / fees.merchant_category_code
      lists), mcc_category_prefix (first two digits = broad industry category),
      description, description_lower (for case-insensitive lookup). Measures:
      mcc_count, min_mcc_code, max_mcc_code.
    usage: >
      Description-to-code lookup: `run: merchant_category_codes_base -> { where:
      description_lower ~ '%eating places%'; select: mcc_code, description }`;
      use the returned mcc_code for list_contains matching against fee rules.
  - name: all_codes
    kind: view
    summary: Full ordered listing of mcc_code + description (the complete MCC domain).
    usage: "`run: merchant_category_codes_base -> all_codes` (optionally refine with `+ { where: description ~ '%HOTEL%' }`)."
  - name: by_category_prefix
    kind: view
    summary: Count of MCCs per two-digit category prefix (broad industry grouping).
    usage: "`run: merchant_category_codes_base -> by_category_prefix`."
provides_for:
  - "merchants source: enrich merchants.merchant_category_code (BIGINT) with descriptions via join_one on mcc_code"
  - "fee-rule matching: resolve a user-stated business category description to its numeric MCC before list_contains matching against fees.merchant_category_code"
  - "MCC what-if scenarios: enumerate candidate MCCs (value universe) for merchant-attribute-change counterfactuals"
