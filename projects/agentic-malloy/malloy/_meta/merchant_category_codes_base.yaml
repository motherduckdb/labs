file: merchant_category_codes_base.malloy
domain: payments fee optimization — merchant category code (MCC) reference
summary: >
  Base semantic source over the merchant_category_codes lookup table (769 rows,
  one row per MCC). Grain: one MCC code with its textual business-type
  description. mcc is stored as VARCHAR; the mcc_code dimension exposes the
  numeric cast needed to join against merchants.merchant_category_code and
  fees.merchant_category_code lists (both numeric). No joins in this file.
exports:
  - name: merchant_category_codes_base
    kind: source
    summary: >
      One row per MCC. Dimensions: mcc (string, PK), description, mcc_code
      (numeric cast for joining), mcc_category_prefix (first two digits =
      industry category), description_lower (case-insensitive matching).
      Measures: mcc_count, distinct_description_count.
    usage: >
      Resolve a description to its code with
      `run: merchant_category_codes_base -> { where: description_lower ~ '%eating%'; select: mcc_code, description }`;
      join into merchant/fee models via mcc_code = merchants.merchant_category_code.
  - name: all_codes
    kind: view
    summary: Full MCC catalog projection (mcc, description) ordered by code.
    usage: "`run: merchant_category_codes_base -> all_codes + { where: mcc_code ? 5000 to 6000 }` to browse a code range."
  - name: by_category_prefix
    kind: view
    summary: Count of MCC codes per two-digit industry category prefix.
    usage: "`run: merchant_category_codes_base -> by_category_prefix` for the category distribution of the catalog."
provides_for:
  - merchants_base.malloy (resolve merchant_category_code to a description via mcc_code)
  - fees_base.malloy (label MCC codes appearing in fee-rule merchant_category_code lists)
  - description-to-code resolution when a question names an MCC by its business-type text
