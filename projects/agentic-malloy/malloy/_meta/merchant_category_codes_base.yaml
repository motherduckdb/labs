file: merchant_category_codes_base.malloy
domain: payments / merchant classification
summary: |
  Base source for the merchant_category_codes lookup (769 rows): maps a
  4-digit MCC string to a description. Adds a numeric mcc_num for joining
  to fee-rule MCC arrays (which use integers), a two-digit category prefix,
  and basic count measures. No joins.
exports:
  - name: merchant_category_codes_base
    kind: source
    summary: |
      Per-MCC lookup. Dimensions: mcc (raw 4-digit string, PK-like),
      mcc_num (integer form), description, description_lower,
      mcc_category_prefix (first 2 digits). Measures: mcc_count,
      distinct_descriptions, distinct_categories. All measures are
      base-grain (one row per MCC).
provides_for:
  - "Resolving an MCC code to its industry description"
  - "Joining to fees rules whose merchant_category_code list contains an integer MCC (use mcc_num)"
  - "Grouping merchants/transactions by MCC category prefix"
