file: merchant_category_codes_base.malloy
domain: Payment processing — Merchant Category Code (MCC) reference lookup
summary: >
  Base semantic source over the merchant_category_codes reference table: one row per
  four-digit MCC and its textual description. Serves as the code-to-description lookup
  used to resolve merchant_category_code values referenced by merchants and fee rules.
  Contains dimensions/measures only — no joins.
exports:
  - name: merchant_category_codes_base
    kind: source
    summary: >
      MCC reference dimension. Grain: one row per MCC (769 codes). Columns: mcc (4-digit
      code string), description (business-type text). Adds mcc_category_prefix (first two
      digits = top-level category) and count measures.
    usage: >
      Use as a lookup/dimension source. Resolve a description for a code with
      `where: mcc = '5812'` then `select: mcc, description`, or list all via the
      `code_list` view. Group counts by category with `by_category_prefix`.
  - name: by_category_prefix
    kind: view
    summary: Count of MCC codes grouped by their two-digit top-level category prefix.
    usage: "run: merchant_category_codes_base -> by_category_prefix"
  - name: code_list
    kind: view
    summary: Full code-to-description listing ordered by MCC.
    usage: "run: merchant_category_codes_base -> code_list; refine with + { where: description ~ r'AIR' }"
provides_for:
  - "MCC code-to-description resolution for merchants.merchant_category_code and fees.merchant_category_code"
  - "join target (by mcc) for enriching merchant/fee data with category descriptions"
