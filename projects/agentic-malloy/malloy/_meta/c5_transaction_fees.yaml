file: c5_transaction_fees.malloy
domain: payments fee analytics — matching real transactions to the fee rulebook and pricing them
summary: >
  Central fact×rule matching source. Joins payments_enriched (every rule-matching
  attribute materialized as a local column: account_type, MCC, capture-delay bucket,
  monthly volume/fraud buckets, credit flag, ACI, intracountry flag) to fees_base via a
  join_many carrying the FULL wildcard predicate (empty list / NULL scalar = applies to
  all) on every rule field. Grain after the join is transaction×matching-rule. Exposes
  the per-transaction fee formula (fixed_amount + rate*eur_amount/10000) as a complete
  aggregation set (sum/avg/min/max), fan-out-safe distinct counts, applicable-fee-ID and
  merchants-affected reverse lookups, and one-pass counterfactual deltas for overriding a
  rule's rate or fixed amount (parameters new_rate / new_fixed_amount).
exports:
  - name: transaction_fees
    kind: source (parameterized: new_rate::number, new_fixed_amount::number, both optional)
    summary: >
      payments_enriched fanned out to matching fee rules. Match-grain measures:
      total_fee_amount (SUM of fees = money actually paid), avg/min/max_fee_amount,
      matched_pair_count, distinct_fee_id_count. Base-grain-safe: matched_txn_count,
      unmatched_txn_count, affected_merchant_count (all distinct-key based). Counterfactual:
      fee_delta_at_new_rate / fee_delta_at_new_fixed_amount (scenario minus baseline over the
      same matched pairs). WARNING: inherited payments_enriched measures (total_amount,
      transaction_count, ...) are inflated by the fan-out on this source — use the
      distinct-based measures instead.
    usage: "run: transaction_fees -> { where: merchant = 'X' and txn_date ? @2023-12; aggregate: total_fee_amount }; rate-change delta: run: transaction_fees(new_rate is 99) -> { where: merchant = 'X' and rules.ID = 792 and txn_date ? @2023; aggregate: fee_delta_at_new_rate }"
  - name: total_fees_summary
    kind: view
    summary: One-row totals — matched/unmatched txns, pair count, distinct fee IDs, and the full fee aggregation set.
    usage: "run: transaction_fees -> total_fees_summary + { where: merchant = 'X' and txn_date ? @2023 } — total_fee_amount is the 'total fees paid' number."
  - name: applicable_fee_ids
    kind: view
    summary: Distinct fee-rule IDs matching at least one transaction in scope (merchant/period via where).
    usage: "run: transaction_fees -> applicable_fee_ids + { where: merchant = 'X' and txn_date ? @2023-10 }"
  - name: affected_merchants
    kind: view
    summary: Distinct merchants with ≥1 transaction matched by the scoped rule(s) — reverse lookup from rule to merchant population.
    usage: "run: transaction_fees -> affected_merchants + { where: rules.ID = 17 and txn_date ? @2023 }"
  - name: fee_ids_by_merchant
    kind: view
    summary: Per merchant, the nested sorted list of applicable fee IDs plus matched-txn and distinct-ID counts.
    usage: "run: transaction_fees -> fee_ids_by_merchant + { where: txn_date ? @2023 } (optionally scope merchant)"
  - name: fees_by_merchant
    kind: view
    summary: Total/avg/min/max fees and matched-txn count per merchant over the scoped period.
    usage: "run: transaction_fees -> fees_by_merchant + { where: txn_date ? @2023 }"
  - name: fees_by_merchant_month
    kind: view
    summary: Fee totals at merchant × natural-month grain.
    usage: "run: transaction_fees -> fees_by_merchant_month + { where: merchant = 'X' }"
  - name: fees_by_scheme
    kind: view
    summary: Fees on ACTUAL traffic grouped by the transaction's real card scheme (NOT a rerouting counterfactual — scheme-steering re-matching lives elsewhere).
    usage: "run: transaction_fees -> fees_by_scheme + { where: merchant = 'X' and txn_date ? @2023 }"
  - name: fees_by_aci
    kind: view
    summary: Fees on actual traffic grouped by the transaction's real ACI.
    usage: "run: transaction_fees -> fees_by_aci + { where: merchant = 'X' and txn_date ? @2023 }"
  - name: per_transaction_fees
    kind: view
    summary: One row per transaction with its matched-rule count and total fee (collapses the fan-out back to base grain).
    usage: "run: transaction_fees -> per_transaction_fees + { where: merchant = 'X' and txn_date ? @2023-01-10 }"
provides_for:
  - "total fees a merchant paid in a day/month/year (total_fees_summary / fees_by_merchant_month)"
  - "applicable fee IDs for a merchant and period (applicable_fee_ids, fee_ids_by_merchant)"
  - "merchants affected by a given fee rule in a period (affected_merchants)"
  - "fee delta if a rule's rate or fixed amount changed (fee_delta_at_new_rate / fee_delta_at_new_fixed_amount with rules.ID filter)"
  - "per-transaction fee inspection and unmatched-transaction diagnostics"
  - "building blocks for steering counterfactuals (compare against re-matched scenario sources)"
