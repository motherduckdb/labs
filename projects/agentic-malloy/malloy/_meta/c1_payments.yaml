file: c1_payments.malloy
domain: payments
summary: |
  Transaction-grain source: payments_base joined to merchants_base and
  merchant_category_codes_base. Surfaces per-transaction merchant
  attributes (account_type, capture_delay, MCC, MCC description,
  industry group) and a verified intracountry integer flag, all of
  which are required inputs for downstream fee-rule matching.
exports:
  - name: c1_payments
    kind: source
    summary: |
      payments enriched with merchant attributes and MCC description.
      Adds account_type, account_type_label, account_segment,
      capture_delay, capture_delay_bucket, merchant_category_code,
      mcc_description, mcc_industry_group, merchant_acquirers, and
      intracountry_int (0/1) at transaction grain.
provides_for:
  - "fee matching (account_type, capture_delay, MCC, intracountry)"
  - "per-merchant per-month fee aggregation"
  - "MCC / industry rollups of transactions"
  - "verified domestic vs cross-border classification"
