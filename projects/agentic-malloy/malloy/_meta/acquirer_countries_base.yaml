file: acquirer_countries_base.malloy
domain: payments fee optimization — acquirer-to-country lookup
summary: >
  Base source over the acquirer_countries lookup table (8 rows, one per acquirer).
  Maps each acquiring bank to the ISO country code it operates in (FR, GB, IT, NL, US).
  Grain: one row per acquirer (acquirer is the primary key). This country_code defines
  the acquiring side of the domestic/intracountry vs international distinction:
  a transaction is domestic when the card's issuing country equals the acquirer's country.
  No join logic here; downstream models unnest merchants.acquirer (a list) and join_one
  to this source on acquirer to resolve each merchant's acquiring country.
exports:
  - name: acquirer_countries_base
    kind: source
    summary: >
      One row per acquirer with its country_code. Dimensions: acquirer_name
      (underscores replaced with spaces for display), is_eu_country (true for FR/IT/NL).
      Measures: acquirer_count (rows), country_count (distinct countries represented).
    usage: >
      Use as a lookup: filter `where: acquirer = 'gringotts'` and select country_code,
      or join_one from an unnested merchants.acquirer list with `on acquirer = ...`.
  - name: by_country
    kind: view
    summary: Count of acquirers per country_code, ordered by count desc.
    usage: "run: acquirer_countries_base -> by_country (optionally refine with `+ { where: country_code = 'NL' }`)."
  - name: acquirer_directory
    kind: view
    summary: Flat alphabetical listing of every acquirer and its country_code.
    usage: "run: acquirer_countries_base -> acquirer_directory for the full 8-row lookup."
provides_for:
  - "Resolving a merchant's acquiring country: unnest merchants.acquirer and join_one to this source on acquirer."
  - "Deriving the intracountry flag for fee-rule matching: transaction is domestic iff issuing_country = the acquirer's country_code."
  - "Answering 'which country is acquirer X in' / 'which acquirers operate in country Y' lookups."
