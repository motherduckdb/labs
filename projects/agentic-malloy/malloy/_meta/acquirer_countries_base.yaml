file: acquirer_countries_base.malloy
domain: payments fee optimization — acquirer reference data
summary: >
  Lookup table mapping each acquiring bank (acquirer) to the country it is
  located in (ISO-2 country_code). Grain: one row per acquirer (8 acquirers
  across 5 countries: FR, GB, IT, NL, US). Used to resolve a merchant's
  list-valued acquirer names to countries, e.g. to determine whether a
  transaction is domestic (intracountry: issuing country = acquiring country).
  No join logic here; join from a merchant/payment layer on acquirer name.
exports:
  - name: acquirer_countries_base
    kind: source
    summary: One row per acquirer with its country_code; primary_key acquirer, so other sources can `join_one: acquirer_countries_base with <acquirer_name_col>`.
    usage: "Filter with `where: acquirer = 'gringotts'` or `country_code = 'US'`; aggregate with acquirer_count / country_count."
  - name: acquirers_by_country
    kind: view
    summary: Count of acquirers per country, descending.
    usage: "run: acquirer_countries_base -> acquirers_by_country (optionally + { where: country_code ? 'FR' | 'NL' })."
  - name: acquirer_country_lookup
    kind: view
    summary: Plain acquirer → country_code listing, alphabetical by acquirer.
    usage: "run: acquirer_countries_base -> acquirer_country_lookup + { where: acquirer ~ 'dagoberts%' } to resolve specific acquirers."
provides_for:
  - "merchants layer: resolve each element of merchants.acquirer (list) to a country via join_one on acquirer name"
  - "intracountry/domestic determination: compare resolved acquirer country to a card's issuing country"
  - "fee-rule matching: supplies acquirer-side country when evaluating the intracountry rule field"
