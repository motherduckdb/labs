file: acquirer_countries_base.malloy
domain: payment processing — acquiring banks and their countries
summary: >
  Base source over the acquirer_countries lookup table (8 rows, one per
  acquirer). Maps each acquiring bank to its country_code (FR, GB, IT, NL, US),
  which determines the acquirer country used in the domestic/intracountry vs
  international distinction. Keyed on acquirer for join_one from merchant
  acquirer lists. No join logic here; join elsewhere via
  `join_one: acquirer_countries_base with <acquirer_col>` or an explicit `on`.
exports:
  - name: acquirer_countries_base
    kind: source
    summary: One row per acquirer with its country_code; primary_key acquirer. Measures count acquirers and distinct countries.
    usage: "Filter `where: acquirer = '<name>'` and select country_code, or group_by country_code with aggregate: acquirer_count."
  - name: by_country
    kind: view
    summary: Acquirer count per country_code, descending.
    usage: "run: acquirer_countries_base -> by_country (optionally + { where: country_code = 'US' })."
  - name: acquirer_lookup
    kind: view
    summary: Full acquirer → country_code mapping, alphabetical by acquirer.
    usage: "run: acquirer_countries_base -> acquirer_lookup to list all mappings; add where: to resolve one acquirer."
provides_for:
  - "join_one target (with acquirer) for merchant sources that unnest their list-valued acquirer column"
  - "resolving an acquirer name to a country_code for intracountry (issuing_country = acquirer_country) derivations"
  - "country-level grouping of acquirers"
