file: acquirer_countries_base.malloy
domain: payments-fee-optimization
summary: >
  Lookup table mapping each acquiring bank (acquirer) to the ISO-2 country
  in which it is located. Grain: one row per acquirer (8 acquirers across 5
  countries). Used to resolve a merchant's acquirer list to acquiring
  countries, which in turn determines whether a transaction is domestic
  (intracountry: issuing_country = acquirer_country) or international.
  No join logic here; join keys are `acquirer` (to merchants.acquirer list
  elements) and `country_code` (to payments.acquirer_country / issuing_country).
exports:
  - name: acquirer_countries_base
    kind: source
    summary: >
      Base source over acquirer_countries with primary_key acquirer.
      Dimensions: acquirer (key), country_code (ISO-2), acquirer_display_name
      (underscores replaced with spaces). Measures: acquirer_count (rows),
      country_count (distinct countries).
    usage: >
      Filter by acquirer or country_code, e.g.
      `run: acquirer_countries_base -> { where: country_code = 'NL'; select: acquirer }`;
      join from a merchant-side source on acquirer to resolve acquiring country.
  - name: by_country
    kind: view
    summary: Number of acquirers per country_code, ordered by count desc.
    usage: "`run: acquirer_countries_base -> by_country` — optionally refine with `+ { where: country_code ? 'FR' | 'IT' }`."
  - name: acquirer_directory
    kind: view
    summary: Flat listing of acquirer -> country_code, alphabetical by acquirer.
    usage: "`run: acquirer_countries_base -> acquirer_directory` for the full lookup; add `where:` to scope to one acquirer."
provides_for:
  - "merchants source: resolve each element of merchants.acquirer (list) to its country_code to derive a merchant's acquiring countries"
  - "payments/fee-matching sources: validate payments.acquirer_country values and support the domestic (intracountry) derivation issuing_country = acquirer_country"
