summary: Base source for the acquirer_countries lookup, mapping each acquirer to its ISO-2 country code. Provides country-name and region dimensions used downstream to classify intracountry vs international transactions.
exports:
  - name: acquirer_countries_base
    kind: source
    summary: One row per (acquirer, country_code) mapping. 8 acquirers across 5 countries (FR, GB, IT, NL, US). Adds country_name, region, and is_eurozone dimensions plus basic count measures.
