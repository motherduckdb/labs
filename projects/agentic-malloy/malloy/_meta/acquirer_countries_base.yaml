file: acquirer_countries_base.malloy
domain: Payment processing — acquiring banks and the countries in which they acquire
summary: >
  Base semantic source over the acquirer_countries lookup table. Each row maps an
  acquiring bank (acquirer) to a country it operates/acquires in (country_code,
  ISO-2: FR, GB, IT, NL, US). Used to determine the acquirer country for a
  transaction, which drives the intracountry / local-acquiring distinction
  (issuer country == acquirer country) in fee-rule matching. No join logic here.
exports:
  - name: acquirer_countries_base
    kind: source
    summary: >
      One row per (acquirer, country_code) pairing. Dimensions: acquirer (8 distinct
      banks e.g. gringotts, medici, lehman_brothers), country_code (FR/GB/IT/NL/US),
      column0 (row index). Measures: row_count, acquirer_count (distinct acquirers),
      country_count (distinct countries).
    usage: >
      Reference for acquirer→country mapping. e.g. `run: acquirer_countries_base -> {
      group_by: acquirer; aggregate: country_count }` for how many countries each
      acquirer covers, or filter `where: acquirer = 'gringotts'` to list its countries.
provides_for:
  - "intracountry / local-acquiring determination (acquirer country vs issuing country)"
  - "acquirer-to-country lookup for transaction enrichment"
