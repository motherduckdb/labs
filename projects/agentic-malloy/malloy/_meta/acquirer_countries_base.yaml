file: acquirer_countries_base.malloy
domain: Payment processing fees — reference mapping of acquiring banks to their country
summary: >
  Base semantic source over the acquirer_countries reference table, which maps each
  acquiring bank (acquirer) to the ISO country code of the country it acquires in.
  This mapping is the grounding for the "intracountry / local acquiring" concept:
  a transaction is domestic when the card's issuing_country equals the acquirer's
  country_code. Grain is one row per acquirer/country pairing (8 acquirers across
  5 country codes: FR, GB, IT, NL, US). Contains dimensions + measures only, no joins.
exports:
  - name: acquirer_countries_base
    kind: source
    summary: >
      Acquirer-to-country reference mapping. Columns: column0 (row index),
      acquirer (bank name, 8 distinct), country_code (acquiring country, one of
      FR/GB/IT/NL/US). Measures count rows, distinct acquirers, and distinct countries.
    usage: >
      Use to look up an acquirer's acquiring country when deriving whether a
      transaction is domestic (issuing_country = acquirer_country). Run
      `acquirer_countries_base -> by_country` for acquirers per country, or
      `-> by_acquirer` for countries per acquirer. Join downstream on
      `acquirer` to a payments/merchants source to resolve acquirer_country.
provides_for:
  - "acquirer to acquiring country_code lookup"
  - "intracountry / local acquiring determination (issuing_country vs acquirer country)"
  - "count of acquirers per country and countries per acquirer"
