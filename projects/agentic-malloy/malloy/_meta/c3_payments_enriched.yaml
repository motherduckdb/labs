file: c3_payments_enriched.malloy
domain: payment processing — transactions enriched with merchant profile and natural-month tier inputs
summary: >
  Builds the fee-matching-ready transaction fact. merchant_month_stats aggregates each
  merchant's natural-calendar-month euro volume and volume-weighted fraud percentage
  (fraudulent volume / total volume * 100). payments_enriched is a projection that
  materializes, as REAL local columns on every transaction row: the merchant's account
  type, MCC, capture-delay setting and its fee-rule bucket ('<3','3-5','>5','immediate',
  'manual'), the transaction's calendar date/month (reconstructed from year + day_of_year),
  the intracountry flag (boolean and 0/1 numeric form matching fees.intracountry), and the
  merchant's monthly volume and fraud level for that transaction's month. Because these
  attributes are physical columns (not pass-through join aliases), downstream fee-rule
  matching can join_many against this source referencing only local columns. Grain: one
  row per transaction (psp_reference); all measures here are base-grain and safe.
exports:
  - name: merchant_month_stats
    kind: source (query-derived)
    summary: One row per (merchant, natural month) with month_volume_eur, month_fraud_volume_eur, and month_fraud_pct (volume-weighted percent) — the inputs to monthly_volume and monthly_fraud_level fee tiers.
    usage: "run: merchant_month_stats -> { select: * } optionally where: merchant = '<name>' and txn_month ? @2023-12"
  - name: payments_enriched
    kind: source
    summary: Transaction-grain fact with merchant profile + monthly tier inputs materialized as local columns; full transaction-space measures (counts, amounts, fraud, credit, intracountry shares) and slicing views.
    usage: "Scope with where: merchant = '<name>' and txn_date ? @2023-12 (or day_of_year = N, or txn_date ? @2023-05 to @2023-07 for month ranges), then call a view or aggregate; e.g. run: payments_enriched -> avg_value_by_issuing_country + { where: merchant = 'X' and card_scheme = 'Y' }"
  - name: payments_enriched.avg_value_by_issuing_country
    kind: view
    summary: Average/total transaction value and count grouped by issuing_country, ascending by average.
    usage: "Refine with merchant/scheme/period filters: run: payments_enriched -> avg_value_by_issuing_country + { where: ... }"
  - name: payments_enriched.by_card_scheme / by_aci / by_month / by_merchant / by_device? (n/a) 
    kind: views
    summary: Standard slices — scheme, ACI, natural month, merchant (with profile attrs shown) — each exposing count, total, average, fraud metrics.
    usage: "run: payments_enriched -> by_aci + { where: merchant = 'X' and txn_date ? @2023 }"
  - name: payments_enriched.fraud_by_aci
    kind: view
    summary: The fraudulent-transaction subset grouped by current ACI — the population targeted in ACI-steering counterfactuals.
    usage: "run: payments_enriched -> fraud_by_aci + { where: merchant = 'X' and txn_date ? @2023 }"
  - name: payments_enriched.merchant_month_tier_inputs
    kind: view
    summary: One row per merchant-month showing monthly_volume_eur and monthly_fraud_pct exactly as fee-tier matching consumes them.
    usage: "run: payments_enriched -> merchant_month_tier_inputs + { where: merchant = 'X' }"
  - name: payments_enriched.matching_attributes
    kind: view
    summary: Transaction-grain projection of every attribute the fee-rule match predicate needs (scheme, aci, is_credit, intracountry, merchant profile buckets, monthly tiers).
    usage: "run: payments_enriched -> matching_attributes + { where: merchant = 'X' and day_of_year = 300 }"
provides_for:
  - "c4 fee-attribution source: join_many fees onto payments_enriched using ONLY its local columns (merchant_account_type, merchant_mcc, merchant_capture_delay_bucket, monthly_volume_eur, monthly_fraud_pct, intracountry_num, card_scheme, aci, is_credit)"
  - "counterfactual override sources (scheme steering, ACI re-routing, MCC change) built by re-matching payments_enriched with one attribute replaced"
  - "transaction-space analytics: average transaction value by country, fraud subsets, monthly volume/fraud reporting"
