file: payments_base.malloy
domain: payment processing transactions (one row per payment attempt in 2023, 5 merchants, 4 card schemes)
summary: >
  Base source over the payments table at transaction grain (psp_reference is the key).
  Adds calendar reconstruction (txn_date/txn_month/month_num derived from year + day_of_year,
  since no date column exists), the domestic/intracountry flag derived from
  issuing_country = acquirer_country (both boolean and 0/1 forms for matching fee rules),
  and the standard aggregate surface: transaction counts, euro-amount sum/avg/min/max/median/quantiles,
  distinct-entity counts, fraud metrics (count-based AND volume-based rates — fee tiers use the
  volume-based ratio), refusal, credit-share, and intracountry-share measures. No joins; join logic
  and fee-rule matching belong in a downstream payments.malloy model.
exports:
  - name: payments_base
    kind: source
    summary: Transaction-grain source with calendar, intracountry derivations and full measure set; all measures are base-grain (safe to aggregate at any grouping of this source, but must NOT be re-aggregated after any fan-out join added downstream).
    usage: "run: payments_base -> { where: merchant = 'X' and txn_date ? @2023-05; aggregate: total_amount, avg_amount }; filter a day with day_of_year = N, a month with txn_month or txn_date ? @2023-02."
  - name: by_merchant
    kind: view
    summary: Per-merchant volume, count, average value, volume-based fraud rate, refusal rate.
    usage: "run: payments_base -> by_merchant + { where: txn_date ? @2023-12 }; add order_by/limit for rankings."
  - name: by_card_scheme
    kind: view
    summary: Per-scheme count/volume/average/fraud-rate — the comparison axis for scheme questions on actual traffic.
    usage: "run: payments_base -> by_card_scheme + { where: merchant = 'X' }; order_by avg_amount or total_amount as the question requires."
  - name: by_aci
    kind: view
    summary: Per-ACI counts and volumes including fraud subset — the actual-traffic view behind ACI-steering analysis.
    usage: "run: payments_base -> by_aci + { where: has_fraudulent_dispute and merchant = 'X' } to profile fraudulent traffic by ACI."
  - name: by_issuing_country
    kind: view
    summary: Count / total / average transaction value by issuing country.
    usage: "run: payments_base -> by_issuing_country + { where: merchant = 'X' and card_scheme = 'Y' }; order_by avg_amount for value-by-country rankings."
  - name: by_month
    kind: view
    summary: Natural-calendar-month totals and volume-based fraud rate across all merchants.
    usage: "run: payments_base -> by_month; scope with where: merchant = 'X' for one merchant's monthly series."
  - name: merchant_monthly
    kind: view
    summary: Merchant × natural-month grain totals (monthly volume in EUR and volume-based fraud level) — the exact inputs fee rules' monthly_volume / monthly_fraud_level tiers are evaluated against.
    usage: "run: payments_base -> merchant_monthly + { where: txn_month ? @2023-10 }; feed the resulting totals into fee-tier bucket parsing downstream."
  - name: by_device_type
    kind: view
    summary: Count / total / average amount by device type.
    usage: "run: payments_base -> by_device_type + { where: merchant = 'X' }."
  - name: by_shopper_interaction
    kind: view
    summary: Ecommerce vs POS counts, volumes, and volume-based fraud rate.
    usage: "run: payments_base -> by_shopper_interaction + { where: txn_date ? @2023-Q2 }."
provides_for:
  - "payments.malloy: enriched fact source joining merchants (join_one on merchant) to materialize account_type/mcc/capture_delay for fee-rule matching"
  - "fee attribution model: use merchant_monthly outputs (total_amount, fraud_rate_by_volume) to resolve monthly_volume / monthly_fraud_level tier buckets"
  - "counterfactual scenarios (scheme steering, ACI migration, MCC override): base-grain population and measures to recompute fees over"
