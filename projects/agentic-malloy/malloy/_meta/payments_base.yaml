file: payments_base.malloy
domain: Payment transactions (Adyen-style acquiring dataset). Grain = one authorized transaction (psp_reference). Feeds fee-optimization, fraud, and routing analysis for 5 merchants during 2023.
summary: >
  Base semantic layer over the `payments` table. One row per transaction. Adds derived
  dimensions (calendar date/month/quarter from day_of_year, domestic vs international routing
  from issuing vs acquirer country, ACI descriptions) and the standard aggregation set for
  transaction value (sum/avg/min/max/count), plus credit, routing, refusal, and fraud measures.
  Fraud rate follows the manual definition (fraudulent volume / total volume). No joins here —
  fee-rule matching, MCC/merchant attributes, and acquirer geography live in downstream sources.
exports:
  - name: payments_base
    kind: source
    summary: >
      Transaction-grain source with value/fraud/routing measures and derived time & routing
      dimensions. Base-grain measures (total_amount, transaction_count, fraud_amount) are safe
      to aggregate directly here; re-aggregate them only BEFORE any downstream join_many fan-out.
    usage: >
      `run: payments_base -> { where: merchant = 'Rafa_AI' and transaction_date ? @2023-12; aggregate: total_amount, fraud_rate }`.
      Filter time with the apply operator on transaction_date/`month` using date literals (@2023-12),
      never string/int equality. Compose rankings last-mile with order_by + limit.
  - name: by_merchant
    kind: view
    summary: Per-merchant transaction count, total/avg value, and fraud rate.
    usage: "`run: payments_base -> by_merchant` — refine with `+ { where: transaction_date ? @2023 }`."
  - name: by_card_scheme
    kind: view
    summary: Value and fraud metrics grouped by card scheme (network).
    usage: "`run: payments_base -> by_card_scheme + { where: merchant = 'Crossfit_Hanna' }`."
  - name: by_aci
    kind: view
    summary: Metrics grouped by ACI code with human-readable description.
    usage: "`run: payments_base -> by_aci + { where: shopper_interaction = 'Ecommerce' }`."
  - name: by_month
    kind: view
    summary: Monthly (natural calendar month) transaction metrics.
    usage: "`run: payments_base -> by_month + { where: merchant = 'Rafa_AI' }`."
  - name: by_issuing_country
    kind: view
    summary: Transaction volume and average value by issuing country.
    usage: "`run: payments_base -> by_issuing_country + { order_by: avg_amount desc }`."
  - name: merchant_monthly_volume
    kind: view
    summary: >
      Per-merchant per-natural-month total volume, count, fraud volume and fraud rate — the base
      for mapping merchants into monthly_volume and monthly_fraud_level fee bands downstream.
    usage: "`run: payments_base -> merchant_monthly_volume + { where: merchant = 'Golfclub_Baron_Friso' }`."
provides_for:
  - Total fees paid by a merchant (transaction value + volume base, before fee-rule matching)
  - Transaction value / average transaction value by any dimension
  - Fraud rate and monthly fraud-level band inputs
  - Monthly volume band inputs (merchant_monthly_volume)
  - Domestic vs international (intracountry) routing splits
  - Card scheme, ACI, shopper interaction, issuing/acquirer country slicing
  - Time-period filtering (year, natural month, day-of-year via transaction_date)
