file: payments_base.malloy
domain: Payment transactions for merchants (Adyen-style acquiring), one row per processed transaction, all in year 2023. Basis for fee computation, fraud analysis, and routing/scenario optimization.
summary: >
  Base semantic layer over the `payments` transaction table (138,236 rows, 5 merchants,
  4 card schemes, calendar year 2023). Exposes transaction-value measures (sum/avg/min/max),
  fraud and refusal measures, credit/debit and domestic/international splits, plus derived
  date dimensions (calendar date and natural-calendar-month from day_of_year) and an
  intracountry (issuer==acquirer) flag. No joins — merchant profile, MCC lookups, and fee
  rules live in separate sources that reference this one. Reusable views group the standard
  measures by merchant, card scheme, ACI, issuing country, device, and month, and provide
  per-merchant per-natural-month volume and fraud ratios used to match fee-rule monthly_volume
  and monthly_fraud_level bands.
exports:
  - name: payments_base
    kind: source
    summary: >
      Transaction-grain source over duckdb.table('payments'). Dimensions: transaction_date,
      transaction_month (natural calendar month), is_intracountry, plus native columns
      (merchant, card_scheme, aci, is_credit, issuing_country, acquirer_country, device_type,
      shopper_interaction, eur_amount, has_fraudulent_dispute, is_refused_by_adyen, day_of_year,
      hour_of_day, etc.). Measures: transaction_count, total_amount, avg_amount, min_amount,
      max_amount, fraudulent_count, fraudulent_amount, fraud_rate, refused_count, refusal_rate,
      credit_count/credit_amount/debit_amount, intracountry_count/intracountry_amount. All
      measures are base transaction grain (safe to aggregate; no join fan-out).
    usage: >
      `run: payments_base -> { where: merchant = 'Rafa_AI' and transaction_month ? @2023-02
      group_by: card_scheme; aggregate: total_amount, avg_amount, transaction_count }`.
      Filter time with date literals on transaction_date/transaction_month (e.g. `? @2023-12`)
      or day_of_year; never compare dates to strings/ints.
  - name: by_merchant
    kind: view
    summary: Standard measures grouped by merchant.
    usage: "`run: payments_base -> by_merchant` optionally refined with `+ { where: ... }`."
  - name: by_card_scheme
    kind: view
    summary: Standard measures grouped by card scheme (routing/steering comparisons).
    usage: "`run: payments_base -> by_card_scheme + { where: merchant = 'X' }`; add order_by/limit last-mile to rank schemes."
  - name: by_aci
    kind: view
    summary: Volume and value grouped by Authorization Characteristics Indicator.
    usage: "`run: payments_base -> by_aci + { where: has_fraudulent_dispute }` for fraud-ACI analysis."
  - name: by_issuing_country
    kind: view
    summary: Volume and value grouped by card issuing country.
    usage: "`run: payments_base -> by_issuing_country`."
  - name: by_device_type
    kind: view
    summary: Volume, value, and fraud rate grouped by device type.
    usage: "`run: payments_base -> by_device_type`."
  - name: by_month
    kind: view
    summary: Standard measures per natural calendar month (ordered).
    usage: "`run: payments_base -> by_month + { where: merchant = 'X' }`."
  - name: monthly_volume_per_merchant
    kind: view
    summary: >
      Per-merchant per-natural-month total transaction volume and count — the input for
      matching fee-rule monthly_volume bands (e.g. '100k-1m').
    usage: "`run: payments_base -> monthly_volume_per_merchant`; bucket total_amount into fee bands downstream."
  - name: monthly_fraud_per_merchant
    kind: view
    summary: >
      Per-merchant per-natural-month fraud ratio (fraud volume / total volume) — the input for
      matching fee-rule monthly_fraud_level bands (e.g. '7.7%-8.3%').
    usage: "`run: payments_base -> monthly_fraud_per_merchant`; map fraud_rate to fee bands downstream."
  - name: fraud_overview
    kind: view
    summary: Fraud volume, count, and rate per merchant.
    usage: "`run: payments_base -> fraud_overview`."
provides_for:
  - "total / average / min / max transaction value overall or by merchant, card scheme, ACI, country, device, month"
  - "fraud rate and fraudulent volume per merchant per natural month (monthly_fraud_level band input)"
  - "monthly total volume per merchant (monthly_volume band input)"
  - "credit vs debit and domestic (intracountry) vs international splits"
  - "refusal rate and refused transaction counts"
  - "transaction attributes (card_scheme, aci, is_credit, issuing/acquirer country, shopper_interaction) needed to match applicable fee rules"
  - "time-window scoping via transaction_date / transaction_month / day_of_year"
