file: payments_base.malloy
domain: payments
summary: |
  Base source over the `payments` table. Adds derived time, geography, ACI,
  and amount-bucket dimensions plus the core KPIs from the Merchant Manual:
  authorization rate, refusal rate, fraud rate (count + volume), local vs
  cross-border share, credit share, and 3-D Secure share. No joins.
exports:
  - name: payments_base
    kind: source
    summary: |
      Transactions enriched with derived dimensions (transaction_date,
      transaction_timestamp, time_of_day, is_intracountry, aci_label,
      amount_bucket, credit_or_debit, etc.) and KPI measures
      (transaction_count, total_eur_amount, authorization_rate, fraud_rate,
      fraud_volume_rate, intracountry_share, three_ds_share, ...).
provides_for:
  - payments
  - transactions
  - fraud analysis
  - authorization rate
  - acquiring routing
  - ACI mix
