file: payments_base.malloy
domain: payments
summary: |
  Base source over the raw `payments` DuckDB table. Adds derived time
  dimensions (a real transaction_date built from year + day_of_year, plus
  month/quarter/week and a time-of-day bucket), business dimensions
  aligned to the Merchant Manual (intracountry vs crossborder per
  §5.1.1, ACI human labels and card-present / CNP / 3-D Secure flags per
  §4, IP-vs-issuer mismatch, success flag, credit/debit), and a full
  measure set: volume counts, € totals/avg/median, outcome-segmented
  filtered aggregates, and the KPI rates from §8.2 (authorization rate,
  refusal rate, fraud rate by count, fraud volume rate by €). No joins.
exports:
  - name: payments_base
    kind: source
    summary: |
      Per-transaction grain (primary_key psp_reference). All measures are
      base-grain; safe to aggregate directly. Use this as the root for
      any payments-fee or fraud analysis source that joins fee rules or
      merchant attributes.
provides_for:
  - "payments KPIs: authorization rate, refusal rate, fraud rate (by count and by €)"
  - "Volume & mix analyses by merchant, card_scheme, aci, device_type, shopper_interaction, country"
  - "Time-series over transaction_date / month / quarter / hour_of_day"
  - "Local vs cross-border acquiring analysis (is_intracountry)"
  - "Foundation for fee-rule joins (downstream sources)"
