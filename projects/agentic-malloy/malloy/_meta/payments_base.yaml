file: payments_base.malloy
domain: payment transaction processing (per-transaction payments made through 5 merchants in 2023)
summary: >
  Base semantic source over the `payments` table, one row per transaction
  (psp_reference). Adds calendar dimensions derived from year + day_of_year
  (transaction_date, transaction_month, month_of_year — 2023 is non-leap),
  the domestic/intracountry flag (issuing_country = acquirer_country, plus a
  0/1 numeric form matching the fees.intracountry encoding), and the full set
  of volume, fraud, refusal, and credit measures. Fraud level follows the
  documented definition: euro-volume-weighted ratio, not a count ratio.
  No joins — join logic and fee-rule matching belong in downstream sources.
exports:
  - name: payments_base
    kind: source
    summary: >
      Transaction-grain source with dimensions (transaction_date,
      transaction_month, month_of_year, is_intracountry, intracountry_num, plus
      all raw columns: merchant, card_scheme, aci, is_credit, issuing_country,
      acquirer_country, eur_amount, day_of_year, hour_of_day, device_type,
      shopper_interaction, has_fraudulent_dispute, is_refused_by_adyen) and
      measures (transaction_count, total/avg/min/max_amount, fraud_count,
      fraud_amount, fraud_volume_ratio, fraud_count_ratio, refused_count,
      refusal_rate, credit_count, credit_share, intracountry_count,
      intracountry_share, merchant_count).
    usage: >
      run: payments_base -> { where: merchant = 'X' and transaction_date ? @2023-02;
      group_by: <dim>; aggregate: <measures> } — use `transaction_date ? @2023-03`
      for a natural month, `day_of_year = N` for an ordinal day, ranges via
      `? @2023-05 to @2023-07`.
  - name: by_merchant
    kind: view
    summary: Volume, average value, and fraud level per merchant.
    usage: "run: payments_base -> by_merchant + { where: transaction_date ? @2023-06 }"
  - name: by_card_scheme
    kind: view
    summary: Volume, average value, and fraud level per card scheme.
    usage: "run: payments_base -> by_card_scheme + { where: merchant = 'X' }; order_by/limit for cheapest/biggest scheme."
  - name: by_aci
    kind: view
    summary: Transaction mix per Authorization Characteristics Indicator (A–G).
    usage: "run: payments_base -> by_aci + { where: has_fraudulent_dispute }"
  - name: monthly_by_merchant
    kind: view
    summary: >
      Natural-month grain per merchant: total euro volume, fraudulent volume,
      and the volume-weighted fraud ratio — the exact inputs the fee-rule
      monthly_volume and monthly_fraud_level tiers are matched against.
    usage: "run: payments_base -> monthly_by_merchant + { where: merchant = 'X' and transaction_month ? @2023 }"
provides_for:
  - fee-rule matching layers that join payments to the fees rule table (per-transaction fee = fixed_amount + rate * eur_amount / 10000)
  - merchant enrichment sources joining on the merchant name (account type, MCC, capture delay)
  - monthly volume / fraud tier derivation for wildcard rule matching (use monthly_by_merchant)
  - what-if / steering analyses sweeping card_scheme or aci over actual transaction sets
