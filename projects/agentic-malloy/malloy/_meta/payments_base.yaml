file: payments_base.malloy
domain: Payment processing transactions (Adyen-style); one row per payment attempt with outcome, channel, geography, card, and fraud flags.
summary: |
  Base source `payments_base` over duckdb.table('payments'). Grain = one payment
  attempt keyed by psp_reference (138,236 distinct rows; year fixed at 2023).
  Adds derived dimensions (synthetic transaction_date from day_of_year, time-of-day
  bucket, intracountry flag, IP/issuer mismatch flag, ACI human labels, amount
  buckets, credit/debit label) and core measures (transaction_count, total_eur,
  fraud_count/rate, refusal_rate, authorization_rate, volume-weighted fraud rate,
  channel & domestic splits). No joins — fee-rule lookup and any cross-table logic
  belong in a downstream `payments.malloy`.
exports:
  - name: payments_base
    kind: source
    summary: Base payments source with dimensions + measures, primary_key psp_reference, no joins.
provides_for:
  - payments overview / KPI dashboards (transaction_count, total_eur, fraud_rate, authorization_rate)
  - segmenting by merchant, card_scheme, aci, shopper_interaction, country pair
  - time-series analysis by transaction_date / month / hour_of_day
  - downstream sources that join fee rules (fees.json) on card_scheme, aci, is_credit, intracountry, merchant attributes
  - fraud / refusal analysis and cross-border vs domestic acquiring comparisons
