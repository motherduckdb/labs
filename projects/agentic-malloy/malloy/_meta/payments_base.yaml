file: payments_base.malloy
domain: payments
summary: Base semantic model over the `payments` table — adds derived dimensions (transaction date, ACI descriptions, channel flags, geo flags, amount/time buckets) and core measures for volume, monetary totals, authorization rate, refusal rate, fraud rate, credit share, and cross-border vs local acquiring splits. No joins.
exports:
  - name: payments_base
    kind: source
    summary: Per-transaction payments source with measures (counts, volumes, fraud/refusal/authorization rates, cross-border splits) and dimensions (transaction_date, aci_description, is_intracountry, amount_bucket, time_of_day, is_card_present/CNP, is_3ds_authenticated).
provides_for:
  - payment processing analytics
  - fraud-rate and authorization-rate KPI tracking
  - cross-border vs local acquiring analysis
  - ACI / channel mix analysis
  - merchant volume and average ticket analysis
