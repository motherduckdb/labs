file: payments_base.malloy
domain: Payment processing — transaction fact table (one row per payment event, 2023)
summary: >
  Base semantic source over the payments table: one row per psp_reference with
  euro amount, card scheme, ACI, credit flag, issuing/acquirer countries,
  fraud/refusal flags, and calendar fields (year, day_of_year). Adds a natural
  calendar month dimension derived from day_of_year (2023, non-leap), a derived
  domestic/intracountry flag (issuing_country = acquirer_country), and the full
  standard aggregation set over amounts plus fraud, refusal, credit, and
  intracountry rates (both count-based and volume-weighted). No joins; merchant
  attributes and fee-rule resolution live in downstream sources.
exports:
  - name: payments_base
    kind: source
    summary: Transaction-grain source with amount/fraud/refusal/credit/domestic measures and month_num / is_intracountry derived dimensions.
    usage: "run: payments_base -> { where: merchant = 'X', month_num = 5; aggregate: total_amount }; filter days with day_of_year, months with month_num."
  - name: by_merchant
    kind: view
    summary: Per-merchant volume, amounts, fraud, refusal, credit and domestic shares.
    usage: "run: payments_base -> by_merchant + { where: month_num ? 1 to 3 } for a period slice; re-order/limit last-mile for rankings."
  - name: by_card_scheme
    kind: view
    summary: Per-scheme transaction counts, amounts, fraud rate and shares.
    usage: "Refine with a merchant/time where: then order_by the measure of interest to rank schemes."
  - name: by_aci
    kind: view
    summary: Per-ACI counts, amounts and fraud metrics.
    usage: "Scope with where: has_fraudulent_dispute for fraud-traffic ACI mix; order_by transaction_count or total_amount."
  - name: by_issuing_country
    kind: view
    summary: Per-issuing-country volume, amounts, and fraud metrics (intracountry share deliberately excluded — several issuer countries never coincide with an acquirer country, so it does not discriminate at this grain).
    usage: "Refine with merchant/time filters; rank by total_amount or fraud_rate_by_volume."
  - name: by_acquirer_country
    kind: view
    summary: Per-acquirer-country volume and domestic share.
    usage: "Refine with merchant/time filters; intracountry_share is meaningful at this grain."
  - name: by_month
    kind: view
    summary: Natural-calendar-month totals (counts, volume, fraud) for 2023.
    usage: "Add where: merchant = 'X' for a merchant's monthly series; month_num 1..12."
  - name: by_day
    kind: view
    summary: Daily (day_of_year) counts and amounts.
    usage: "Filter to a range with day_of_year ? a to b; order/limit for peak-day questions."
  - name: by_shopper_interaction
    kind: view
    summary: POS vs Ecommerce split of counts, amounts, fraud rate.
    usage: "Refine with merchant/time filters as needed."
  - name: by_device_type
    kind: view
    summary: Per-device-type counts, amounts, fraud rate.
    usage: "Refine with merchant/time filters as needed."
  - name: merchant_monthly
    kind: view
    summary: Merchant x natural-month grain with monthly volume (EUR), fraudulent volume, and volume-weighted fraud rate — the raw inputs for fee-rule monthly_volume / monthly_fraud_level bucket matching.
    usage: "Pipe to a second stage to bucket monthly_volume_eur / monthly_fraud_rate into fee-rule range strings, or filter to one merchant+month for its tier."
provides_for:
  - "payments.malloy (fact source with merchant join and fee-rule resolution)"
  - "fees_base.malloy consumers matching monthly volume / fraud buckets via merchant_monthly"
  - "counterfactual steering/fee-delta sources built on the enriched fact grain"
