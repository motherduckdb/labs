file: c4_fee_matching.malloy
domain: payment processing fees — transaction-to-fee-rule attribution
summary: >
  Core fact×rule fan-out engine. Re-projects payments_enriched (stripping its
  base-grain measures, which would inflate under fan-out) and join_many's it to
  fees_base with the full wildcard-aware match predicate: scheme equality;
  account-type / MCC / ACI list membership with empty-list = applies-to-all;
  capture-delay bucket equality with NULL wildcard; credit and intracountry
  nullable equality; monthly volume and monthly fraud tiers parsed from range
  strings against the merchant's natural-month aggregates. Grain after the join
  is one row per (transaction, matching rule); a transaction matching zero rules
  keeps one outer row with NULL rule fields and contributes 0 EUR fees. Fee
  formula: fixed_amount + rate * eur_amount / 10000. Base-grain measures are
  fan-out-safe (distinct psp_reference / source-locality sums); match-grain
  measures (total/avg/min/max fee, matched volume) are computed at the rules
  grain. Detail/enumeration views filter to matched pairs so no phantom NULL
  rows appear; match_coverage exposes the matched-vs-unmatched conservation
  check explicitly.
exports:
  - name: fee_matched_payments
    kind: source
    summary: >
      Transaction×rule matched source. Measures: transaction_count,
      matched_transaction_count, unmatched_transaction_count,
      match_coverage_rate, base_total_amount, base_avg_amount (base grain);
      matched_pair_count, applicable_rule_count, total_fee_eur,
      avg/min/max_match_fee_eur, fee_per_transaction, matched_amount_eur
      (match grain). Dimensions: match_fee_eur, is_matched, plus everything on
      payments_enriched (txn_month, merchant_account_type, monthly_volume_eur,
      monthly_fraud_pct, ...).
    usage: "Scope with where: merchant = '<name>' and txn_date ? @2023-12 (or day_of_year = N), then aggregate: total_fee_eur — total fees paid is one filtered aggregate."
  - name: fee_matched_payments -> match_coverage
    kind: view
    summary: Conservation check — matched vs unmatched transaction counts, coverage rate, total pairs and fees.
    usage: "run: fee_matched_payments -> match_coverage (optionally + { where: merchant = '<name>' })."
  - name: fee_matched_payments -> transaction_fee_detail
    kind: view
    summary: Match-grain enumeration — one row per (transaction, matched rule) with rule pricing and match_fee_eur; unmatched outer rows excluded.
    usage: "Refine with where: merchant/period/rules.ID filters; capped at 10000 rows."
  - name: fee_matched_payments -> transaction_fee_summary
    kind: view
    summary: One row per matched transaction with pair count and total/avg/min/max fee across its matched rules (zero-match transactions excluded; they pay 0).
    usage: "Refine with where: merchant + txn_date window; order/limit as needed."
  - name: fee_matched_payments -> applicable_fee_ids
    kind: view
    summary: Distinct fee-rule IDs matching the scoped transaction population, with matched txn counts and volume.
    usage: "Applicable fee IDs for a merchant/period: + { where: merchant = '<name>' and txn_date ? @2023-10 }; the rule_id column is the answer list."
  - name: fee_matched_payments -> fee_rule_incidence
    kind: view
    summary: Per-rule incidence — matched transactions, matched EUR volume, fee revenue, and the rule's fixed/rate. Rate-override delta = (new_rate − rule_rate) × matched_amount_eur / 10000.
    usage: "Delta for one rule: + { where: rules.ID = <id> and merchant = '<name>' and txn_date ? @2023-12 }, then apply the delta formula to matched_amount_eur."
  - name: fee_matched_payments -> affected_merchants
    kind: view
    summary: Merchants having ≥1 transaction matched by the scoped rule(s)/period — reverse rule→merchant lookup.
    usage: "Merchants affected by fee <id> in 2023: + { where: rules.ID = <id> and txn_date ? @2023 }."
  - name: fee_matched_payments -> total_fees_by_merchant
    kind: view
    summary: Per-merchant fee totals plus coverage and per-match fee stats (sum/avg/min/max).
    usage: "Refine with a period filter; compare merchants or read one row."
  - name: fee_matched_payments -> total_fees_by_month
    kind: view
    summary: Natural-month fee totals across the scoped population.
    usage: "Refine with where: merchant = '<name>' for a merchant's monthly fee series."
  - name: fee_matched_payments -> total_fees_by_merchant_month
    kind: view
    summary: Merchant × natural-month fee totals (grain of the volume/fraud tier inputs).
    usage: "Filter to a merchant and/or month; total_fee_eur is the period total."
  - name: fee_matched_payments -> total_fees_by_scheme
    kind: view
    summary: Fees on ACTUAL traffic grouped by card scheme (not the steering counterfactual — that recomputes matching with an overridden scheme).
    usage: "Refine with merchant/period; rank by total_fee_eur."
provides_for:
  - "total fees paid by a merchant over any period (year / natural month / day-of-year) via total_fee_eur"
  - "applicable fee IDs for a merchant/period (applicable_fee_ids)"
  - "merchants affected by a given fee rule (affected_merchants)"
  - "per-rule matched volume for rate-change fee deltas (fee_rule_incidence)"
  - "input baseline for counterfactual scenario sources (scheme steering, ACI migration, MCC override) built in later files"
