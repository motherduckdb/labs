file: c2_fee_rules.malloy
domain: payments — fee-rule space (rule catalog analysis at a hypothetical transaction value, ignoring actual transactions)
summary: >
  Rule-space semantic layer over the 1,000 fee rules. The central parameterized source `fee_rules`
  evaluates the fee formula (fixed_amount + rate * notional / 10000) at a caller-supplied notional
  amount and exposes wildcard-aware applicability filtering: every filter parameter is wired into a
  single `matches_filters` predicate with the correct wildcard branch per field (empty list = all
  values for account_type / merchant_category_code / aci; NULL = all values for capture_delay,
  monthly_fraud_level, monthly_volume, is_credit, intracountry). All measures are filtered
  aggregates computed AFTER the parameter predicate, so binding any filter parameter genuinely
  narrows the result. Three companion exploded sources (one row per rule × listed ACI / MCC /
  account type) provide the participating universe for "cheapest / most expensive X" rankings —
  wildcard-only rules carry no distinguishing signal and are correctly excluded from rankings.
  MCC descriptions are resolved via the merchant_category_codes lookup (VARCHAR mcc cast to number).
exports:
  - name: fee_rules
    kind: source (parameterized)
    summary: >
      fees grain (one row per rule). Params: notional (EUR amount for the fee formula, default 100),
      filter_card_scheme, filter_account_type ('R'/'D'/'H'/'F'/'S'/'O'), filter_mcc (numeric code —
      resolve a description to its code via merchant_category_codes_base first),
      filter_aci ('A'..'G'), filter_is_credit, filter_capture_delay (rule-bucket domain
      '<3'/'3-5'/'>5'/'immediate'/'manual'), filter_fraud_level (tier string like '>8.3%'),
      filter_volume (tier string like '100k-1m'), filter_intracountry. All params honor wildcard
      rules (a NULL/empty rule field always matches). Measures: matching_rule_count,
      avg/min/max/total_scenario_fee, avg_fixed_amount_matching, avg_rate_matching — all restricted
      to matching rules.
    usage: >
      Average-scenario fee: `run: fee_rules(notional is 1000, filter_card_scheme is 'GlobalCard',
      filter_account_type is 'H') -> { aggregate: avg_scenario_fee }`. Cheapest/most expensive
      scheme at a value: `fee_rules(notional is 50) -> scheme_fee_ranking` then take first/last row.
  - name: fee_rules.matching_fee_ids
    kind: view
    summary: Distinct rule IDs applicable under the bound filter parameters (wildcard-inclusive), ascending.
    usage: "`run: fee_rules(filter_account_type is 'D', filter_aci is 'F') -> matching_fee_ids` — IDs of rules applying to those attributes."
  - name: fee_rules.matching_rule_detail
    kind: view
    summary: Full attribute + price detail of matching rules including the scenario fee at the bound notional.
    usage: "Bind filters, run the view, inspect fixed_amount/rate/scenario_fee per rule."
  - name: fee_rules.scheme_fee_ranking
    kind: view
    summary: Per card scheme — matching rule count and avg/min/max scenario fee at the notional, ordered cheapest first.
    usage: "Cheapest scheme = first row; most expensive = order_by avg_scenario_fee desc (refine with `+ {order_by: avg_scenario_fee desc; limit: 1}`)."
  - name: fee_rules.capture_delay_fee_ranking
    kind: view
    summary: Avg/min/max scenario fee per specific capture-delay tier (wildcard rules excluded from the ranking universe).
    usage: "Bind other filters + notional, run the view; cheapest tier first."
  - name: fee_rules_by_aci
    kind: source (parameterized)
    summary: >
      One row per (rule, listed ACI) — participating universe for ACI rankings; rules with an empty
      aci list are excluded (they don't distinguish ACIs). Params: notional, filter_card_scheme,
      filter_account_type, filter_mcc, filter_is_credit, filter_intracountry (all wildcard-aware,
      all wired into the measures).
    usage: >
      Most expensive ACI for a 100 EUR credit transaction on a scheme:
      `run: fee_rules_by_aci(notional is 100, filter_card_scheme is 'GlobalCard',
      filter_is_credit is true) -> aci_fee_ranking + { order_by: avg_scenario_fee desc, aci_value asc; limit: 1 }`.
  - name: fee_rules_by_aci.aci_fee_ranking
    kind: view
    summary: Per ACI letter — matching rule count and avg/min/max scenario fee, cheapest first, alphabetical tiebreak.
    usage: "Refine order_by/limit for cheapest vs most expensive; ties resolved by aci_value asc."
  - name: fee_rules_by_mcc
    kind: source (parameterized)
    summary: >
      One row per (rule, listed MCC) with the MCC description resolved from the lookup table.
      Params: notional, filter_card_scheme, filter_account_type, filter_aci, filter_is_credit,
      filter_intracountry (wildcard-aware, wired). Wildcard-MCC rules excluded from rankings.
    usage: >
      Most expensive MCC(s) at 50000 EUR: `run: fee_rules_by_mcc(notional is 50000) ->
      mcc_fee_ranking` — top rows share the max avg_scenario_fee; list all tied mcc_value.
  - name: fee_rules_by_mcc.mcc_fee_ranking
    kind: view
    summary: Per MCC code + description — matching rule count and avg/min/max scenario fee, most expensive first.
    usage: "Take the leading rows with equal avg_scenario_fee for tie-listing; refine with `+ {order_by: avg_scenario_fee asc}` for cheapest."
  - name: fee_rules_by_account_type
    kind: source (parameterized)
    summary: >
      One row per (rule, listed account type). Params: notional, filter_card_scheme, filter_mcc,
      filter_aci, filter_is_credit, filter_intracountry (wildcard-aware, wired). Wildcard rules
      excluded from account-type rankings.
    usage: "`run: fee_rules_by_account_type(notional is 500) -> account_type_fee_ranking` — cheapest account type first."
  - name: fee_rules_by_account_type.account_type_fee_ranking
    kind: view
    summary: Per account-type letter — matching rule count and avg/min/max scenario fee, cheapest first.
    usage: "Refine order/limit for extremum questions."
  - name: fee_rule_aci_rows / fee_rule_mcc_rows / fee_rule_account_type_rows
    kind: source (projection helpers)
    summary: Non-parameterized exploded rule rows (unnest of the list field); building blocks for the parameterized ranking sources.
    usage: "Prefer the parameterized wrappers; use these directly only for raw exploration of list memberships."
provides_for:
  - "average-scenario fee questions at a hypothetical transaction value (rule-space, no transactions)"
  - "cheapest / most expensive card scheme, ACI, MCC, or account type at a notional amount"
  - "applicable fee IDs for a stated set of attribute constraints (wildcard-inclusive matching)"
  - "MCC description-to-code resolution when filtering fee rules by business description"
  - "input building block for transaction-space fee attribution layers (they reuse the same wildcard match semantics)"
