file: c4_payments_enriched.malloy
domain: payments fee optimization
summary: >
  Transaction-grain source (one row per payment, 2023) with every fee-rule
  match input materialized as a REAL local column: card_scheme, aci,
  is_credit, intracountry flag (boolean + 0/1 numeric matching
  fees.intracountry encoding), merchant account_type, merchant MCC,
  capture-delay bucket (merchant setting mapped to the fee-rule bucket
  domain '<3'/'3-5'/'>5'/'immediate'/'manual'), and the merchant's
  natural-month volume/fraud tier strings (exact fees.monthly_volume /
  fees.monthly_fraud_level domains) plus raw monthly EUR volume and fraud
  ratio. Built via join_one to merchants_base and merchant_monthly_metrics
  then projected, so downstream fact×rule join_many predicates reference
  only local columns (one join level deep). Also carries period dimensions
  (transaction_date, month_of_year, day_of_year) and transaction reporting
  measures/views.
exports:
  - name: payments_enriched
    kind: source
    summary: Payment grain enriched with merchant + monthly-tier rule-match inputs; primary_key psp_reference; base-grain measures (transaction_count, total/avg/min/max amount, fraud count/amount/volume ratio, credit and intracountry shares).
    usage: "run: payments_enriched -> { where: merchant = 'X' and transaction_date ? @2023-12; aggregate: total_amount }; filter periods with transaction_date ? @2023-… or day_of_year = N."
  - name: rule_match_inputs
    kind: view
    summary: One row per payment with all fee-rule matching attributes (scheme, aci, credit, intracountry_num, account type, MCC, capture-delay bucket, volume/fraud tier) plus amount and period fields.
    usage: "run: payments_enriched -> rule_match_inputs + { where: merchant = 'X' and month_of_year = 10; limit: 100 }"
  - name: amount_by_card_scheme
    kind: view
    summary: Transaction count, total/avg amount, fraud volume ratio per card scheme.
    usage: "run: payments_enriched -> amount_by_card_scheme + { where: merchant = 'X' and transaction_date ? @2023-05 to @2023-07 }"
  - name: amount_by_aci
    kind: view
    summary: Transaction count, total/avg amount, credit share per ACI.
    usage: "scope with where: (merchant, period, has_fraudulent_dispute) then read counts/amounts per aci"
  - name: amount_by_issuing_country
    kind: view
    summary: Count, total and average transaction value per issuing country, sorted ascending by avg.
    usage: "run: payments_enriched -> amount_by_issuing_country + { where: merchant = 'X' and card_scheme = 'NexPay' and transaction_date ? @2023-05 to @2023-07 }"
  - name: amount_by_merchant
    kind: view
    summary: Volume/count/avg/fraud ratio per merchant.
    usage: "optionally scope to a period, then rank by total_amount"
  - name: amount_by_merchant_month
    kind: view
    summary: Merchant × natural-month rollup carrying the matched volume/fraud tier labels.
    usage: "run: payments_enriched -> amount_by_merchant_month + { where: merchant = 'X' }"
provides_for:
  - "fact×rule fee matching: join_many fees onto this source's LOCAL columns (merchant_account_type, merchant_mcc, capture_delay_bucket, volume_tier, fraud_tier, aci, card_scheme, is_credit, intracountry_num) with wildcard branches"
  - "per-merchant / per-period fee totals and applicable-fee-ID sets (downstream matched source)"
  - "counterfactual sweeps (ACI override, scheme steering, MCC change) re-using the same materialized match inputs"
  - "reporting: average/total transaction value by scheme, ACI, issuing country, merchant, month"
