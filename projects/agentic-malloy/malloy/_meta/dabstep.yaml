file: dabstep.malloy
domain: payments / fees — thin top-level layer
summary: |
  Adds the few extras on top of the c1..c4 intermediates that the train-question
  set needs but the existing sources don't already cover, while preserving the
  thin-answer principle: every question is one filter + select on a NAMED view
  or measure here. Specifically: (1) an MCC counter-factual fee join
  (`fees_any_mcc` + `mcc_scenario_fee`) for "what if merchant had MCC=X" deltas;
  (2) per-candidate-ACI scenario measures `aci_scenario_fee_A..G` plus the
  `aci_scenarios` / `aci_scenarios_by_merchant` views so ACI-steering questions
  are one aggregate; (3) two small enumerated cross-join sources
  (`fees_per_mcc`, `fees_per_aci`) that give per-candidate-MCC and
  per-candidate-ACI average fees at a given transaction value — the only path
  Malloy doesn't already give us for the "most expensive MCC / ACI" questions.
  Everything else (fee_by_merchant_year/month/day, applicable_rule_ids_by_*,
  scheme_scenarios_by_merchant, rule_breakdown, by_card_scheme on fees_base)
  is already named on the intermediates.
exports:
  - name: dabstep
    kind: source
    summary: |
      Extension of c4_fee_application. Adds the MCC counter-factual fee join
      and per-ACI candidate scenario measures.
  - name: dabstep.mcc_scenario_fee
    kind: measure
    summary: |
      Total fee if the merchant's MCC were swapped to a candidate MCC. Add
      `{ where: list_contains!boolean(fees_any_mcc.merchant_category_code, X)
                or len!number(fees_any_mcc.merchant_category_code) = 0 }`
      plus merchant + period filters to compare against `total_fee`.
  - name: dabstep.aci_scenarios
    kind: view
    summary: |
      Seven measures `aci_scenario_fee_A..G` in one row — total fee if all
      filtered traffic were steered to that ACI. Filter the row set first
      (e.g. has_fraudulent_dispute, merchant, transaction_month).
  - name: dabstep.aci_scenarios_by_merchant
    kind: view
    summary: Same, grouped by merchant.
  - name: fees_per_mcc
    kind: source
    summary: |
      Cross-join of MCC reference × fee rules, filtered to applicable rules
      (rule's MCC list contains the MCC or is wildcard). Group by mcc for
      "most expensive MCC at V EUR" questions; exposes
      avg_fee_on_{100,1000,50000}_eur and the most_expensive_mcc_50000 view.
  - name: fees_per_aci
    kind: source
    summary: |
      Cross-join of ACI codes {A..G} × fee rules, filtered to applicable rules
      (rule's ACI list contains the ACI or is wildcard). Group by aci with
      optional card_scheme/is_credit filters for "most expensive ACI" Qs.
provides_for:
  - "fee total by merchant for a year/month/day (use c4_fee_application views fee_by_merchant_year/month/day)"
  - "applicable fee IDs for merchant in period (c4_fee_application.applicable_rule_ids_by_merchant[_month])"
  - "which merchants are affected by a given fee ID (applicable_rule_ids_by_merchant + filter on rule_id)"
  - "scheme steering — cheapest/most-expensive scheme per merchant per period (c4_fee_application.scheme_scenarios_by_merchant)"
  - "ACI steering for (fraudulent) txns — cheapest ACI to incentivize (dabstep.aci_scenarios[_by_merchant] + where has_fraudulent_dispute)"
  - "delta if a rule's rate changed (c4_fee_application.rule_breakdown gives rule_volume_eur; delta = (new_rate - old_rate) * rule_volume_eur / 10000)"
  - "delta if a merchant's MCC had been different (dabstep.mcc_scenario_fee with list_contains filter on fees_any_mcc.merchant_category_code, vs total_fee)"
  - "average fee per card scheme at a given txn value V (fees_base by_card_scheme: avg_fixed_amount + avg_rate*V/10000)"
  - "average fee for account_type / MCC / credit / scheme combos (fees_base with wildcard-aware filters: (len!number(account_type)=0 or list_contains!boolean(account_type,'H')) etc.)"
  - "most expensive MCC at txn value V (fees_per_mcc.most_expensive_mcc_50000 / by_mcc with avg_fee_on_*_eur)"
  - "most expensive / cheapest ACI for credit X-scheme at V (fees_per_aci.by_aci_credit_globalcard_100 / by_aci with filters)"
  - "fee IDs matching synthetic (account_type, aci) combos (fees_base + wildcard-aware filters)"
  - "average transaction value by issuing_country / period for a merchant (payments_base / c2_payments group_by issuing_country)"
