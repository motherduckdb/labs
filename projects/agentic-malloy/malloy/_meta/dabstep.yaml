file: dabstep.malloy
domain: Payment processing — merchants, transactions, and wildcard-encoded fee rules; fee resolution, totals, and counterfactual (steering / rate / MCC / rule-scope) analysis.
summary: >
  Thin top layer of named, reusable queries over the intermediate sources. The heavy
  lifting (fee-rule wildcard matching, monthly volume/fraud bucketing, counterfactual
  fan-outs) lives in transaction_fees, fee_rules, scheme_steering, fraud_aci_steering,
  mcc_change_scenario, and rule_scope_change; every query here is answerable with a
  thin `+ { where: ... }` refinement. Parameterized concepts (fee at a notional,
  rate-change delta, MCC-change delta, rule-scope narrowing) are invoked directly on
  their parameterized sources as documented per export.
exports:
  - name: fees_by_merchant_day
    kind: query
    summary: Total/avg resolved fees per merchant per day of year (actual rule matches summed per transaction).
    usage: "run: fees_by_merchant_day + { where: merchant = 'X' and day_of_year = 10 } — total_fee_amount is the euros owed that day."
  - name: fees_by_merchant
    kind: query
    summary: Total fees paid per merchant over all matched traffic (full-year 2023 by default).
    usage: "run: fees_by_merchant + { where: merchant = 'X' } — read total_fee_amount."
  - name: fees_by_merchant_month
    kind: query
    summary: Total fees per merchant per natural calendar month.
    usage: "run: fees_by_merchant_month + { where: merchant = 'X' and month_num = 12 }."
  - name: applicable_fee_ids_by_merchant
    kind: query
    summary: Per merchant, the distinct fee-rule IDs that match its actual transactions (wildcard rules included).
    usage: "run: applicable_fee_ids_by_merchant + { where: merchant = 'X' and month_num = 10 } — read the nested fee_ids list; add day_of_year for a single day."
  - name: merchants_matched_by_fee
    kind: query
    summary: Merchants (with traffic/fee totals) matched by each fee rule — the inverse of applicability.
    usage: "run: merchants_matched_by_fee + { where: matched_fee_id = 17 } — the merchant column is the affected set."
  - name: scheme_steering_ranking
    kind: query
    summary: Counterfactual total fee per merchant if all its traffic ran on each card scheme (ascending = cheapest).
    usage: "run: scheme_steering_ranking + { where: merchant = 'X'; limit: 1 } for the minimum; order_by: steered_total_fee desc for the maximum; add month_num for one month."
  - name: scheme_steering_ranking_by_month
    kind: query
    summary: Scheme-steering totals at merchant × month grain.
    usage: "run: scheme_steering_ranking_by_month + { where: merchant = 'X' and month_num = 2; limit: 1 }."
  - name: fraud_aci_preference
    kind: query
    summary: Counterfactual fees per candidate ACI for a merchant's fraud-flagged traffic, no-op candidate excluded (ascending = preferred).
    usage: "run: fraud_aci_preference + { where: merchant = 'X'; limit: 1 }; add month_num in the where for a single month."
  - name: fraud_aci_preference_by_scheme
    kind: query
    summary: Fraud-traffic ACI steering broken out by card scheme (scheme:fee shaped ranking).
    usage: "run: fraud_aci_preference_by_scheme + { where: merchant = 'X'; limit: 1 } — cheapest candidate_aci × scheme pair first."
  - name: fee_match_conservation
    kind: query
    summary: Validation — every transaction must match ≥1 rule; unmatched_transaction_count must be 0.
    usage: "run: fee_match_conservation (optionally + a merchant/period where) and assert unmatched_transaction_count = 0."
  - name: avg_amount_by_issuing_country
    kind: query
    summary: Average/total transaction value by issuing country over enriched payments.
    usage: "run: avg_amount_by_issuing_country + { where: merchant = 'X' and card_scheme = 'NexPay' and month_num ? 5 to 6 }."
  - name: merchant_predicate_profile
    kind: query
    summary: Per merchant-month, all fee-rule matching inputs (account type, MCC, capture-delay bucket, monthly volume/fraud buckets) plus traffic totals.
    usage: "run: merchant_predicate_profile + { where: merchant = 'X' } — use to inspect why rules do/don't match."
provides_for:
  - "Fee at a notional / average-scenario rankings: run the parameterized rule source directly, e.g. `run: fee_rules(notional is 50) -> avg_fee_by_card_scheme` (also avg_fee_by_aci, avg_fee_by_mcc, avg_fee_by_account_type); scope with for_card_scheme / for_account_type / for_mcc_description / for_credit etc."
  - "Rule ID lookup by attribute filters (no traffic): `run: fee_rules(for_account_type is 'D', for_aci is 'F') -> matching_rule_ids`."
  - "Rate-change delta: `run: transaction_fees(target_fee_id is N, new_rate is R) -> rate_change_delta_by_merchant + { where: merchant = 'X' and month_num = 12 }` — zero delta when R equals the rule's own rate."
  - "MCC-change delta: `run: mcc_change_scenario(new_mcc is 7523) -> mcc_change_by_merchant + { where: merchant = 'X' }` — read mcc_change_delta."
  - "Rule-scope narrowing impact: `run: rule_scope_change(target_fee_id is N, override_account_type is 'S') -> affected_merchants`."
  - "Descriptive payments/merchant slices: payments_base, payments_enriched, merchant_profiles, merchant_monthly_metrics views (by_merchant, by_card_scheme, merchant_bucket_profile, profile, codes_by_description on merchant_category_codes_base for MCC text → code resolution)."
