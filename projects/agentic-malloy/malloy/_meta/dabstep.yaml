file: dabstep.malloy
domain: Payment processing fee analytics — merchant transactions matched to a wildcard fee ruleset (two-part tariff fixed + rate/10000), plus fee scenario/optimization surfaces.
summary: >
  Thin top-level layer over the intermediate sources. `dabstep` is the central
  fact×rule source: every transaction (at the enriched match-key grain from
  c2_payments_enriched.match_keys) fans out via join_many to EVERY fee rule it
  satisfies, using wildcard-aware matching (empty list / NULL rule field = applies
  to all) on card_scheme, account_type, capture_delay band, monthly_fraud_level
  band, monthly_volume band, MCC, is_credit, aci, and intracountry. It exposes
  named views for the hardest recurring shapes — applicable fee IDs, merchants
  affected by a rule, and total fees paid per merchant / month / day — as thin
  filter+select surfaces. Enumeration and detail views drop phantom unmatched
  left-join rows (rule.ID is null) so no fee/ID column ever carries a wildcard
  NULL artifact. Averaged/ranked "which scheme/ACI/MCC/account_type is cheapest/
  most expensive" and counterfactual steering/delta scenarios live in the
  c4_* and c5_* sources; use those directly.
exports:
  - name: dabstep
    kind: source
    summary: >
      Central per-(transaction, matching fee rule) source. Grain fans out one row
      per (txn, rule) match. txn_count/matched_rule_count/applicable_fee_id_count
      and total_fees/avg_fee_per_match/min_fee_per_match/max_fee_per_match are the
      reusable measures; `fee` is the per-match two-part tariff.
    usage: >
      Scope with where: on merchant + `year`/`month`/day_of_year (e.g.
      `where: merchant = 'X', `month` = @2023-12`), then pick a view. For
      "total fees a merchant paid" use total_fees_by_merchant(_month/_day).
  - name: applicable_fee_ids
    kind: view
    summary: Distinct fee-rule IDs that match the scoped transactions (wildcard-aware), unmatched rows excluded.
    usage: >
      `run: dabstep -> applicable_fee_ids + { where: merchant = 'X', `month` = @2023-10 }`
      — collect the fee_id column as the comma list.
  - name: affected_merchants
    kind: view
    summary: Distinct merchants whose scoped transactions match at least one fee rule; filter to one rule.ID for "merchants affected by fee N".
    usage: >
      `run: dabstep -> affected_merchants + { where: `year` = @2023 and rule.ID = 17 }`
      (rule.ID reachable via the join) — enumerate merchant column.
  - name: total_fees_by_merchant
    kind: view
    summary: Total fees each merchant pays over the scoped period (sum of per-txn fee across its matching rules).
    usage: >
      `run: dabstep -> total_fees_by_merchant + { where: merchant = 'X' and `year` = @2023 }`
      — read total_fees (round to 2 decimals).
  - name: total_fees_by_merchant_month
    kind: view
    summary: Total fees per merchant × natural calendar month.
    usage: >
      `run: dabstep -> total_fees_by_merchant_month + { where: merchant = 'X' and `month` = @2023-12 }`.
  - name: total_fees_by_merchant_day
    kind: view
    summary: Total fees per merchant × day_of_year (for "Nth of the year" questions).
    usage: >
      `run: dabstep -> total_fees_by_merchant_day + { where: merchant = 'X' and day_of_year = 10 and `year` = @2023 }`.
  - name: transaction_rule_fees
    kind: view
    summary: Per (transaction, matching rule) detail with the computed fee; matched rules only (no NULL-fee phantom rows).
    usage: >
      `run: dabstep -> transaction_rule_fees + { where: merchant = 'X' and day_of_year = 10 }`
      — inspect/aggregate individual fee rows; sum `fee` for a hand total.
provides_for:
  - Applicable fee IDs for a merchant over a period (year / month / day-of-year)
  - Merchants affected by a given fee rule ID (incl. attribute-change variants via scoping)
  - Total payment processing fees a merchant pays over a year / month / day
  - Per-transaction fee detail (fixed_amount + rate*amount/10000) across all matching rules
  - Feeding scheme/ACI/MCC/account-type ranking and steering/delta scenarios (via c4_*/c5_* sources)
