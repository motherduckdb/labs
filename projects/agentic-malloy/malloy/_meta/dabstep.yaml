file: dabstep.malloy
domain: payments
summary: >
  Central analytical layer joining payments, fees, merchants and MCC lookups.
  Provides an enriched per-transaction source `txn` whose `fees` join_many
  expands every applicable fee rule (matching across the 9 fee-rule dimensions
  with the documented "null / empty list = wildcard" semantics) so total fees
  paid = sum(fixed_amount + rate/10000 * eur_amount) over matched rules.
  Adds standalone `fees`, `fee_rules`, `fees_by_mcc`, `fees_by_aci`,
  `fees_by_account_type` sources to support hypothetical-scenario questions
  (average fee for an X-EUR transaction by card_scheme / MCC / ACI / account
  type) without needing a real transaction.
exports:
  - name: txn
    kind: source
    summary: >
      Per-transaction source with monthly volume/fraud bucket, merchant
      account_type/MCC/capture_delay enrichment, intracountry flag, and a
      join_many to `fees` implementing the 9-dimension wildcard match.
      Measures: transaction_count, total_eur, fraud_count, fraud_eur,
      total_fees, matched_fee_rule_count, matched_fee_id_count.
  - name: fees
    kind: source
    summary: Plain fee-rule source with rate_pct/rate_fraction helpers.
  - name: fee_rules
    kind: source
    summary: >
      Fee-rule source exploded by aci_value and account_type_value (wildcards
      expanded to all 7 ACIs / all 6 account types). Use this for "average
      scenario" / hypothetical-amount questions per card_scheme/account_type/
      ACI; provides fee_on_50/100/1000/4321/50000 and their averages.
  - name: fees_by_mcc
    kind: source
    summary: >
      Fee-rule source exploded by MCC (only rules with explicit MCC list).
      Provides fee_on_100/1000/50000 and their averages per mcc.
  - name: fees_by_aci
    kind: source
    summary: Alias of fee_rules for ACI-centric queries.
  - name: fees_by_account_type
    kind: source
    summary: Alias of fee_rules for account-type-centric queries.
  - name: merchants
    kind: source
    summary: Merchants registry with account_type_label.
  - name: mcc_lookup
    kind: source
    summary: MCC code → description lookup with numeric mcc_num.
provides_for:
  - cheapest/most expensive card scheme for an X EUR transaction (avg scenario)
  - applicable fee IDs for a merchant over a year / month / specific day
  - total fees paid by a merchant in a year / month / day
  - which merchants are affected by a given fee ID
  - hypothetical fee delta when changing a fee rule's rate/account_type/MCC
  - per-card-scheme min/max fee for a merchant in a year/month (steering)
  - per-ACI fee for a merchant to incentivize cheaper interactions
  - average fee by account_type / MCC / card_scheme for a hypothetical amount
  - most expensive MCC for a transaction of N EUR
  - per-country transaction stats for a merchant/card_scheme/date-range
