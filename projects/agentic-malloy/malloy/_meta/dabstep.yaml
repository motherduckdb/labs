file: dabstep.malloy
domain: payment processing fees — merchant transactions matched against wildcard fee rules
summary: >
  Thin top layer completing the semantic stack. Adds the card-scheme steering
  counterfactual (the one sweep the intermediates did not cover): a
  transaction × candidate-scheme grid rematched against the fee-rule table so
  "which scheme minimizes/maximizes a merchant's fees in a period" is a single
  filtered view. All other question shapes are already served by the
  intermediates: fee_rule_quotes (hypothetical/average-scenario fees at a
  notional value, sweeps over scheme/ACI/MCC/account type/credit),
  fee_matching (actual per-transaction rule matching: total fees paid,
  applicable fee IDs, merchants affected, rate-change deltas, MCC/account-type
  overrides), fee_scenarios (ACI-steering sweeps for fraudulent traffic,
  targeted-rule before/after merchant sets), merchant_profile,
  merchant_monthly_metrics, and payments_enriched (plain transaction analytics).
exports:
  - name: card_scheme_universe
    kind: source
    summary: Distinct card schemes observed in payments; candidate universe for the scheme sweep.
    usage: "run: card_scheme_universe -> { select: card_scheme }"
  - name: scheme_scenario_grid
    kind: source
    summary: Transaction × candidate-scheme grid (payments_enriched cross-joined with the scheme universe, candidate materialized as a local column). Grain = payment × scheme.
    usage: "Building block for fee_scheme_steering; rarely queried directly."
  - name: fee_scheme_steering
    kind: source
    summary: >
      Scheme-steering counterfactual: every transaction rematched against fee
      rules as if processed on each candidate scheme (all wildcard branches
      preserved; monthly volume/fraud tiers held at actuals). Match-grain
      measures: steering_total_fees_eur, steering_avg_fee_per_txn,
      steering_fee_id_count; base-grain txn_count uses distinct psp_reference.
      Views: scheme_sweep (one row per candidate scheme), scheme_sweep_by_merchant,
      scheme_sweep_by_month, actual_scheme_baseline (candidate = actual).
    usage: >
      Scope to merchant + period, then rank: run: fee_scheme_steering ->
      scheme_sweep + { where: merchant = 'X' and `year` = 2023 and
      month_of_year = 6 } — min fees = first row (order is total asc); max fees
      = order_by steering_total_fees_eur desc, limit 1. Report as
      scheme:total rounded to 2 decimals.
provides_for:
  - "steer-traffic-to-scheme optimization: min/max total fees per candidate scheme for a merchant and period (year, month, day range)"
  - "per-scheme counterfactual fee totals and per-transaction averages over any transaction subset (e.g. fraudulent only, one ACI, one country)"
  - "baseline actual per-scheme fee totals via actual_scheme_baseline (cross-check against fee_matching.fees_by_card_scheme)"
  - "complements the intermediates: use fee_rule_quotes for notional-value quotes, fee_matching for actual totals/applicable fee IDs/rate deltas, fee_scenarios for ACI steering and rule-scope what-ifs"
