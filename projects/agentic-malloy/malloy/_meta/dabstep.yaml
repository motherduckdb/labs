file: dabstep.malloy
domain: payments-fees
summary: |
  Thin top-level semantic layer over the payments/fees data set. Re-exports
  the intermediate sources (c1_payments, c2_merchant_monthly,
  c3_transaction_fees, c4_fee_scenarios + ACI/MCC explosions) under short
  stable names, and adds a few composed views (fraud-fee-by-merchant-ACI,
  fees-by-merchant×year×scheme, fees-by-merchant×month×scheme,
  merchants-by-fee×year) so each train question reduces to a one-stage
  Malloy query — no joins or fee-formula logic at the query site.
exports:
  - name: payments
    kind: source
    summary: Per-transaction payments enriched with merchant attributes (account_type, capture_delay, MCC, MCC description) and an intracountry int flag. Alias of c1_payments.
  - name: merchant_months
    kind: source
    summary: One row per (merchant, year, month) with total/fraud EUR volume, monthly_volume_tier and monthly_fraud_level_tier matching the fees.json bucket strings. Alias of c2_merchant_monthly.
  - name: txn_fees
    kind: source
    summary: Transaction × matched-fee-rule grain with the effective per-pair fee. Exposes total_fee_amount / avg_fee_amount / matched_pair_count plus views fees_by_merchant_year, _month, _scheme, _aci, applicable_fee_ids_by_merchant_year/_month/_day, fraud_fee_by_merchant_aci_month/_year, fees_by_merchant_year_scheme, fees_by_merchant_month_scheme, merchants_by_fee_year.
  - name: scenarios
    kind: source
    summary: Rule-grain "average scenario" fees at canonical EUR values (50, 100, 1000, 4321, 50000); views by_scheme_at_50/100/1000/4321 and by_scheme_credit_at_1000. Filter via list_contains!boolean(account_type, 'H') etc.
  - name: scenarios_by_aci
    kind: source
    summary: Fee rules exploded by ACI letter (NULL aci expanded to A..G); view by_aci_at_100_credit_globalcard for the credit-100-GlobalCard question.
  - name: scenarios_by_mcc
    kind: source
    summary: Fee rules exploded by MCC number, joined to description; view by_mcc_at_50000 for "most expensive MCC for a 50 000 EUR transaction".
  - name: fees
    kind: source
    summary: Raw fee-rules catalog (alias of fees_base) for direct fee-ID lookups (e.g. "fee IDs that apply to account_type=D and aci=F" via list_contains).
  - name: merchants
    kind: source
    summary: Merchant directory (alias of merchants_base) — account_type, capture_delay, acquirer list, MCC.
  - name: mcc
    kind: source
    summary: MCC catalog with descriptions (alias of merchant_category_codes_base) — used to resolve descriptions like "Taxicabs and Limousines" → 4121.
  - name: acquirers
    kind: source
    summary: Acquirer-country directory (alias of acquirer_countries_base).
provides_for:
  - cheapest_card_scheme_average_scenario
  - most_expensive_card_scheme_average_scenario
  - average_fee_by_account_type_mcc_scheme_value
  - most_expensive_aci_credit_globalcard_100
  - most_expensive_mcc_at_50000
  - fee_ids_by_account_type_and_aci
  - applicable_fee_ids_by_merchant_year
  - applicable_fee_ids_by_merchant_month
  - applicable_fee_ids_by_merchant_day
  - merchants_affected_by_fee_id_in_year
  - total_fees_by_merchant_year
  - total_fees_by_merchant_month
  - total_fees_by_merchant_day
  - steer_scheme_min_or_max_year
  - steer_scheme_min_or_max_month
  - move_fraud_to_cheaper_aci
  - fee_delta_rate_change_scenario
  - mcc_change_what_if_scenario
  - avg_transaction_value_by_issuing_country
