file: dabstep.malloy
domain: payments fee optimization — merchants, transactions, and a wildcard-encoded fee rulebook
summary: >
  Thin top-level surface over the intermediate layer. fee_rulebook is the hypothetical/
  notional-fee surface (fee = fixed_amount + rate * notional / 10000 per rule) with a
  non-null default notional of 100 EUR so its rankings always compute; every match_*
  parameter narrows the matching rule set with full wildcard semantics (NULL scalar /
  empty list = applies to all). merchant_fees is the actual-traffic surface: each
  transaction of payments_enriched fanned against every matching fee rule
  (transaction_fees), with totals, applicable fee IDs, affected merchants, and rate/
  fixed-amount override deltas. Counterfactual re-matching (scheme steering, ACI
  steering, MCC/account-type changes) lives on fee_scheme_steering, fee_aci_steering,
  and fee_scenarios, which are used directly.
exports:
  - name: fee_rulebook
    kind: source (parameterized)
    summary: >
      Fee rulebook filtered by scenario parameters, pricing each rule at a caller-set
      notional (default 100 EUR). Inherits fee_rules views: applicable_rule_ids,
      applicable_rule_detail, scenario_fee_summary, scheme_fee_ranking(_desc),
      aci_fee_ranking(_desc), mcc_fee_ranking(_desc). Rankings by ACI/MCC use only
      rules that name the value specifically (wildcard rules carry no signal).
    usage: >
      run: fee_rulebook(notional is 50) -> scheme_fee_ranking  (cheapest scheme in the
      average scenario; add match_is_credit / match_account_type / match_mcc etc. to
      restrict; scenario_fee_summary gives the avg fee number; mcc_fee_ranking_desc +
      cheapest/most_expensive rank=1 lists ties).
  - name: rules_by_fee_at_notional
    kind: view (on fee_rulebook)
    summary: Per-rule price list at the notional, most expensive first; constrained_field_count=0 flags pure-wildcard rules.
    usage: "run: fee_rulebook(notional is 50000, match_card_scheme is 'NexPay') -> rules_by_fee_at_notional"
  - name: merchant_fees
    kind: source (parameterized)
    summary: >
      Actual transactions × matching fee rules (one join level, wildcard branches on
      every field). Inherits transaction_fees views: total_fees_summary,
      applicable_fee_ids, affected_merchants, fee_ids_by_merchant, fees_by_merchant,
      fees_by_merchant_month, fees_by_scheme, fees_by_aci, per_transaction_fees; and
      measures total_fee_amount (money number), fee_delta_at_new_rate /
      fee_delta_at_new_fixed_amount (scope with where: rules.ID = <id>). Base-grain
      inherited measures are fan-out inflated — use matched_txn_count / distinct counts.
    usage: >
      Scope merchant + period last-mile: run: merchant_fees -> total_fees_summary +
      { where: merchant = 'X' and txn_month ? @2023-12 }; applicable fee IDs: ->
      applicable_fee_ids + { where: merchant = 'X' and `year` = 2023 }; rate-change
      delta: run: merchant_fees(new_rate is 1) -> { where: rules.ID = 141 and merchant
      = 'X' and txn_month ? @2023-12; aggregate: fee_delta_at_new_rate }.
  - name: fees_by_merchant_day
    kind: view (on merchant_fees)
    summary: Total/avg fees per merchant per calendar day (txn_date reconstructed from year + day_of_year).
    usage: "run: merchant_fees -> fees_by_merchant_day + { where: merchant = 'X' and day_of_year = 10 and `year` = 2023 }"
provides_for:
  - "cheapest / most expensive card scheme, ACI, or MCC at any notional amount (fee_rulebook rankings, ties share rank 1)"
  - "average scenario fee for a scheme under account-type / MCC / credit filters (fee_rulebook scenario_fee_summary)"
  - "applicable fee IDs and total fees paid for a merchant in a day / month / year (merchant_fees)"
  - "merchants affected by a given fee rule (merchant_fees affected_merchants scoped to rules.ID)"
  - "fee delta under a rule rate / fixed-amount override (merchant_fees delta measures)"
  - "scheme steering and fraud-ACI steering rankings (fee_scheme_steering / fee_aci_steering, used directly)"
  - "fee delta under a merchant MCC / account-type change and rule-restriction membership changes (fee_scenarios, used directly)"
