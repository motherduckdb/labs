file: c3_merchant_monthly_metrics.malloy
domain: payments fee optimization — merchant monthly volume & fraud tiers
summary: >
  Per-merchant natural-calendar-month aggregates computed from payments (2023):
  total transaction volume in EUR, fraudulent-dispute volume in EUR, transaction
  count, and the volume-weighted fraud ratio (fraud volume / total volume, in
  percent). Each merchant-month is bucketed into the EXACT tier strings used by
  the fee rule table — volume_tier in {'<100k','100k-1m','1m-5m','>5m'} and
  fraud_tier in {'<7.2%','7.2%-7.7%','7.7%-8.3%','>8.3%'} — so this source is the
  canonical input for matching fee rules' monthly_volume and monthly_fraud_level
  fields. Grain: one row per merchant × year × month (primary_key
  merchant_month_key). Months follow natural boundaries derived from day_of_year.
exports:
  - name: merchant_monthly_metrics
    kind: source
    summary: >
      Merchant × natural-month grain source with monthly_volume_eur,
      monthly_fraud_volume_eur, monthly_txn_count, fraud_ratio_pct, and the
      fee-rule-domain tier labels volume_tier / fraud_tier. Measures cover the
      full sum/avg/min/max set over monthly volume and fraud ratio plus
      month_count. Joinable by merchant (and month_num/year) into rule-matching
      pipelines; primary_key merchant_month_key makes it safe on the many side
      of a join.
    usage: "run: merchant_monthly_metrics -> { where: merchant = 'X' and month_num = 10; select: volume_tier, fraud_tier, monthly_volume_eur, fraud_ratio_pct }"
  - name: monthly_tiers
    kind: view
    summary: One row per merchant-month with raw aggregates plus the matched volume_tier and fraud_tier labels — the direct feed for fee-rule tier matching.
    usage: "run: merchant_monthly_metrics -> monthly_tiers + { where: merchant = 'X' and month_num ? 5 to 6 }"
  - name: by_merchant
    kind: view
    summary: Per-merchant rollup across months — total/avg/min/max monthly volume and fraud-ratio range, month coverage count.
    usage: "run: merchant_monthly_metrics -> by_merchant + { where: merchant = 'X' }"
  - name: volume_tier_distribution
    kind: view
    summary: Count of merchant-months falling in each fee-rule monthly-volume tier.
    usage: "run: merchant_monthly_metrics -> volume_tier_distribution"
  - name: fraud_tier_distribution
    kind: view
    summary: Count of merchant-months falling in each fee-rule monthly-fraud-level tier.
    usage: "run: merchant_monthly_metrics -> fraud_tier_distribution"
provides_for:
  - "Fee-rule applicability matching: supplies the volume_tier / fraud_tier strings (exact fees.monthly_volume / fees.monthly_fraud_level domains) per merchant-month for wildcard-aware rule matching."
  - "Enriched transaction pipelines: join by merchant + month to stamp each payment with its month's tier before matching fee rules."
  - "Monthly reporting: merchant volume and euro-weighted fraud-level trends over natural months."
