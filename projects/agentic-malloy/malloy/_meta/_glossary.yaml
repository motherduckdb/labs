{
  "glossary": [
    {
      "term": "fee rule",
      "aliases": [
        "fee",
        "fee ID",
        "Fee with ID",
        "rule",
        "pricing rule"
      ],
      "kind": "entity",
      "definition": "A row in the fee rule dataset defining pricing (fixed amount + variable rate) that applies when a transaction/merchant matches the rule's characteristics (scheme, account type, capture delay, monthly fraud level, monthly volume, MCC, credit flag, ACI, intracountry). Null or empty-list fields are wildcards that match all values.",
      "grounding": {
        "tables": [
          "fees"
        ],
        "columns": [
          "fees.ID",
          "fees.card_scheme",
          "fees.account_type",
          "fees.capture_delay",
          "fees.monthly_fraud_level",
          "fees.monthly_volume",
          "fees.merchant_category_code",
          "fees.is_credit",
          "fees.aci",
          "fees.fixed_amount",
          "fees.rate",
          "fees.intracountry"
        ],
        "derivation": "SELECT * FROM fees WHERE ID = :fee_id"
      },
      "modeling_pattern": "Rule table with wildcard semantics: NULL scalars and empty lists ([]) mean 'applies to all values of that field'. Matching must treat wildcard rows as common to all groups."
    },
    {
      "term": "fee amount",
      "aliases": [
        "fee for a transaction",
        "fee charged",
        "transaction fee",
        "cost of a transaction"
      ],
      "kind": "measure",
      "definition": "The euro cost of processing one transaction under a matched fee rule: fee = fixed_amount + rate * transaction_value / 10000, where rate is in basis-points-like units (divide by 10000).",
      "grounding": {
        "tables": [
          "fees",
          "payments"
        ],
        "columns": [
          "fees.fixed_amount",
          "fees.rate",
          "payments.eur_amount"
        ],
        "derivation": "fee_eur = fees.fixed_amount + fees.rate * :transaction_value / 10000  -- :transaction_value defaults to payments.eur_amount for actual transactions, or a parameter for hypotheticals"
      },
      "modeling_pattern": "Fee at a parameterizable notional amount: same formula serves actual transactions (eur_amount) and what-if quotes at a user-supplied value."
    },
    {
      "term": "fee at a notional transaction value",
      "aliases": [
        "fee for a transaction value of X EUR",
        "hypothetical fee",
        "quoted fee",
        "average fee for a transaction of X"
      ],
      "kind": "measure",
      "definition": "The fee computed at a user-supplied (parameter) transaction value rather than an observed payment, typically averaged/min/max over the set of fee rules matching stated constraints (scheme, account type, MCC, credit, ACI, etc.).",
      "grounding": {
        "tables": [
          "fees"
        ],
        "columns": [
          "fees.fixed_amount",
          "fees.rate"
        ],
        "derivation": "AVG/MIN/MAX(fixed_amount + rate * :notional / 10000) OVER matching fee rules, where matching applies wildcard semantics on constrained fields"
      },
      "modeling_pattern": "Parameterize the notional; never hardcode example amounts. 'Average scenario' = mean over all rules satisfying the given constraints (unconstrained fields include wildcard and non-wildcard rules alike)."
    },
    {
      "term": "applicable fee rules for a merchant",
      "aliases": [
        "applicable Fee IDs",
        "fees that apply to a merchant",
        "merchants affected by a fee"
      ],
      "kind": "operation",
      "definition": "The set of fee rules that match a merchant's characteristics (account type, MCC, capture delay) and its transactions' characteristics (card scheme, credit flag, ACI, intracountry) plus its monthly aggregates (volume, fraud level) in a given period. The inverse operation identifies which merchants a given fee rule affects.",
      "grounding": {
        "tables": [
          "fees",
          "merchants",
          "payments"
        ],
        "columns": [
          "merchants.account_type",
          "merchants.merchant_category_code",
          "merchants.capture_delay",
          "payments.card_scheme",
          "payments.is_credit",
          "payments.aci",
          "payments.issuing_country",
          "payments.acquirer_country"
        ],
        "derivation": "JOIN payments p ON p.merchant = merchants.merchant; rule matches iff for each fee field: field IS NULL OR list is empty OR merchant/transaction value ∈ field; monthly_volume and monthly_fraud_level matched against per-natural-month aggregates of payments"
      },
      "modeling_pattern": "Multi-attribute rule-matching join with wildcard rows common to all groups; expose both the specific match grain (per transaction) and the effective grain (distinct fee IDs per merchant-period)."
    },
    {
      "term": "total fees paid",
      "aliases": [
        "total fees in euros",
        "fees that a merchant paid",
        "total fee cost"
      ],
      "kind": "measure",
      "definition": "Sum over a merchant's transactions in a period of the fee computed from each transaction's matched fee rule: Σ (fixed_amount + rate * eur_amount / 10000).",
      "grounding": {
        "tables": [
          "payments",
          "fees",
          "merchants"
        ],
        "columns": [
          "payments.eur_amount",
          "payments.merchant",
          "payments.day_of_year",
          "payments.year",
          "fees.fixed_amount",
          "fees.rate"
        ],
        "derivation": "SUM(matched_fee.fixed_amount + matched_fee.rate * p.eur_amount / 10000) over payments p filtered to :merchant and :period, joined to the matching fee rule per transaction"
      },
      "modeling_pattern": "Per-transaction rule match then aggregate; period boundaries follow natural months / day_of_year / year."
    },
    {
      "term": "card scheme",
      "aliases": [
        "scheme",
        "network",
        "card network"
      ],
      "kind": "dimension",
      "definition": "The card network the transaction is processed on (e.g. GlobalCard, NexPay, SwiftCharge, TransactPlus). Fee rules are scheme-specific; merchants can 'steer traffic' between schemes to minimize/maximize fees.",
      "grounding": {
        "tables": [
          "payments",
          "fees"
        ],
        "columns": [
          "payments.card_scheme",
          "fees.card_scheme"
        ],
        "derivation": "GROUP BY / FILTER on card_scheme; join key between transaction and fee rules"
      },
      "modeling_pattern": "Comparison dimension for steering scenarios: recompute total or average fees per scheme and pick MIN or MAX."
    },
    {
      "term": "merchant",
      "aliases": [
        "merchant partner",
        "store",
        "business"
      ],
      "kind": "entity",
      "definition": "A business processing payments, described by its account type, merchant category code, capture delay setting, and acquirer(s).",
      "grounding": {
        "tables": [
          "merchants",
          "payments"
        ],
        "columns": [
          "merchants.merchant",
          "merchants.account_type",
          "merchants.merchant_category_code",
          "merchants.capture_delay",
          "merchants.acquirer",
          "payments.merchant"
        ],
        "derivation": "merchants joined to payments on merchant name"
      }
    },
    {
      "term": "account type",
      "aliases": [
        "merchant account category",
        "account type R/D/H/F/S/O"
      ],
      "kind": "dimension",
      "definition": "Merchant categorization by business model: R (Enterprise-Retail), D (Enterprise-Digital), H (Enterprise-Hospitality), F (Platform-Franchise), S (Platform-SaaS), O (Other). Fee rules may restrict to a list of account types; an empty list matches all.",
      "grounding": {
        "tables": [
          "merchants",
          "fees"
        ],
        "columns": [
          "merchants.account_type",
          "fees.account_type"
        ],
        "derivation": "match iff fees.account_type = [] OR merchants.account_type = ANY(fees.account_type)"
      },
      "modeling_pattern": "List-membership match with empty-list wildcard."
    },
    {
      "term": "merchant category code",
      "aliases": [
        "MCC",
        "MCC code",
        "MCC description",
        "business category"
      ],
      "kind": "dimension",
      "definition": "Four-digit code classifying a merchant's business type, with a text description in the MCC reference list. Fee rules may restrict to a list of MCCs; empty list matches all. Users may reference MCCs by description (e.g. a category name) requiring lookup.",
      "grounding": {
        "tables": [
          "merchants",
          "fees",
          "merchant_category_codes"
        ],
        "columns": [
          "merchants.merchant_category_code",
          "fees.merchant_category_code",
          "merchant_category_codes.mcc",
          "merchant_category_codes.description"
        ],
        "derivation": "mcc = (SELECT CAST(mcc AS BIGINT) FROM merchant_category_codes WHERE description = :description); match iff fees.merchant_category_code = [] OR mcc = ANY(fees.merchant_category_code)"
      },
      "modeling_pattern": "Description-to-code lookup then list-membership wildcard match. Note mcc stored as VARCHAR in the reference table but BIGINT elsewhere (cast required)."
    },
    {
      "term": "Authorization Characteristics Indicator",
      "aliases": [
        "ACI",
        "transaction flow",
        "payment interaction",
        "interaction type"
      ],
      "kind": "dimension",
      "definition": "Standardized code A–G describing how the transaction was submitted (card present authenticated/non-authenticated, tokenized mobile, card-on-file, recurring, 3-D Secure, non-3-D Secure). Fee rules may restrict to a list of ACIs; empty list matches all.",
      "grounding": {
        "tables": [
          "payments",
          "fees"
        ],
        "columns": [
          "payments.aci",
          "fees.aci"
        ],
        "derivation": "match iff fees.aci = [] OR payments.aci = ANY(fees.aci)"
      },
      "modeling_pattern": "Both an observed transaction attribute and a steerable choice variable in what-if optimizations."
    },
    {
      "term": "credit transaction",
      "aliases": [
        "is_credit",
        "credit vs debit"
      ],
      "kind": "filter",
      "definition": "Whether the transaction was funded by credit. Credit transactions typically incur higher fees; fee rules may apply only to credit or only to debit (null = both).",
      "grounding": {
        "tables": [
          "payments",
          "fees"
        ],
        "columns": [
          "payments.is_credit",
          "fees.is_credit"
        ],
        "derivation": "match iff fees.is_credit IS NULL OR fees.is_credit = payments.is_credit"
      },
      "modeling_pattern": "Boolean with NULL wildcard in rules."
    },
    {
      "term": "domestic transaction",
      "aliases": [
        "intracountry",
        "local acquiring",
        "local transaction",
        "international / cross-border (negation)"
      ],
      "kind": "filter",
      "definition": "A transaction where the card's issuer country equals the acquirer country. International (cross-border) transactions, where they differ, typically carry higher fees. Fee rules carry an intracountry flag (1=domestic only, 0=international only, null=both).",
      "grounding": {
        "tables": [
          "payments",
          "fees"
        ],
        "columns": [
          "payments.issuing_country",
          "payments.acquirer_country",
          "fees.intracountry"
        ],
        "derivation": "is_intracountry = (payments.issuing_country = payments.acquirer_country); match iff fees.intracountry IS NULL OR fees.intracountry = CAST(is_intracountry AS DOUBLE)"
      },
      "modeling_pattern": "Derived boolean from two country columns; note fees.intracountry is encoded as DOUBLE {0,1,NULL}."
    },
    {
      "term": "capture delay",
      "aliases": [
        "authorization-to-settlement delay",
        "settlement timing"
      ],
      "kind": "dimension",
      "definition": "Days allowed between authorization capture and settlement. Fee rules use buckets ('<3', '3-5', '>5', 'immediate', 'manual'); merchants carry a concrete setting ('1', '2', '7', 'immediate', 'manual') that must be mapped into a bucket. Faster capture is more expensive.",
      "grounding": {
        "tables": [
          "merchants",
          "fees"
        ],
        "columns": [
          "merchants.capture_delay",
          "fees.capture_delay"
        ],
        "derivation": "map merchant value to bucket: numeric<3 → '<3'; 3–5 → '3-5'; >5 → '>5'; 'immediate'→'immediate'; 'manual'→'manual'; match iff fees.capture_delay IS NULL OR bucket = fees.capture_delay"
      },
      "modeling_pattern": "Value-to-range bucket mapping before wildcard rule match; the two tables use different encodings of the same concept."
    },
    {
      "term": "monthly volume",
      "aliases": [
        "monthly total volume",
        "volume tier",
        "processing volume"
      ],
      "kind": "measure",
      "definition": "A merchant's total transaction value in euros over a natural calendar month (day 1 to last day). Fee rules reference volume tiers ('<100k', '100k-1m', '1m-5m', '>5m'); higher volume generally yields cheaper fees.",
      "grounding": {
        "tables": [
          "payments",
          "fees"
        ],
        "columns": [
          "payments.eur_amount",
          "payments.merchant",
          "payments.year",
          "payments.day_of_year",
          "fees.monthly_volume"
        ],
        "derivation": "SUM(eur_amount) per merchant per natural month (derive month from day_of_year); parse fees.monthly_volume range string (k=1e3, m=1e6) and match iff NULL or volume within range"
      },
      "modeling_pattern": "Monthly aggregate compared against parsed range-string tiers; natural-month boundaries are mandatory."
    },
    {
      "term": "monthly fraud level",
      "aliases": [
        "fraud rate",
        "fraud level",
        "fraudulent volume ratio"
      ],
      "kind": "measure",
      "definition": "Ratio of fraudulent transaction volume to total transaction volume for a merchant in a natural month. Fee rules reference fraud tiers ('<7.2%', '7.2%-7.7%', '7.7%-8.3%', '>8.3%'); higher fraud means more expensive processing.",
      "grounding": {
        "tables": [
          "payments",
          "fees"
        ],
        "columns": [
          "payments.eur_amount",
          "payments.has_fraudulent_dispute",
          "payments.merchant",
          "fees.monthly_fraud_level"
        ],
        "derivation": "SUM(eur_amount) FILTER (WHERE has_fraudulent_dispute) / SUM(eur_amount) per merchant per natural month; parse percent-range string and match iff NULL or ratio within range"
      },
      "modeling_pattern": "Volume-weighted ratio (not transaction count) per natural month matched against parsed percent-range tiers."
    },
    {
      "term": "fraudulent transaction",
      "aliases": [
        "fraud",
        "fraudulent dispute",
        "fraudulent volume"
      ],
      "kind": "filter",
      "definition": "A transaction flagged as having a fraudulent dispute. Basis for fraud-level tiers and for what-if scenarios about steering fraudulent traffic to a different ACI.",
      "grounding": {
        "tables": [
          "payments"
        ],
        "columns": [
          "payments.has_fraudulent_dispute",
          "payments.eur_amount"
        ],
        "derivation": "WHERE has_fraudulent_dispute = TRUE"
      }
    },
    {
      "term": "cheapest / most expensive option",
      "aliases": [
        "lowest fees",
        "minimum fees",
        "maximum fees",
        "most expensive",
        "preferred choice",
        "steer traffic to"
      ],
      "kind": "operation",
      "definition": "Rank alternatives (card schemes, ACIs, MCCs) by the fee they would produce — either the average hypothetical fee at a notional value, or total fees recomputed over a merchant's actual transactions — and select the min or max.",
      "grounding": {
        "tables": [
          "fees",
          "payments",
          "merchants"
        ],
        "columns": [
          "fees.fixed_amount",
          "fees.rate",
          "fees.card_scheme",
          "fees.aci",
          "fees.merchant_category_code",
          "payments.eur_amount"
        ],
        "derivation": "For each candidate value of the choice dimension: compute fee metric under that value (rematching rules); ORDER BY metric ASC/DESC LIMIT 1; report ties as a list, resolving draws by a stated tiebreaker (e.g. alphabetical)"
      },
      "modeling_pattern": "Choice-variable sweep: substitute each candidate value into the rule-matching pipeline and compare aggregate fees; return all tied optima or apply deterministic tiebreak."
    },
    {
      "term": "ACI steering for fraudulent traffic",
      "aliases": [
        "move fraudulent transactions to a different ACI",
        "incentivize a different payment interaction"
      ],
      "kind": "scenario",
      "definition": "Counterfactual: take a merchant's fraudulent transactions in a period and assume they had been processed under an alternative ACI; recompute the fees per candidate ACI and choose the one minimizing cost.",
      "grounding": {
        "tables": [
          "payments",
          "fees",
          "merchants"
        ],
        "columns": [
          "payments.has_fraudulent_dispute",
          "payments.aci",
          "payments.eur_amount",
          "payments.card_scheme",
          "fees.aci",
          "fees.fixed_amount",
          "fees.rate"
        ],
        "derivation": "FOR each candidate_aci: SUM(fee) over fraudulent transactions with aci overridden to candidate_aci (rules rematched with the override); pick candidate_aci with minimum total"
      },
      "modeling_pattern": "Counterfactual attribute-override join: replace one transaction attribute, rerun rule matching, compare aggregates across candidates."
    },
    {
      "term": "fee delta under rule change",
      "aliases": [
        "delta if the relative fee changed",
        "what delta would the merchant pay",
        "rate change what-if"
      ],
      "kind": "scenario",
      "definition": "Counterfactual: change one parameter of a specific fee rule (typically the variable rate, called the 'relative fee') to a new value, recompute the merchant's total fees for a period, and report the difference versus the original total.",
      "grounding": {
        "tables": [
          "payments",
          "fees",
          "merchants"
        ],
        "columns": [
          "fees.ID",
          "fees.rate",
          "fees.fixed_amount",
          "payments.eur_amount"
        ],
        "derivation": "delta = Σ_over_transactions_matching_rule( fixed_amount + :new_rate * eur_amount/10000 ) − Σ( fixed_amount + rate * eur_amount/10000 ) = (:new_rate − rate) * Σ(eur_amount of matching transactions) / 10000"
      },
      "modeling_pattern": "Counterfactual rule-parameter override: only transactions matched to the targeted fee ID contribute to the delta; new rate is a parameter."
    },
    {
      "term": "merchant attribute change what-if",
      "aliases": [
        "if the merchant had changed its MCC",
        "if the fee only applied to account type X",
        "hypothetical scope change"
      ],
      "kind": "scenario",
      "definition": "Counterfactual altering a merchant attribute (e.g. MCC) or a fee rule's scope (e.g. restricting account_type), then re-deriving which rules match and either the resulting fee delta or the set of affected merchants.",
      "grounding": {
        "tables": [
          "merchants",
          "fees",
          "payments"
        ],
        "columns": [
          "merchants.merchant_category_code",
          "merchants.account_type",
          "fees.account_type",
          "fees.merchant_category_code"
        ],
        "derivation": "Override merchant/rule attribute with parameter, rerun rule-matching over the period's transactions, and compute delta in total fees or DIFF/set of merchants matching the rule before vs after"
      },
      "modeling_pattern": "Counterfactual override join at the merchant or rule grain; result is either a fee delta or a merchant set."
    },
    {
      "term": "period",
      "aliases": [
        "in 2023",
        "in December",
        "for the Nth day of the year",
        "between May and June",
        "month of February"
      ],
      "kind": "dimension",
      "definition": "Time scoping expressed as a year, a natural calendar month, a month range, or an ordinal day of the year. Payments carry year and day_of_year (no explicit month); months are derived from day_of_year using the calendar (2023 is non-leap).",
      "grounding": {
        "tables": [
          "payments"
        ],
        "columns": [
          "payments.year",
          "payments.day_of_year",
          "payments.hour_of_day",
          "payments.minute_of_hour"
        ],
        "derivation": "month = MONTH(DATE(year,1,1) + (day_of_year - 1) days); filters: year = :y, day_of_year = :n, month IN (:m1..:m2)"
      },
      "modeling_pattern": "Derive natural months from day_of_year; all monthly measures (volume, fraud level) use natural-month boundaries starting day 1."
    },
    {
      "term": "transaction value",
      "aliases": [
        "amount",
        "EUR amount",
        "average transaction value"
      ],
      "kind": "measure",
      "definition": "The euro value of a payment, used as the multiplicand in fee computation and aggregated (avg/sum) in reporting.",
      "grounding": {
        "tables": [
          "payments"
        ],
        "columns": [
          "payments.eur_amount"
        ],
        "derivation": "eur_amount; AVG(eur_amount) / SUM(eur_amount) grouped by requested dimensions"
      }
    },
    {
      "term": "issuing country",
      "aliases": [
        "issuer country",
        "cardholder country"
      ],
      "kind": "dimension",
      "definition": "Country of the card issuer for a transaction; compared with the acquirer country to determine domestic vs international, and used as a grouping dimension.",
      "grounding": {
        "tables": [
          "payments"
        ],
        "columns": [
          "payments.issuing_country",
          "payments.acquirer_country"
        ],
        "derivation": "GROUP BY issuing_country; intracountry = (issuing_country = acquirer_country)"
      }
    },
    {
      "term": "acquirer",
      "aliases": [
        "acquiring bank",
        "acquirer country",
        "local acquirer"
      ],
      "kind": "entity",
      "definition": "The bank processing the merchant's transactions. Merchants list their acquirer(s); each acquirer maps to a country, which determines the acquirer country used in the domestic/international distinction.",
      "grounding": {
        "tables": [
          "merchants",
          "acquirer_countries",
          "payments"
        ],
        "columns": [
          "merchants.acquirer",
          "acquirer_countries.acquirer",
          "acquirer_countries.country_code",
          "payments.acquirer_country"
        ],
        "derivation": "UNNEST(merchants.acquirer) JOIN acquirer_countries ON acquirer; payments already denormalize acquirer_country per transaction"
      },
      "modeling_pattern": "List-valued merchant attribute joined to a country lookup; the transaction table carries the resolved acquirer_country."
    },
    {
      "term": "average scenario",
      "aliases": [
        "in general",
        "on average",
        "average fee across rules"
      ],
      "kind": "scenario",
      "definition": "Evaluation mode where a hypothetical fee is computed as the mean over all fee rules matching the stated constraints, without weighting by actual transaction mix — used to compare schemes, ACIs, or MCCs in the abstract.",
      "grounding": {
        "tables": [
          "fees"
        ],
        "columns": [
          "fees.fixed_amount",
          "fees.rate"
        ],
        "derivation": "AVG(fixed_amount + rate * :notional / 10000) GROUP BY :choice_dimension over rules matching the given filters (wildcards included)"
      },
      "modeling_pattern": "Unweighted mean over the matched rule set; contrast with 'actual' mode which weights by observed transactions."
    }
  ]
}
