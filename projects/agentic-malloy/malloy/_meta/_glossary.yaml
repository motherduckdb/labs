{
  "glossary": [
    {
      "term": "merchant",
      "aliases": [
        "merchant partner",
        "store",
        "the merchant <name>"
      ],
      "kind": "entity",
      "definition": "A business processing payments through the platform, described by its account type, merchant category code, capture delay setting, and acquirer relationships.",
      "grounding": {
        "tables": [
          "merchants",
          "payments"
        ],
        "columns": [
          "merchants.merchant",
          "merchants.account_type",
          "merchants.merchant_category_code",
          "merchants.capture_delay",
          "merchants.acquirer",
          "payments.merchant"
        ],
        "derivation": "merchants.merchant = payments.merchant (join key); merchant attributes drive fee-rule matching"
      },
      "modeling_pattern": "Dimension table joined to fact table by name; merchant attributes are the merchant-side predicates of fee rules"
    },
    {
      "term": "transaction",
      "aliases": [
        "payment",
        "traffic",
        "transactions processed"
      ],
      "kind": "entity",
      "definition": "A single payment event with an amount in euros, a card scheme, an ACI, credit/debit flag, countries, timing fields, and fraud/refusal flags.",
      "grounding": {
        "tables": [
          "payments"
        ],
        "columns": [
          "psp_reference",
          "eur_amount",
          "card_scheme",
          "aci",
          "is_credit",
          "issuing_country",
          "acquirer_country",
          "year",
          "day_of_year",
          "has_fraudulent_dispute"
        ],
        "derivation": "One row per psp_reference in payments"
      },
      "modeling_pattern": "Fact table; each row is scored against fee rules to compute a per-transaction fee"
    },
    {
      "term": "fee rule",
      "aliases": [
        "fee",
        "fee with ID",
        "Fee ID",
        "rule"
      ],
      "kind": "entity",
      "definition": "A pricing rule keyed by ID that matches transactions on merchant characteristics (account type, MCC, capture delay, monthly volume, monthly fraud level) and transaction characteristics (card scheme, credit, ACI, intracountry), and defines the fee via a fixed amount plus a variable rate.",
      "grounding": {
        "tables": [
          "fees"
        ],
        "columns": [
          "ID",
          "card_scheme",
          "account_type",
          "capture_delay",
          "monthly_fraud_level",
          "monthly_volume",
          "merchant_category_code",
          "is_credit",
          "aci",
          "fixed_amount",
          "rate",
          "intracountry"
        ],
        "derivation": "fees rows keyed by ID; a rule applies to a transaction when every non-wildcard field matches"
      },
      "modeling_pattern": "Rule table with wildcard semantics: NULL scalar fields and empty-list fields ([] for account_type, merchant_category_code, aci) mean 'applies to all values of that field'; expose both the specific grain (declared values) and the effective grain (after wildcard expansion)"
    },
    {
      "term": "fee amount",
      "aliases": [
        "fee",
        "processing fee",
        "cost",
        "fee in euros"
      ],
      "kind": "measure",
      "definition": "The fee charged for a transaction under a given rule: fixed amount in euros plus a variable rate applied to the transaction value, in the same currency.",
      "grounding": {
        "tables": [
          "fees",
          "payments"
        ],
        "columns": [
          "fees.fixed_amount",
          "fees.rate",
          "payments.eur_amount"
        ],
        "derivation": "fee = fixed_amount + rate * transaction_value / 10000"
      },
      "modeling_pattern": "Fee at a parameterizable notional: transaction_value may be an actual payments.eur_amount or a user-supplied hypothetical amount"
    },
    {
      "term": "fee at a notional amount",
      "aliases": [
        "fee for a transaction value of X EUR",
        "fee for a X-euro transaction",
        "what would the fee be for X euros"
      ],
      "kind": "measure",
      "definition": "The fee a rule (or set of rules) would produce for a hypothetical transaction of a given value, without reference to actual transactions.",
      "grounding": {
        "tables": [
          "fees"
        ],
        "columns": [
          "fixed_amount",
          "rate"
        ],
        "derivation": "fee(:notional) = fixed_amount + rate * :notional / 10000, evaluated over the rules matching the user's filters"
      },
      "modeling_pattern": "Parameterized notional evaluation over the rule table only; the euro amount in the question is a parameter, never a constant of the concept"
    },
    {
      "term": "average scenario fee",
      "aliases": [
        "in the average scenario",
        "in general",
        "average fee a scheme would charge"
      ],
      "kind": "operation",
      "definition": "The mean of fee(:notional) across all fee rules matching a set of filters, used to compare schemes/ACIs/MCCs abstractly when no specific transaction context is given.",
      "grounding": {
        "tables": [
          "fees"
        ],
        "columns": [
          "card_scheme",
          "account_type",
          "aci",
          "merchant_category_code",
          "is_credit",
          "fixed_amount",
          "rate"
        ],
        "derivation": "AVG(fixed_amount + rate * :notional / 10000) GROUP BY the comparison dimension, over rules satisfying the filters (wildcard fields match everything)"
      },
      "modeling_pattern": "Unweighted average over matching rules; ranking (cheapest/most expensive) with deterministic tie-breaking (e.g. alphabetical) when requested"
    },
    {
      "term": "applicable fee IDs",
      "aliases": [
        "fee IDs applicable to a merchant",
        "which fees apply",
        "affected by the Fee with ID"
      ],
      "kind": "operation",
      "definition": "The set of fee rules whose predicates match a merchant's characteristics and its transactions' characteristics over a given period; conversely, the set of merchants matched by a given fee rule.",
      "grounding": {
        "tables": [
          "fees",
          "merchants",
          "payments"
        ],
        "columns": [
          "fees.ID",
          "fees.account_type",
          "fees.merchant_category_code",
          "fees.capture_delay",
          "fees.monthly_volume",
          "fees.monthly_fraud_level",
          "fees.card_scheme",
          "fees.is_credit",
          "fees.aci",
          "fees.intracountry",
          "merchants.account_type",
          "merchants.merchant_category_code",
          "merchants.capture_delay"
        ],
        "derivation": "rule applies iff for each rule field: field IS NULL / empty list, OR field contains/equals the merchant-or-transaction value (including derived monthly volume, monthly fraud level, and intracountry)"
      },
      "modeling_pattern": "Predicate-matching join between rule table and (merchant × transaction × derived monthly metrics); wildcard rows are common to all groups"
    },
    {
      "term": "total fees paid",
      "aliases": [
        "total fees in euros",
        "fees that <merchant> paid/should pay"
      ],
      "kind": "measure",
      "definition": "Sum over a merchant's transactions in a period of the fee computed from the matching fee rule for each transaction.",
      "grounding": {
        "tables": [
          "payments",
          "fees",
          "merchants"
        ],
        "columns": [
          "payments.eur_amount",
          "payments.merchant",
          "payments.card_scheme",
          "payments.is_credit",
          "payments.aci",
          "fees.fixed_amount",
          "fees.rate"
        ],
        "derivation": "SUM(fixed_amount + rate * eur_amount / 10000) over transactions in the period, each joined to its applicable fee rule"
      },
      "modeling_pattern": "Per-transaction rule resolution then aggregation; period bounded on natural calendar units"
    },
    {
      "term": "card scheme",
      "aliases": [
        "scheme",
        "network",
        "card network"
      ],
      "kind": "dimension",
      "definition": "The card network (e.g. Visa/Mastercard-style scheme) a transaction runs on and a fee rule applies to.",
      "grounding": {
        "tables": [
          "payments",
          "fees"
        ],
        "columns": [
          "payments.card_scheme",
          "fees.card_scheme"
        ],
        "derivation": "Direct equality between transaction scheme and rule scheme"
      }
    },
    {
      "term": "Authorization Characteristics Indicator (ACI)",
      "aliases": [
        "ACI",
        "payment interaction",
        "transaction flow",
        "interaction type"
      ],
      "kind": "dimension",
      "definition": "Standardized code (A–G) describing how a transaction was submitted to the acquirer, e.g. card present authenticated (B), tokenized mobile (C), card-on-file (D), recurring (E), 3-D Secure (F), non-3DS card-not-present (G).",
      "grounding": {
        "tables": [
          "payments",
          "fees"
        ],
        "columns": [
          "payments.aci",
          "fees.aci"
        ],
        "derivation": "payments.aci ∈ fees.aci (list membership; empty list = all ACIs)"
      },
      "modeling_pattern": "List-valued rule attribute with empty-list wildcard"
    },
    {
      "term": "account type",
      "aliases": [
        "account_type",
        "merchant account type"
      ],
      "kind": "dimension",
      "definition": "Merchant business-model classification: R (Enterprise-Retail), D (Enterprise-Digital), H (Enterprise-Hospitality), F (Platform-Franchise), S (Platform-SaaS), O (Other).",
      "grounding": {
        "tables": [
          "merchants",
          "fees"
        ],
        "columns": [
          "merchants.account_type",
          "fees.account_type"
        ],
        "derivation": "merchants.account_type ∈ fees.account_type (list membership; empty list = all account types)"
      },
      "modeling_pattern": "List-valued rule attribute with empty-list wildcard"
    },
    {
      "term": "merchant category code (MCC)",
      "aliases": [
        "MCC",
        "MCC code",
        "MCC description",
        "business category"
      ],
      "kind": "dimension",
      "definition": "Four-digit code classifying a merchant's business type, with a human-readable description; used in fee rule matching and risk assessment.",
      "grounding": {
        "tables": [
          "merchants",
          "fees",
          "merchant_category_codes"
        ],
        "columns": [
          "merchants.merchant_category_code",
          "fees.merchant_category_code",
          "merchant_category_codes.mcc",
          "merchant_category_codes.description"
        ],
        "derivation": "merchants.merchant_category_code ∈ fees.merchant_category_code (empty list = all); CAST(merchant_category_codes.mcc AS BIGINT) links code to description for lookups by name"
      },
      "modeling_pattern": "Users may reference MCC by numeric code or by description text; resolve description → code(s) via the lookup table; note mcc is stored as VARCHAR in the lookup"
    },
    {
      "term": "credit transaction",
      "aliases": [
        "credit",
        "is_credit",
        "credit vs debit"
      ],
      "kind": "filter",
      "definition": "Whether a transaction is paid on credit; credit transactions typically carry higher fees. Fee rules may target credit, debit, or both (NULL).",
      "grounding": {
        "tables": [
          "payments",
          "fees"
        ],
        "columns": [
          "payments.is_credit",
          "fees.is_credit"
        ],
        "derivation": "payments.is_credit = fees.is_credit OR fees.is_credit IS NULL"
      },
      "modeling_pattern": "NULL-as-wildcard scalar match"
    },
    {
      "term": "intracountry (domestic) transaction",
      "aliases": [
        "domestic",
        "local acquiring",
        "international",
        "cross-border"
      ],
      "kind": "filter",
      "definition": "A transaction where the card issuer country equals the acquirer country; international (cross-border) transactions are typically more expensive.",
      "grounding": {
        "tables": [
          "payments",
          "fees"
        ],
        "columns": [
          "payments.issuing_country",
          "payments.acquirer_country",
          "fees.intracountry"
        ],
        "derivation": "intracountry := (issuing_country = acquirer_country); matches fees.intracountry (1=domestic, 0=international, NULL=both)"
      },
      "modeling_pattern": "Derived boolean from two columns compared to a NULL-as-wildcard 0/1 rule field"
    },
    {
      "term": "capture delay",
      "aliases": [
        "capture to settlement time",
        "settlement delay"
      ],
      "kind": "dimension",
      "definition": "How quickly authorization is captured to settlement; faster capture is more expensive. Rules use bucketed values ('<3', '3-5', '>5', 'immediate', 'manual'); merchants store concrete settings ('1', '2', '7', 'immediate', 'manual').",
      "grounding": {
        "tables": [
          "merchants",
          "fees"
        ],
        "columns": [
          "merchants.capture_delay",
          "fees.capture_delay"
        ],
        "derivation": "Map merchant numeric day values into rule buckets ('1','2' → '<3'; '7' → '>5'; direct match for 'immediate'/'manual'); NULL rule value = all"
      },
      "modeling_pattern": "Bucket-mapping between concrete merchant values and range-coded rule values, with NULL wildcard"
    },
    {
      "term": "monthly volume",
      "aliases": [
        "monthly total volume",
        "volume tier",
        "processing volume"
      ],
      "kind": "measure",
      "definition": "A merchant's total transaction volume in euros over a natural calendar month; higher volume generally earns cheaper fees. Fee rules bucket it ('<100k', '100k-1m', '1m-5m', '>5m').",
      "grounding": {
        "tables": [
          "payments",
          "fees"
        ],
        "columns": [
          "payments.eur_amount",
          "payments.merchant",
          "payments.year",
          "payments.day_of_year",
          "fees.monthly_volume"
        ],
        "derivation": "SUM(eur_amount) per merchant per natural month (month derived from day_of_year within the year), then mapped into the rule's volume bucket; NULL rule value = all"
      },
      "modeling_pattern": "Derived monthly aggregate matched against range-string rule buckets; natural months start day 1 and end the last natural day"
    },
    {
      "term": "monthly fraud level",
      "aliases": [
        "fraud rate",
        "fraud level",
        "fraud ratio"
      ],
      "kind": "measure",
      "definition": "Ratio of fraudulent volume to total volume for a merchant in a natural month; higher fraud makes processing more expensive. Rules bucket it ('<7.2%', '7.2%-7.7%', '7.7%-8.3%', '>8.3%').",
      "grounding": {
        "tables": [
          "payments",
          "fees"
        ],
        "columns": [
          "payments.eur_amount",
          "payments.has_fraudulent_dispute",
          "payments.merchant",
          "fees.monthly_fraud_level"
        ],
        "derivation": "SUM(eur_amount WHERE has_fraudulent_dispute) / SUM(eur_amount) per merchant per natural month, mapped into the rule's fraud bucket; NULL rule value = all"
      },
      "modeling_pattern": "Volume-weighted ratio (not a count ratio) matched against percentage-range rule buckets"
    },
    {
      "term": "fraudulent transaction",
      "aliases": [
        "fraud",
        "fraudulent dispute",
        "fraudulent volume"
      ],
      "kind": "filter",
      "definition": "A transaction flagged as having a fraudulent dispute; the basis of fraud-rate metrics and fraud-reduction scenarios.",
      "grounding": {
        "tables": [
          "payments"
        ],
        "columns": [
          "has_fraudulent_dispute"
        ],
        "derivation": "has_fraudulent_dispute = TRUE"
      }
    },
    {
      "term": "time period",
      "aliases": [
        "in 2023",
        "in December",
        "the Nth day of the year",
        "between May and June",
        "month of February"
      ],
      "kind": "dimension",
      "definition": "Calendar slicing of transactions using year and day-of-year; months are natural calendar months derived from day_of_year.",
      "grounding": {
        "tables": [
          "payments"
        ],
        "columns": [
          "year",
          "day_of_year",
          "hour_of_day",
          "minute_of_hour"
        ],
        "derivation": "month(:d) via cumulative day-of-month boundaries for the (non-leap) year; day filter = day_of_year = :n; month filter = day_of_year BETWEEN month_start AND month_end"
      },
      "modeling_pattern": "No date column: reconstruct month/day from (year, day_of_year); monthly metrics must use natural month boundaries"
    },
    {
      "term": "scheme steering",
      "aliases": [
        "steer traffic to a card scheme",
        "which scheme to route to",
        "cheapest/most expensive scheme for the merchant"
      ],
      "kind": "scenario",
      "definition": "Counterfactual routing of all of a merchant's traffic in a period through each card scheme in turn, computing the total fees under each and ranking to find the minimum or maximum.",
      "grounding": {
        "tables": [
          "payments",
          "fees",
          "merchants"
        ],
        "columns": [
          "payments.eur_amount",
          "payments.aci",
          "payments.is_credit",
          "fees.card_scheme",
          "fees.fixed_amount",
          "fees.rate"
        ],
        "derivation": "For each scheme s: recompute per-transaction fees with card_scheme overridden to s (re-resolving applicable rules), sum over the period; return ARGMIN or ARGMAX over schemes"
      },
      "modeling_pattern": "Counterfactual override join: replace one transaction attribute, re-run rule matching, compare aggregate outcomes"
    },
    {
      "term": "ACI steering of fraudulent traffic",
      "aliases": [
        "move fraudulent transactions to a different ACI",
        "incentivize shoppers to use a different interaction",
        "preferred ACI with lowest fees"
      ],
      "kind": "scenario",
      "definition": "Counterfactual where a merchant's fraudulent transactions are re-submitted under an alternative ACI; the preferred choice is the ACI yielding the lowest total (or per-transaction) fees for that traffic.",
      "grounding": {
        "tables": [
          "payments",
          "fees",
          "merchants"
        ],
        "columns": [
          "payments.has_fraudulent_dispute",
          "payments.aci",
          "payments.eur_amount",
          "payments.card_scheme",
          "fees.aci",
          "fees.fixed_amount",
          "fees.rate"
        ],
        "derivation": "Take transactions WHERE has_fraudulent_dispute; for each candidate ACI a: override aci=a, re-resolve rules, compute total fee; return ARGMIN over ACIs (with deterministic tie-break)"
      },
      "modeling_pattern": "Counterfactual override join on the ACI attribute restricted to a fraud-flagged subset"
    },
    {
      "term": "fee-rate change delta",
      "aliases": [
        "delta if the relative fee of fee ID X changed to r",
        "what delta would the merchant pay"
      ],
      "kind": "scenario",
      "definition": "The difference in total fees a merchant pays over a period if a specific fee rule's variable rate were changed to a new value, all else equal.",
      "grounding": {
        "tables": [
          "payments",
          "fees"
        ],
        "columns": [
          "fees.ID",
          "fees.rate",
          "fees.fixed_amount",
          "payments.eur_amount"
        ],
        "derivation": "delta = SUM((:new_rate - rate) * eur_amount / 10000) over the merchant's transactions in the period to which rule :fee_id applies"
      },
      "modeling_pattern": "Counterfactual parameter override on a single rule (rate is the parameter, fee ID is the parameter); only transactions matched by that rule contribute to the delta"
    },
    {
      "term": "MCC change delta",
      "aliases": [
        "if the merchant had changed its MCC code to X",
        "amount delta in fees under a different MCC"
      ],
      "kind": "scenario",
      "definition": "The difference in total annual/period fees if a merchant's MCC had been a different code for the whole period, causing different fee rules to match.",
      "grounding": {
        "tables": [
          "payments",
          "fees",
          "merchants"
        ],
        "columns": [
          "merchants.merchant_category_code",
          "fees.merchant_category_code",
          "fees.fixed_amount",
          "fees.rate",
          "payments.eur_amount"
        ],
        "derivation": "delta = total_fees(merchant with MCC = :new_mcc) − total_fees(merchant with actual MCC), re-resolving applicable rules under each MCC"
      },
      "modeling_pattern": "Counterfactual override of a merchant attribute followed by full rule re-resolution and fee re-aggregation"
    },
    {
      "term": "rule scope change impact",
      "aliases": [
        "if the Fee with ID X was only applied to account type Y, which merchants would be affected"
      ],
      "kind": "scenario",
      "definition": "Given a hypothetical narrowing (or broadening) of a fee rule's predicates, the set of merchants whose applicability status for that rule changes over a period.",
      "grounding": {
        "tables": [
          "fees",
          "merchants",
          "payments"
        ],
        "columns": [
          "fees.ID",
          "fees.account_type",
          "merchants.account_type",
          "merchants.merchant"
        ],
        "derivation": "Compare {merchants matched by rule :fee_id as-is} vs {merchants matched with the overridden predicate}; affected = symmetric difference (typically those losing/gaining applicability)"
      },
      "modeling_pattern": "Counterfactual edit of a rule predicate, then set comparison of matched-merchant populations"
    },
    {
      "term": "average transaction value",
      "aliases": [
        "average amount",
        "average transaction value grouped by ..."
      ],
      "kind": "measure",
      "definition": "Mean euro amount of transactions matching a set of filters, grouped by a chosen dimension.",
      "grounding": {
        "tables": [
          "payments"
        ],
        "columns": [
          "eur_amount",
          "merchant",
          "card_scheme",
          "issuing_country",
          "day_of_year",
          "year"
        ],
        "derivation": "AVG(eur_amount) GROUP BY :dimension over filtered transactions"
      }
    },
    {
      "term": "issuing country",
      "aliases": [
        "issuer country",
        "country of the card"
      ],
      "kind": "dimension",
      "definition": "Country of the card issuer for a transaction; compared with the acquirer country to determine domestic vs international.",
      "grounding": {
        "tables": [
          "payments"
        ],
        "columns": [
          "issuing_country",
          "acquirer_country",
          "ip_country"
        ],
        "derivation": "Direct column; issuing_country = acquirer_country ⇒ intracountry"
      }
    },
    {
      "term": "acquirer",
      "aliases": [
        "acquiring bank",
        "acquirer country"
      ],
      "kind": "dimension",
      "definition": "The bank(s) through which a merchant processes transactions; each acquirer maps to a country, which defines the acquiring side of the domestic/international distinction.",
      "grounding": {
        "tables": [
          "merchants",
          "acquirer_countries",
          "payments"
        ],
        "columns": [
          "merchants.acquirer",
          "acquirer_countries.acquirer",
          "acquirer_countries.country_code",
          "payments.acquirer_country"
        ],
        "derivation": "UNNEST(merchants.acquirer) JOIN acquirer_countries ON acquirer to resolve country_code; payments.acquirer_country records the country used per transaction"
      },
      "modeling_pattern": "List-valued merchant attribute unnested and joined to a country lookup"
    },
    {
      "term": "shopper interaction channel",
      "aliases": [
        "POS vs Ecommerce",
        "in-store vs online",
        "payment interaction channel"
      ],
      "kind": "dimension",
      "definition": "Whether the transaction occurred at point-of-sale or online (e-commerce); relates to which ACIs are feasible (card-present vs card-not-present flows).",
      "grounding": {
        "tables": [
          "payments"
        ],
        "columns": [
          "shopper_interaction",
          "aci",
          "device_type"
        ],
        "derivation": "Direct column with values {'POS','Ecommerce'}"
      }
    }
  ]
}
