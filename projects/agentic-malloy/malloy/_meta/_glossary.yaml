{
  "glossary": [
    {
      "term": "fee",
      "aliases": [
        "payment processing fee",
        "transaction fee",
        "fee charged",
        "cost per transaction"
      ],
      "kind": "measure",
      "definition": "The cost charged for processing a single transaction under a matching fee rule, computed from a fixed component plus a variable rate applied to the transaction value.",
      "grounding": {
        "tables": [
          "fees",
          "payments"
        ],
        "columns": [
          "fees.fixed_amount",
          "fees.rate",
          "payments.eur_amount"
        ],
        "derivation": "fee = fees.fixed_amount + fees.rate * transaction_value / 10000, where transaction_value is payments.eur_amount (or a parameter)"
      },
      "modeling_pattern": "fee at a parameterizable notional (transaction_value can be a real payment amount or a hypothetical input value)"
    },
    {
      "term": "fee rule",
      "aliases": [
        "fee ID",
        "fee with ID",
        "Fee IDs",
        "rule fee"
      ],
      "kind": "entity",
      "definition": "A row in the fee ruleset identified by ID that specifies the conditions (merchant/transaction characteristics) under which a fixed_amount and rate apply.",
      "grounding": {
        "tables": [
          "fees"
        ],
        "columns": [
          "fees.ID",
          "fees.card_scheme",
          "fees.account_type",
          "fees.capture_delay",
          "fees.monthly_fraud_level",
          "fees.monthly_volume",
          "fees.merchant_category_code",
          "fees.is_credit",
          "fees.aci",
          "fees.fixed_amount",
          "fees.rate",
          "fees.intracountry"
        ],
        "derivation": "identity on fees table keyed by ID"
      }
    },
    {
      "term": "applicable fee rules for a merchant",
      "aliases": [
        "applicable fee IDs",
        "fees that apply",
        "which fees apply",
        "fee IDs applicable to"
      ],
      "kind": "operation",
      "definition": "The set of fee rules whose characteristic fields match a merchant's profile (and optionally the transactions in a period), respecting the convention that a null or empty-list field matches all values.",
      "grounding": {
        "tables": [
          "fees",
          "merchants",
          "payments"
        ],
        "columns": [
          "fees.card_scheme",
          "fees.account_type",
          "fees.capture_delay",
          "fees.monthly_fraud_level",
          "fees.monthly_volume",
          "fees.merchant_category_code",
          "fees.is_credit",
          "fees.aci",
          "fees.intracountry",
          "merchants.account_type",
          "merchants.merchant_category_code",
          "merchants.capture_delay",
          "payments.card_scheme",
          "payments.is_credit",
          "payments.aci"
        ],
        "derivation": "For each fee rule, match on every non-null/non-empty field against merchant attributes and/or transaction attributes; wildcard (null or empty list) matches any value"
      },
      "modeling_pattern": "wildcard-null/empty-list matching: a null scalar or empty list means 'applies to all values of that field'; match only on populated constraints"
    },
    {
      "term": "merchants affected by a fee rule",
      "aliases": [
        "which merchants were affected by the Fee",
        "merchants affected by this change"
      ],
      "kind": "operation",
      "definition": "The set of merchants for whom a given fee rule is applicable, i.e. whose profile and transactions satisfy the rule's non-wildcard conditions.",
      "grounding": {
        "tables": [
          "fees",
          "merchants",
          "payments"
        ],
        "columns": [
          "fees.ID",
          "merchants.merchant",
          "merchants.account_type",
          "merchants.merchant_category_code",
          "payments.merchant",
          "payments.card_scheme",
          "payments.aci",
          "payments.is_credit"
        ],
        "derivation": "reverse of applicable-fee matching: fix a fee ID, return distinct merchants whose attributes/transactions match its non-wildcard constraints"
      },
      "modeling_pattern": "reverse rule-to-population lookup with wildcard-null matching"
    },
    {
      "term": "total fees paid",
      "aliases": [
        "total fees in euros",
        "total fees that a merchant paid",
        "total fees to pay"
      ],
      "kind": "measure",
      "definition": "The sum over a merchant's transactions in a period of the fee computed from the applicable fee rule for each transaction.",
      "grounding": {
        "tables": [
          "payments",
          "fees"
        ],
        "columns": [
          "payments.merchant",
          "payments.eur_amount",
          "payments.day_of_year",
          "payments.year",
          "fees.fixed_amount",
          "fees.rate"
        ],
        "derivation": "sum over transactions of (matched_rule.fixed_amount + matched_rule.rate * payments.eur_amount / 10000) filtered to merchant and time window"
      },
      "modeling_pattern": "per-transaction fee resolution then aggregate over a time window"
    },
    {
      "term": "card scheme",
      "aliases": [
        "scheme",
        "card network",
        "network"
      ],
      "kind": "dimension",
      "definition": "The card network (e.g. GlobalCard, NexPay, SwiftCharge, TransactPlus) that a transaction runs on and that fee rules can be scoped to.",
      "grounding": {
        "tables": [
          "payments",
          "fees"
        ],
        "columns": [
          "payments.card_scheme",
          "fees.card_scheme"
        ],
        "derivation": "categorical value shared between payments and fees"
      }
    },
    {
      "term": "steer traffic to card scheme",
      "aliases": [
        "which card scheme to steer traffic to",
        "which scheme for minimum/maximum fees",
        "cheapest/most expensive card scheme"
      ],
      "kind": "scenario",
      "definition": "A comparison choosing the card scheme that yields the minimum or maximum total/average fee for a merchant's transactions, as a routing optimization.",
      "grounding": {
        "tables": [
          "payments",
          "fees"
        ],
        "columns": [
          "payments.card_scheme",
          "payments.eur_amount",
          "fees.card_scheme",
          "fees.fixed_amount",
          "fees.rate"
        ],
        "derivation": "for each card_scheme candidate, recompute fees over the merchant's transactions as if routed through that scheme, then argmin/argmax total fee"
      },
      "modeling_pattern": "counterfactual dimension override then argmin/argmax over candidate values"
    },
    {
      "term": "average fee scenario",
      "aliases": [
        "in the average scenario",
        "average fee",
        "what would the average fee be"
      ],
      "kind": "scenario",
      "definition": "The mean fee computed across the set of fee rules (or matching transactions) applicable to given characteristics for a fixed transaction value, rather than for a specific transaction.",
      "grounding": {
        "tables": [
          "fees"
        ],
        "columns": [
          "fees.fixed_amount",
          "fees.rate"
        ],
        "derivation": "average over matching fee rules of (fixed_amount + rate * transaction_value / 10000) for a parameter transaction_value and given filters"
      },
      "modeling_pattern": "aggregate fee across the set of matching rules at a parameterized notional"
    },
    {
      "term": "cheapest / most expensive fee",
      "aliases": [
        "minimum fee",
        "maximum fee",
        "lowest possible fee",
        "most expensive",
        "cheapest fee"
      ],
      "kind": "operation",
      "definition": "Selection of the option (card scheme, ACI, MCC, etc.) that minimizes or maximizes the computed fee for a given transaction value or set of transactions.",
      "grounding": {
        "tables": [
          "fees",
          "payments"
        ],
        "columns": [
          "fees.fixed_amount",
          "fees.rate",
          "payments.eur_amount"
        ],
        "derivation": "argmin/argmax over candidate dimension values of computed fee; ties broken by requested rule (e.g. lowest alphabetical order)"
      },
      "modeling_pattern": "argmin/argmax over a dimension with explicit tie-break rule"
    },
    {
      "term": "relative fee (rate)",
      "aliases": [
        "rate",
        "relative fee",
        "variable rate"
      ],
      "kind": "measure",
      "definition": "The variable component of a fee rule, multiplied by transaction value and divided by 10000 to produce the variable fee portion.",
      "grounding": {
        "tables": [
          "fees"
        ],
        "columns": [
          "fees.rate"
        ],
        "derivation": "variable_fee = fees.rate * transaction_value / 10000"
      }
    },
    {
      "term": "fixed fee amount",
      "aliases": [
        "fixed amount",
        "fixed fee",
        "fixed_amount"
      ],
      "kind": "measure",
      "definition": "The flat per-transaction component of a fee rule in euros.",
      "grounding": {
        "tables": [
          "fees"
        ],
        "columns": [
          "fees.fixed_amount"
        ],
        "derivation": "constant term of the fee formula"
      }
    },
    {
      "term": "fee change delta",
      "aliases": [
        "delta",
        "amount delta",
        "what delta would pay",
        "how much more/less would pay"
      ],
      "kind": "scenario",
      "definition": "The difference in total fees a merchant would pay between the actual fee configuration and a hypothetical one where a rule parameter (e.g. rate) is overridden to a given value.",
      "grounding": {
        "tables": [
          "payments",
          "fees"
        ],
        "columns": [
          "fees.ID",
          "fees.rate",
          "fees.fixed_amount",
          "payments.eur_amount",
          "payments.merchant"
        ],
        "derivation": "delta = sum(fee | modified_rule_parameter) - sum(fee | original_rule) over merchant transactions in period"
      },
      "modeling_pattern": "counterfactual parameter override then difference of aggregated measure"
    },
    {
      "term": "counterfactual MCC change",
      "aliases": [
        "if the merchant had changed its MCC",
        "changed MCC code to",
        "different MCC scenario"
      ],
      "kind": "scenario",
      "definition": "A hypothetical where a merchant's merchant category code is replaced, altering which fee rules match and thus the fees payable.",
      "grounding": {
        "tables": [
          "merchants",
          "fees",
          "payments"
        ],
        "columns": [
          "merchants.merchant_category_code",
          "fees.merchant_category_code",
          "payments.merchant",
          "payments.eur_amount"
        ],
        "derivation": "re-run fee matching and aggregation substituting merchants.merchant_category_code with the hypothetical MCC; compare to actual"
      },
      "modeling_pattern": "counterfactual attribute override join then re-aggregate/compare"
    },
    {
      "term": "fraud reallocation to ACI",
      "aliases": [
        "move fraudulent transactions to a different ACI",
        "steer shoppers to a different payment interaction",
        "preferred ACI for lowest fees"
      ],
      "kind": "scenario",
      "definition": "A scenario that reassigns fraudulent transactions from their current ACI to an alternative ACI (by changing shopper interaction) and evaluates which target ACI minimizes fees.",
      "grounding": {
        "tables": [
          "payments",
          "fees"
        ],
        "columns": [
          "payments.has_fraudulent_dispute",
          "payments.aci",
          "payments.shopper_interaction",
          "fees.aci",
          "fees.fixed_amount",
          "fees.rate"
        ],
        "derivation": "for fraudulent transactions, override aci to each candidate value, recompute fees, and select the ACI minimizing total fee"
      },
      "modeling_pattern": "subset (fraudulent) counterfactual dimension override then argmin over candidate ACI"
    },
    {
      "term": "Authorization Characteristics Indicator",
      "aliases": [
        "ACI",
        "authorization characteristic indicator",
        "payment interaction type"
      ],
      "kind": "dimension",
      "definition": "A code describing how a transaction was submitted to the acquirer (e.g. card present authenticated, card-on-file, 3-D Secure), used both on transactions and as a fee rule condition.",
      "grounding": {
        "tables": [
          "payments",
          "fees"
        ],
        "columns": [
          "payments.aci",
          "fees.aci"
        ],
        "derivation": "single-char code A–G on payments; list of allowed codes on fees (empty list = all)"
      }
    },
    {
      "term": "account type",
      "aliases": [
        "account_type",
        "merchant account type",
        "type of account"
      ],
      "kind": "dimension",
      "definition": "The merchant's business categorization (Retail, Digital, Hospitality, Franchise, SaaS, Other) used to scope fee rules.",
      "grounding": {
        "tables": [
          "merchants",
          "fees"
        ],
        "columns": [
          "merchants.account_type",
          "fees.account_type"
        ],
        "derivation": "scalar on merchants; list on fees (empty list = applies to all)"
      }
    },
    {
      "term": "merchant category code",
      "aliases": [
        "MCC",
        "MCC code",
        "MCC description",
        "category code"
      ],
      "kind": "dimension",
      "definition": "A four-digit industry classification code for a merchant, mappable to a text description, used for risk and fee determination.",
      "grounding": {
        "tables": [
          "merchants",
          "fees",
          "merchant_category_codes"
        ],
        "columns": [
          "merchants.merchant_category_code",
          "fees.merchant_category_code",
          "merchant_category_codes.mcc",
          "merchant_category_codes.description"
        ],
        "derivation": "join merchant/fee MCC to merchant_category_codes for description lookup; fees.merchant_category_code is a list (empty = all)"
      },
      "modeling_pattern": "code-to-description lookup; users may reference an MCC by its description"
    },
    {
      "term": "credit vs debit transaction",
      "aliases": [
        "credit transaction",
        "is_credit",
        "credit card transaction"
      ],
      "kind": "filter",
      "definition": "Whether a transaction is a credit transaction (typically more expensive) versus debit; a fee rule condition and a transaction attribute.",
      "grounding": {
        "tables": [
          "payments",
          "fees"
        ],
        "columns": [
          "payments.is_credit",
          "fees.is_credit"
        ],
        "derivation": "boolean match; fees.is_credit null = applies to all"
      }
    },
    {
      "term": "transaction value",
      "aliases": [
        "transaction value",
        "eur amount",
        "transaction of X euros",
        "amount"
      ],
      "kind": "measure",
      "definition": "The monetary value of a transaction in euros, used as the base for the variable fee and as an input parameter in fee scenarios.",
      "grounding": {
        "tables": [
          "payments"
        ],
        "columns": [
          "payments.eur_amount"
        ],
        "derivation": "payments.eur_amount, or a hypothetical parameter value in scenario questions"
      },
      "modeling_pattern": "parameterizable notional"
    },
    {
      "term": "average transaction value",
      "aliases": [
        "average transaction value",
        "avg eur_amount"
      ],
      "kind": "measure",
      "definition": "The mean of transaction values over a set of transactions, optionally grouped by a dimension.",
      "grounding": {
        "tables": [
          "payments"
        ],
        "columns": [
          "payments.eur_amount",
          "payments.issuing_country",
          "payments.merchant",
          "payments.card_scheme"
        ],
        "derivation": "avg(payments.eur_amount) filtered by merchant/scheme/period, grouped by chosen dimension"
      }
    },
    {
      "term": "fraudulent transaction",
      "aliases": [
        "fraudulent dispute",
        "fraud transaction",
        "fraudulent volume"
      ],
      "kind": "filter",
      "definition": "A transaction flagged as having a fraudulent dispute, used to compute fraud rate and to target fraud-reduction scenarios.",
      "grounding": {
        "tables": [
          "payments"
        ],
        "columns": [
          "payments.has_fraudulent_dispute",
          "payments.eur_amount"
        ],
        "derivation": "filter payments.has_fraudulent_dispute = true"
      }
    },
    {
      "term": "fraud rate",
      "aliases": [
        "fraud level",
        "monthly fraud level",
        "fraud ratio"
      ],
      "kind": "measure",
      "definition": "The ratio of fraudulent volume to total volume over a period; also expressed as banded ranges in fee rules.",
      "grounding": {
        "tables": [
          "payments",
          "fees"
        ],
        "columns": [
          "payments.has_fraudulent_dispute",
          "payments.eur_amount",
          "fees.monthly_fraud_level"
        ],
        "derivation": "sum(eur_amount where has_fraudulent_dispute) / sum(eur_amount) over month; matched against fees.monthly_fraud_level band"
      },
      "modeling_pattern": "computed ratio matched to a banded range string on the fee rule"
    },
    {
      "term": "monthly volume",
      "aliases": [
        "monthly volume",
        "monthly total volume",
        "volume band"
      ],
      "kind": "measure",
      "definition": "The total transaction volume of a merchant in a natural calendar month in euros; expressed as banded ranges in fee rules.",
      "grounding": {
        "tables": [
          "payments",
          "fees"
        ],
        "columns": [
          "payments.eur_amount",
          "payments.day_of_year",
          "fees.monthly_volume"
        ],
        "derivation": "sum(payments.eur_amount) per merchant per natural month; matched against fees.monthly_volume band"
      },
      "modeling_pattern": "computed aggregate matched to a banded range string; months are natural calendar months"
    },
    {
      "term": "capture delay",
      "aliases": [
        "capture delay",
        "capture to settlement time",
        "settlement timeframe"
      ],
      "kind": "dimension",
      "definition": "The number of days from authorization to settlement capture, both a merchant attribute and a fee rule condition (faster capture is more expensive).",
      "grounding": {
        "tables": [
          "merchants",
          "fees"
        ],
        "columns": [
          "merchants.capture_delay",
          "fees.capture_delay"
        ],
        "derivation": "merchant numeric/keyword value mapped to fee rule bands ('<3','3-5','>5','immediate','manual')"
      },
      "modeling_pattern": "merchant capture_delay reconciled to fee rule band buckets"
    },
    {
      "term": "intracountry / local acquiring",
      "aliases": [
        "intracountry",
        "domestic transaction",
        "local acquiring",
        "cross-border transaction"
      ],
      "kind": "filter",
      "definition": "Whether a transaction is domestic (issuer country equals acquirer country) versus international; a fee rule condition and a derived transaction property.",
      "grounding": {
        "tables": [
          "payments",
          "fees",
          "acquirer_countries"
        ],
        "columns": [
          "payments.issuing_country",
          "payments.acquirer_country",
          "fees.intracountry"
        ],
        "derivation": "intracountry = (payments.issuing_country = payments.acquirer_country); matched to fees.intracountry (null = all)"
      },
      "modeling_pattern": "derived boolean from comparing issuer vs acquirer country"
    },
    {
      "term": "merchant",
      "aliases": [
        "merchant",
        "merchant partner",
        "business"
      ],
      "kind": "entity",
      "definition": "A business processing payments, holding attributes (account type, MCC, capture delay, acquirers) that drive fee applicability.",
      "grounding": {
        "tables": [
          "merchants",
          "payments"
        ],
        "columns": [
          "merchants.merchant",
          "merchants.account_type",
          "merchants.merchant_category_code",
          "merchants.capture_delay",
          "merchants.acquirer",
          "payments.merchant"
        ],
        "derivation": "identity on merchants, joined to payments by merchant name"
      }
    },
    {
      "term": "time period filter",
      "aliases": [
        "in 2023",
        "in December 2023",
        "for the Nth day of the year",
        "between May and June",
        "month of February"
      ],
      "kind": "filter",
      "definition": "Restriction of transactions to a calendar window expressed as year, month, or day-of-year, used to scope aggregates and monthly-band computations.",
      "grounding": {
        "tables": [
          "payments"
        ],
        "columns": [
          "payments.year",
          "payments.day_of_year"
        ],
        "derivation": "filter by year and day_of_year; derive month from day_of_year for monthly aggregations (natural months)"
      },
      "modeling_pattern": "day_of_year to calendar-month mapping for natural-month aggregations"
    },
    {
      "term": "issuing country",
      "aliases": [
        "issuing_country",
        "issuer country",
        "card issuing country"
      ],
      "kind": "dimension",
      "definition": "The country that issued the card used in a transaction, used for grouping and for the domestic/international determination.",
      "grounding": {
        "tables": [
          "payments"
        ],
        "columns": [
          "payments.issuing_country",
          "payments.acquirer_country"
        ],
        "derivation": "categorical grouping key; compared with acquirer_country for intracountry"
      }
    },
    {
      "term": "shopper interaction",
      "aliases": [
        "shopper interaction",
        "payment interaction",
        "Ecommerce vs POS",
        "interaction type"
      ],
      "kind": "dimension",
      "definition": "How the shopper transacted (Ecommerce or POS), which relates to ACI selection and fraud-reallocation scenarios.",
      "grounding": {
        "tables": [
          "payments"
        ],
        "columns": [
          "payments.shopper_interaction",
          "payments.aci"
        ],
        "derivation": "categorical value on payments; influences feasible ACI reassignment"
      }
    }
  ]
}
