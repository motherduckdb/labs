{
  "glossary": [
    {
      "term": "Payment processing fee",
      "aliases": [
        "fee",
        "transaction fee",
        "fee charged",
        "fee amount"
      ],
      "kind": "measure",
      "definition": "The cost charged per transaction under a given fee rule, composed of a fixed per-transaction amount plus a variable rate applied to the transaction value.",
      "grounding": {
        "tables": [
          "fees",
          "payments"
        ],
        "columns": [
          "fees.fixed_amount",
          "fees.rate",
          "payments.eur_amount"
        ],
        "derivation": "fee = fixed_amount + rate * transaction_value / 10000"
      },
      "modeling_pattern": "fee at a parameterizable notional (transaction_value is an input parameter)"
    },
    {
      "term": "Fee rule",
      "aliases": [
        "Fee ID",
        "fee with ID",
        "rule",
        "fee rule"
      ],
      "kind": "entity",
      "definition": "A pricing rule in the fee dataset identified by its ID, specifying the characteristics (scheme, account type, MCC, ACI, credit, volume, fraud level, capture delay, intracountry) under which a fixed_amount and rate apply.",
      "grounding": {
        "tables": [
          "fees"
        ],
        "columns": [
          "fees.ID",
          "fees.card_scheme",
          "fees.account_type",
          "fees.capture_delay",
          "fees.monthly_fraud_level",
          "fees.monthly_volume",
          "fees.merchant_category_code",
          "fees.is_credit",
          "fees.aci",
          "fees.fixed_amount",
          "fees.rate",
          "fees.intracountry"
        ],
        "derivation": "one row per ID in fees"
      }
    },
    {
      "term": "Applicable fee rules",
      "aliases": [
        "applicable fee IDs",
        "fees that apply",
        "fee IDs applicable to",
        "which fees affect",
        "rules that apply"
      ],
      "kind": "operation",
      "definition": "The set of fee rules whose characteristic constraints all match a given merchant's profile and/or a transaction's attributes over a time window; a rule matches a field when the field is null/empty (applies to all) or contains the relevant value.",
      "grounding": {
        "tables": [
          "fees",
          "merchants",
          "payments"
        ],
        "columns": [
          "fees.card_scheme",
          "fees.account_type",
          "fees.merchant_category_code",
          "fees.capture_delay",
          "fees.is_credit",
          "fees.aci",
          "fees.monthly_volume",
          "fees.monthly_fraud_level",
          "fees.intracountry",
          "merchants.account_type",
          "merchants.merchant_category_code",
          "merchants.capture_delay",
          "payments.card_scheme",
          "payments.is_credit",
          "payments.aci"
        ],
        "derivation": "for each fee rule, match each constraint field against merchant/transaction value where (field IS NULL OR field=[] OR value IN field)"
      },
      "modeling_pattern": "wildcard rows (null/empty list) are common to all groups; match = wildcard OR membership across every characteristic"
    },
    {
      "term": "Total fees paid by a merchant over a period",
      "aliases": [
        "total fees in euros",
        "fees paid in 2023",
        "total fees that merchant should pay",
        "fees paid in December"
      ],
      "kind": "measure",
      "definition": "The sum across all of a merchant's transactions in a time window of each transaction's applicable fee, computed as fixed_amount + rate * eur_amount / 10000 using the matching fee rule.",
      "grounding": {
        "tables": [
          "payments",
          "fees",
          "merchants"
        ],
        "columns": [
          "payments.merchant",
          "payments.eur_amount",
          "payments.day_of_year",
          "payments.year",
          "fees.fixed_amount",
          "fees.rate"
        ],
        "derivation": "SUM over matched transactions of (fixed_amount + rate * eur_amount / 10000) for merchant filtered by time window"
      },
      "modeling_pattern": "join transactions to their matching fee rule, then aggregate fee over the period"
    },
    {
      "term": "Average fee scenario",
      "aliases": [
        "in the average scenario",
        "average fee",
        "what would be the average fee"
      ],
      "kind": "scenario",
      "definition": "A scenario that abstracts away merchant/transaction specifics and computes the mean fee across all fee rules matching a set of supplied characteristics for a given transaction value.",
      "grounding": {
        "tables": [
          "fees"
        ],
        "columns": [
          "fees.fixed_amount",
          "fees.rate",
          "fees.card_scheme",
          "fees.account_type",
          "fees.aci",
          "fees.is_credit",
          "fees.merchant_category_code"
        ],
        "derivation": "AVG over matching rules of (fixed_amount + rate * transaction_value / 10000)"
      },
      "modeling_pattern": "average over the set of applicable rules rather than over actual transactions"
    },
    {
      "term": "Cheapest/most expensive option",
      "aliases": [
        "cheapest fee",
        "most expensive fee",
        "minimum fees",
        "maximum fees",
        "lowest possible fees",
        "preferred choice"
      ],
      "kind": "operation",
      "definition": "Selection of the dimension value (card scheme, ACI, MCC, etc.) that minimizes or maximizes the resulting fee for a given context; ties may be broken by alphabetical order.",
      "grounding": {
        "tables": [
          "fees",
          "payments"
        ],
        "columns": [
          "fees.fixed_amount",
          "fees.rate",
          "fees.card_scheme",
          "fees.aci",
          "fees.merchant_category_code"
        ],
        "derivation": "argmin/argmax over candidate dimension values of computed fee"
      },
      "modeling_pattern": "rank computed fee across candidate values; deterministic tie-break (e.g. lowest alphabetical)"
    },
    {
      "term": "Card scheme",
      "aliases": [
        "scheme",
        "card network",
        "network",
        "which card scheme"
      ],
      "kind": "dimension",
      "definition": "The card network (e.g. GlobalCard, NexPay, SwiftCharge, TransactPlus) to which a transaction and fee rule belong; a key dimension for fee comparison and steering.",
      "grounding": {
        "tables": [
          "payments",
          "fees"
        ],
        "columns": [
          "payments.card_scheme",
          "fees.card_scheme"
        ],
        "derivation": "direct attribute"
      }
    },
    {
      "term": "Traffic steering",
      "aliases": [
        "steer traffic to",
        "which scheme should the merchant steer",
        "move transactions toward"
      ],
      "kind": "scenario",
      "definition": "A hypothetical reallocation of a merchant's transactions to a different card scheme (or ACI) to minimize or maximize total fees, holding the transaction mix otherwise constant.",
      "grounding": {
        "tables": [
          "payments",
          "fees"
        ],
        "columns": [
          "payments.merchant",
          "payments.card_scheme",
          "payments.eur_amount",
          "fees.card_scheme",
          "fees.fixed_amount",
          "fees.rate"
        ],
        "derivation": "for each candidate scheme, recompute total fee over the merchant's transactions; pick optimum"
      },
      "modeling_pattern": "counterfactual dimension override applied to all of a merchant's transactions, then re-aggregate"
    },
    {
      "term": "ACI (Authorization Characteristics Indicator)",
      "aliases": [
        "aci",
        "authorization characteristics indicator",
        "payment interaction",
        "transaction flow type"
      ],
      "kind": "dimension",
      "definition": "A code (A–G) describing how a transaction was submitted to the acquirer (card present/not present, authenticated, tokenized, 3-D Secure, recurring, etc.); used in fee rules and in steering analyses.",
      "grounding": {
        "tables": [
          "payments",
          "fees"
        ],
        "columns": [
          "payments.aci",
          "fees.aci"
        ],
        "derivation": "direct attribute; manual maps A–G to processing methods"
      }
    },
    {
      "term": "Fraud ACI re-routing scenario",
      "aliases": [
        "move fraudulent transactions to a different ACI",
        "incentivize shoppers to use a different payment interaction",
        "preferred ACI considering lowest fees"
      ],
      "kind": "scenario",
      "definition": "A scenario that reassigns a merchant's fraudulent transactions to an alternative ACI (by changing the shopper interaction) and evaluates which target ACI yields the lowest fees.",
      "grounding": {
        "tables": [
          "payments",
          "fees"
        ],
        "columns": [
          "payments.merchant",
          "payments.has_fraudulent_dispute",
          "payments.aci",
          "payments.shopper_interaction",
          "fees.aci",
          "fees.fixed_amount",
          "fees.rate"
        ],
        "derivation": "filter fraudulent transactions, for each candidate ACI recompute fee, pick minimum"
      },
      "modeling_pattern": "counterfactual override of ACI on a fraud-filtered subset, then fee minimization"
    },
    {
      "term": "Fraudulent transaction",
      "aliases": [
        "fraudulent dispute",
        "fraud",
        "fraudulent transactions"
      ],
      "kind": "filter",
      "definition": "A transaction flagged as having a fraudulent dispute; used both as a filter subset and as the numerator of fraud rate.",
      "grounding": {
        "tables": [
          "payments"
        ],
        "columns": [
          "payments.has_fraudulent_dispute"
        ],
        "derivation": "has_fraudulent_dispute = TRUE"
      }
    },
    {
      "term": "Fraud rate / monthly fraud level",
      "aliases": [
        "fraud level",
        "monthly fraud level",
        "fraud rate",
        "fraud ratio"
      ],
      "kind": "measure",
      "definition": "Ratio of fraudulent volume to total volume over a month; matched against banded fee-rule thresholds (e.g. '7.7%-8.3%', '<7.2%', '>8.3%').",
      "grounding": {
        "tables": [
          "payments",
          "fees"
        ],
        "columns": [
          "payments.has_fraudulent_dispute",
          "payments.eur_amount",
          "fees.monthly_fraud_level"
        ],
        "derivation": "SUM(eur_amount WHERE has_fraudulent_dispute)/SUM(eur_amount) per natural month; band-matched to fee rule"
      },
      "modeling_pattern": "ratio measure mapped onto banded string thresholds in fee rules"
    },
    {
      "term": "Monthly volume",
      "aliases": [
        "monthly total volume",
        "volume",
        "monthly volume band"
      ],
      "kind": "measure",
      "definition": "The total euro transaction volume of a merchant within a natural month; matched against banded fee-rule thresholds (e.g. '100k-1m').",
      "grounding": {
        "tables": [
          "payments",
          "fees"
        ],
        "columns": [
          "payments.eur_amount",
          "payments.merchant",
          "fees.monthly_volume"
        ],
        "derivation": "SUM(eur_amount) per merchant per natural month; band-matched to fee rule"
      },
      "modeling_pattern": "aggregate over natural calendar months mapped onto banded thresholds"
    },
    {
      "term": "Transaction value",
      "aliases": [
        "transaction value",
        "amount",
        "EUR amount",
        "transaction of X euros",
        "notional"
      ],
      "kind": "measure",
      "definition": "The monetary value of a transaction in euros, used both as the variable base for fee computation and as a slicing/parameter input.",
      "grounding": {
        "tables": [
          "payments"
        ],
        "columns": [
          "payments.eur_amount"
        ],
        "derivation": "eur_amount; used as parameter in fee = fixed_amount + rate * value / 10000"
      },
      "modeling_pattern": "fee at a parameterizable notional amount"
    },
    {
      "term": "Credit transaction",
      "aliases": [
        "credit transaction",
        "is_credit",
        "credit",
        "debit"
      ],
      "kind": "filter",
      "definition": "Whether a transaction is a credit (vs debit) transaction; credit typically incurs higher fees and is a fee-rule matching field.",
      "grounding": {
        "tables": [
          "payments",
          "fees"
        ],
        "columns": [
          "payments.is_credit",
          "fees.is_credit"
        ],
        "derivation": "is_credit = TRUE/FALSE; null in fee rule means applies to all"
      }
    },
    {
      "term": "Account type",
      "aliases": [
        "account type",
        "merchant account type",
        "account_type"
      ],
      "kind": "dimension",
      "definition": "Categorization of a merchant by business model (R, D, H, F, S, O); used as a fee-rule matching field and slicing dimension.",
      "grounding": {
        "tables": [
          "merchants",
          "fees"
        ],
        "columns": [
          "merchants.account_type",
          "fees.account_type"
        ],
        "derivation": "merchant attribute; fee rule holds list of account types (empty = all)"
      },
      "modeling_pattern": "wildcard list (empty = applies to all)"
    },
    {
      "term": "Merchant Category Code (MCC)",
      "aliases": [
        "MCC",
        "merchant category code",
        "MCC description",
        "category code"
      ],
      "kind": "dimension",
      "definition": "A four-digit code classifying a merchant's business type, used for risk and fee determination; can be referenced by code or by its textual description.",
      "grounding": {
        "tables": [
          "merchants",
          "fees",
          "merchant_category_codes"
        ],
        "columns": [
          "merchants.merchant_category_code",
          "fees.merchant_category_code",
          "merchant_category_codes.mcc",
          "merchant_category_codes.description"
        ],
        "derivation": "merchant attribute; fee rule holds list of MCCs (empty = all); description resolved via merchant_category_codes"
      },
      "modeling_pattern": "code-to-description lookup; wildcard list (empty = applies to all)"
    },
    {
      "term": "Merchant",
      "aliases": [
        "merchant",
        "store",
        "business",
        "merchant name"
      ],
      "kind": "entity",
      "definition": "A business processing payments, with a fixed profile (account type, MCC, capture delay, acquirers) that drives which fee rules apply.",
      "grounding": {
        "tables": [
          "merchants",
          "payments"
        ],
        "columns": [
          "merchants.merchant",
          "merchants.account_type",
          "merchants.merchant_category_code",
          "merchants.capture_delay",
          "merchants.acquirer",
          "payments.merchant"
        ],
        "derivation": "one row per merchant; transactions joined by merchant name"
      }
    },
    {
      "term": "Capture delay",
      "aliases": [
        "capture delay",
        "capture to settlement",
        "settlement timeframe"
      ],
      "kind": "dimension",
      "definition": "The number of days from authorization to settlement; faster capture is more expensive. Merchant value (numeric/'immediate'/'manual') is matched against fee-rule bands ('<3','3-5','>5','immediate','manual').",
      "grounding": {
        "tables": [
          "merchants",
          "fees"
        ],
        "columns": [
          "merchants.capture_delay",
          "fees.capture_delay"
        ],
        "derivation": "merchant numeric days mapped to fee-rule band; null in rule = all"
      },
      "modeling_pattern": "numeric merchant value mapped onto banded categorical thresholds"
    },
    {
      "term": "Intracountry / local acquiring",
      "aliases": [
        "intracountry",
        "domestic transaction",
        "local acquiring",
        "cross-border",
        "international transaction"
      ],
      "kind": "filter",
      "definition": "Whether a transaction is domestic (issuer country equals acquirer country) versus international; domestic local acquiring is cheaper and is a fee-rule matching field.",
      "grounding": {
        "tables": [
          "payments",
          "fees"
        ],
        "columns": [
          "payments.issuing_country",
          "payments.acquirer_country",
          "fees.intracountry"
        ],
        "derivation": "intracountry = (issuing_country = acquirer_country); fee rule intracountry flag (null = all)"
      },
      "modeling_pattern": "derived boolean from country equality matched to fee-rule flag"
    },
    {
      "term": "Fee rule parameter override delta",
      "aliases": [
        "delta if relative fee changed",
        "what delta would merchant pay",
        "amount delta",
        "if the rate changed to X"
      ],
      "kind": "scenario",
      "definition": "The change in total fees a merchant would experience if a parameter of a specific fee rule (e.g. its rate/relative fee) were altered to a new value, compared to the baseline.",
      "grounding": {
        "tables": [
          "payments",
          "fees"
        ],
        "columns": [
          "fees.ID",
          "fees.rate",
          "fees.fixed_amount",
          "payments.eur_amount",
          "payments.merchant"
        ],
        "derivation": "delta = SUM(fee with overridden parameter) - SUM(fee baseline) over the merchant's matched transactions in the window"
      },
      "modeling_pattern": "counterfactual parameter override on a single rule; recompute and difference against baseline"
    },
    {
      "term": "Merchant attribute change delta",
      "aliases": [
        "if merchant had changed its MCC",
        "changed MCC code before 2023",
        "amount delta in fees",
        "if fee was only applied to account type X"
      ],
      "kind": "scenario",
      "definition": "The change in total fees resulting from a hypothetical change to a merchant's profile attribute (e.g. MCC) or to a rule's scope (e.g. restricting an account type), which changes which fee rules match.",
      "grounding": {
        "tables": [
          "payments",
          "merchants",
          "fees"
        ],
        "columns": [
          "merchants.merchant_category_code",
          "merchants.account_type",
          "fees.merchant_category_code",
          "fees.account_type",
          "payments.eur_amount"
        ],
        "derivation": "recompute applicable rules and total fee under modified attribute/scope; delta = scenario total - baseline total"
      },
      "modeling_pattern": "counterfactual attribute/scope override changing rule-match set, then re-aggregate and difference"
    },
    {
      "term": "Merchants affected by a fee rule",
      "aliases": [
        "which merchants were affected by Fee ID",
        "merchants affected by this change"
      ],
      "kind": "operation",
      "definition": "The set of merchants whose profile (and transactions) cause a given fee rule to apply to them within a period, possibly under a hypothetical change to the rule's scope.",
      "grounding": {
        "tables": [
          "fees",
          "merchants",
          "payments"
        ],
        "columns": [
          "fees.ID",
          "fees.card_scheme",
          "fees.account_type",
          "fees.merchant_category_code",
          "fees.aci",
          "merchants.merchant",
          "merchants.account_type",
          "merchants.merchant_category_code",
          "payments.merchant"
        ],
        "derivation": "merchants for which fee rule constraints match their profile/transactions in the period"
      },
      "modeling_pattern": "reverse of applicable-fee matching: fix the rule, enumerate matching merchants"
    },
    {
      "term": "Time period slicing",
      "aliases": [
        "in 2023",
        "in December 2023",
        "for the 10th of the year",
        "between May and June",
        "month of February",
        "in October 2023"
      ],
      "kind": "dimension",
      "definition": "Calendar slicing of transactions by year, natural month, or day-of-year, used to scope fee and volume computations (natural months run day 1 to last day).",
      "grounding": {
        "tables": [
          "payments"
        ],
        "columns": [
          "payments.year",
          "payments.day_of_year"
        ],
        "derivation": "filter on year and day_of_year; month derived from day_of_year within the year"
      },
      "modeling_pattern": "day_of_year mapped to natural calendar months/days"
    },
    {
      "term": "Issuing country",
      "aliases": [
        "issuing_country",
        "issuer country",
        "grouped by issuing_country"
      ],
      "kind": "dimension",
      "definition": "The country that issued the card used in a transaction; used for grouping and for determining domestic vs international transactions.",
      "grounding": {
        "tables": [
          "payments"
        ],
        "columns": [
          "payments.issuing_country",
          "payments.acquirer_country"
        ],
        "derivation": "direct attribute"
      }
    },
    {
      "term": "Average transaction value",
      "aliases": [
        "average transaction value",
        "avg amount",
        "mean transaction size"
      ],
      "kind": "measure",
      "definition": "The mean euro value of transactions over a defined slice, used for analytical grouping.",
      "grounding": {
        "tables": [
          "payments"
        ],
        "columns": [
          "payments.eur_amount",
          "payments.merchant",
          "payments.card_scheme",
          "payments.issuing_country"
        ],
        "derivation": "AVG(eur_amount) over the filtered/grouped subset"
      }
    }
  ]
}
