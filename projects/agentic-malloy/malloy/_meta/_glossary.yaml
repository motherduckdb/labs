{
  "glossary": [
    {
      "term": "Payment processing fee",
      "aliases": [
        "fee",
        "transaction fee",
        "processing fee",
        "fees paid",
        "total fees"
      ],
      "kind": "measure",
      "definition": "The per-transaction cost charged to a merchant, computed from a matching fee rule as fixed_amount plus a variable rate applied to the transaction value. Per the manual: fee = fixed_amount + rate * transaction_value / 10000.",
      "grounding": {
        "tables": [
          "fees",
          "payments"
        ],
        "columns": [
          "fees.fixed_amount",
          "fees.rate",
          "payments.eur_amount"
        ],
        "derivation": "fee = fees.fixed_amount + fees.rate * payments.eur_amount / 10000, evaluated over the fee rule matching the transaction's characteristics"
      },
      "modeling_pattern": "fee at a parameterizable notional; two-part tariff (fixed + variable rate/10000)"
    },
    {
      "term": "Total fees paid by a merchant",
      "aliases": [
        "total fees in euros",
        "total fees that <merchant> paid",
        "fees a merchant should pay"
      ],
      "kind": "measure",
      "definition": "The sum of per-transaction fees across all of a merchant's transactions in a given period, each transaction matched to its applicable fee rule.",
      "grounding": {
        "tables": [
          "payments",
          "fees",
          "merchants"
        ],
        "columns": [
          "payments.merchant",
          "payments.eur_amount",
          "fees.fixed_amount",
          "fees.rate",
          "payments.day_of_year",
          "payments.year"
        ],
        "derivation": "SUM over merchant's transactions in period of (fixed_amount + rate * eur_amount / 10000) using the matching fee rule per transaction"
      },
      "modeling_pattern": "aggregate a per-row derived measure after rule-matching join"
    },
    {
      "term": "Fee rule",
      "aliases": [
        "fee",
        "fee with ID",
        "fee ID",
        "rule",
        "fee rule"
      ],
      "kind": "entity",
      "definition": "A row in the fee ruleset defining the pricing (fixed_amount and rate) that applies when a transaction/merchant matches its characteristic filters. Identified by ID.",
      "grounding": {
        "tables": [
          "fees"
        ],
        "columns": [
          "fees.ID",
          "fees.card_scheme",
          "fees.account_type",
          "fees.capture_delay",
          "fees.monthly_fraud_level",
          "fees.monthly_volume",
          "fees.merchant_category_code",
          "fees.is_credit",
          "fees.aci",
          "fees.fixed_amount",
          "fees.rate",
          "fees.intracountry"
        ],
        "derivation": "identity on fees.ID"
      },
      "modeling_pattern": "rule table with match-any (null/empty list) wildcard semantics"
    },
    {
      "term": "Applicable fee IDs for a merchant",
      "aliases": [
        "applicable fee IDs",
        "which fees apply",
        "fee IDs applicable to",
        "applicable Fee IDs"
      ],
      "kind": "operation",
      "definition": "The set of fee rule IDs whose characteristic filters match a merchant (and optionally its transactions) over a given period, considering wildcard fields that apply to all values.",
      "grounding": {
        "tables": [
          "fees",
          "merchants",
          "payments"
        ],
        "columns": [
          "fees.card_scheme",
          "fees.account_type",
          "fees.capture_delay",
          "fees.monthly_fraud_level",
          "fees.monthly_volume",
          "fees.merchant_category_code",
          "fees.is_credit",
          "fees.aci",
          "fees.intracountry",
          "merchants.account_type",
          "merchants.merchant_category_code",
          "merchants.capture_delay"
        ],
        "derivation": "select fees.ID where each fee field is null/empty OR contains the merchant/transaction's value for that field, over the period"
      },
      "modeling_pattern": "wildcard rows are common to all groups; null/empty list = applies to all — match on intersection of non-null constraints"
    },
    {
      "term": "Merchants affected by a fee rule",
      "aliases": [
        "which merchants were affected by the Fee with ID",
        "merchants affected"
      ],
      "kind": "operation",
      "definition": "The set of merchants whose profile and transactions match a given fee rule's characteristics, i.e. the inverse of applicable fee IDs.",
      "grounding": {
        "tables": [
          "fees",
          "merchants",
          "payments"
        ],
        "columns": [
          "fees.ID",
          "merchants.merchant",
          "merchants.account_type",
          "merchants.merchant_category_code",
          "fees.card_scheme",
          "fees.account_type",
          "fees.merchant_category_code",
          "fees.is_credit",
          "fees.aci"
        ],
        "derivation": "for a fixed fees.ID, return merchants whose characteristics satisfy that rule's non-null filters over the period"
      },
      "modeling_pattern": "reverse rule-match: fix rule, enumerate matching entities"
    },
    {
      "term": "Card scheme",
      "aliases": [
        "card network",
        "scheme",
        "network"
      ],
      "kind": "dimension",
      "definition": "The card network (e.g. Visa/Mastercard analogues) that a transaction runs on and that fee rules can be scoped to.",
      "grounding": {
        "tables": [
          "payments",
          "fees"
        ],
        "columns": [
          "payments.card_scheme",
          "fees.card_scheme"
        ],
        "derivation": "distinct card_scheme values: GlobalCard, NexPay, SwiftCharge, TransactPlus"
      }
    },
    {
      "term": "Account type",
      "aliases": [
        "merchant account type",
        "account_type"
      ],
      "kind": "dimension",
      "definition": "Merchant classification by business model (R Retail, D Digital, H Hospitality, F Franchise, S SaaS, O Other) used to scope fee rules and support.",
      "grounding": {
        "tables": [
          "merchants",
          "fees"
        ],
        "columns": [
          "merchants.account_type",
          "fees.account_type"
        ],
        "derivation": "merchants.account_type coded R/D/H/F/S; fees.account_type is a list (empty = all)"
      },
      "modeling_pattern": "list-typed rule field with empty=all semantics"
    },
    {
      "term": "Merchant Category Code",
      "aliases": [
        "MCC",
        "MCC code",
        "MCC description",
        "merchant category"
      ],
      "kind": "dimension",
      "definition": "A four-digit code categorizing a merchant's business type, used for risk, fraud detection and to scope fee rules. Descriptions are looked up in the MCC reference table.",
      "grounding": {
        "tables": [
          "merchants",
          "fees",
          "merchant_category_codes"
        ],
        "columns": [
          "merchants.merchant_category_code",
          "fees.merchant_category_code",
          "merchant_category_codes.mcc",
          "merchant_category_codes.description"
        ],
        "derivation": "join merchant/fee MCC to merchant_category_codes.mcc to resolve description; fees.merchant_category_code is a list (empty=all)"
      },
      "modeling_pattern": "code-to-description lookup; list-typed rule field with empty=all"
    },
    {
      "term": "Authorization Characteristics Indicator",
      "aliases": [
        "ACI",
        "authorization characteristic indicator",
        "payment interaction type"
      ],
      "kind": "dimension",
      "definition": "Standardized code (A–G) describing how the transaction flow was submitted to the acquirer (card present/not present, authenticated, tokenized, 3-D Secure, etc.), used to scope fees and choose processing method.",
      "grounding": {
        "tables": [
          "payments",
          "fees"
        ],
        "columns": [
          "payments.aci",
          "fees.aci"
        ],
        "derivation": "payments.aci single value A–G; fees.aci is a list (empty=all)"
      },
      "modeling_pattern": "list-typed rule field with empty=all semantics"
    },
    {
      "term": "Transaction value",
      "aliases": [
        "transaction amount",
        "amount",
        "eur_amount",
        "transaction value in EUR",
        "notional"
      ],
      "kind": "measure",
      "definition": "The monetary amount of a transaction in euros, used as the base for the variable rate portion of the fee.",
      "grounding": {
        "tables": [
          "payments"
        ],
        "columns": [
          "payments.eur_amount"
        ],
        "derivation": "payments.eur_amount; in hypothetical fee calculations a parameter value is substituted"
      },
      "modeling_pattern": "parameterizable notional amount"
    },
    {
      "term": "Credit transaction",
      "aliases": [
        "is_credit",
        "credit vs debit",
        "credit transaction"
      ],
      "kind": "filter",
      "definition": "Whether the transaction is a credit (vs debit) transaction; credit transactions are typically more expensive and fee rules may target them.",
      "grounding": {
        "tables": [
          "payments",
          "fees"
        ],
        "columns": [
          "payments.is_credit",
          "fees.is_credit"
        ],
        "derivation": "payments.is_credit boolean; fees.is_credit null=all"
      },
      "modeling_pattern": "nullable boolean rule filter with null=all"
    },
    {
      "term": "Intracountry (domestic) transaction",
      "aliases": [
        "domestic transaction",
        "local acquiring",
        "intracountry",
        "cross-border transaction",
        "international transaction"
      ],
      "kind": "filter",
      "definition": "A transaction is domestic (intracountry) when the issuer country equals the acquirer country; otherwise it is international/cross-border, which is typically more expensive.",
      "grounding": {
        "tables": [
          "payments",
          "fees"
        ],
        "columns": [
          "payments.issuing_country",
          "payments.acquirer_country",
          "fees.intracountry"
        ],
        "derivation": "intracountry = (payments.issuing_country = payments.acquirer_country); fees.intracountry (1=domestic,0=international, null=all)"
      },
      "modeling_pattern": "derived boolean from two geography columns matched against nullable rule flag"
    },
    {
      "term": "Capture delay",
      "aliases": [
        "capture_delay",
        "days to capture",
        "settlement delay"
      ],
      "kind": "dimension",
      "definition": "Rule specifying the number of days from authorization to settlement (immediate, <3, 3-5, >5, manual). Faster capture is more expensive; used to scope fee rules and defined per merchant.",
      "grounding": {
        "tables": [
          "merchants",
          "fees"
        ],
        "columns": [
          "merchants.capture_delay",
          "fees.capture_delay"
        ],
        "derivation": "match merchants.capture_delay (numeric days or immediate/manual) against fees.capture_delay bucket; null=all. Note merchant values are numeric-day strings that map into fee buckets"
      },
      "modeling_pattern": "bucket mapping from numeric merchant value to categorical rule band"
    },
    {
      "term": "Monthly volume band",
      "aliases": [
        "monthly_volume",
        "monthly total volume",
        "merchant volume"
      ],
      "kind": "dimension",
      "definition": "Rule band for a merchant's total monthly transaction volume in euros (<100k, 100k-1m, 1m-5m, >5m), computed over natural months. Higher volume typically yields cheaper fees.",
      "grounding": {
        "tables": [
          "fees",
          "payments"
        ],
        "columns": [
          "fees.monthly_volume",
          "payments.eur_amount",
          "payments.merchant",
          "payments.day_of_year",
          "payments.year"
        ],
        "derivation": "derive merchant monthly volume = SUM(eur_amount) per natural month; map into fee band; fees.monthly_volume null=all"
      },
      "modeling_pattern": "aggregate-then-band; natural calendar month windows"
    },
    {
      "term": "Monthly fraud level band",
      "aliases": [
        "monthly_fraud_level",
        "fraud level",
        "fraud ratio"
      ],
      "kind": "dimension",
      "definition": "Rule band for a merchant's monthly fraud ratio (fraudulent volume / total volume), e.g. <7.2%, 7.2%-7.7%. Higher fraud levels increase fees.",
      "grounding": {
        "tables": [
          "fees",
          "payments"
        ],
        "columns": [
          "fees.monthly_fraud_level",
          "payments.has_fraudulent_dispute",
          "payments.eur_amount",
          "payments.merchant"
        ],
        "derivation": "derive fraud ratio = SUM(eur_amount where has_fraudulent_dispute)/SUM(eur_amount) per natural month; map into band; fees.monthly_fraud_level null=all"
      },
      "modeling_pattern": "ratio-then-band over natural month windows"
    },
    {
      "term": "Fraud rate",
      "aliases": [
        "fraud level",
        "fraudulent volume ratio",
        "fraud-related metric"
      ],
      "kind": "measure",
      "definition": "The ratio of fraudulent volume over total volume, per the manual's definition of fraud. Used as a KPI and as an input to fraud-level fee bands.",
      "grounding": {
        "tables": [
          "payments"
        ],
        "columns": [
          "payments.has_fraudulent_dispute",
          "payments.eur_amount"
        ],
        "derivation": "SUM(eur_amount where has_fraudulent_dispute=true) / SUM(eur_amount) over the scope"
      },
      "modeling_pattern": "volume-weighted ratio (can also be computed by count)"
    },
    {
      "term": "Fraudulent transaction",
      "aliases": [
        "fraudulent dispute",
        "fraud transaction",
        "chargeback/fraud"
      ],
      "kind": "filter",
      "definition": "A transaction flagged as having a fraudulent dispute, used for fraud-rate computation and fraud-steering scenarios.",
      "grounding": {
        "tables": [
          "payments"
        ],
        "columns": [
          "payments.has_fraudulent_dispute"
        ],
        "derivation": "payments.has_fraudulent_dispute = true"
      }
    },
    {
      "term": "Average fee scenario",
      "aliases": [
        "in the average scenario",
        "average fee",
        "on average"
      ],
      "kind": "scenario",
      "definition": "A pricing estimate that averages the applicable fee across matching fee rules for a given set of characteristics and a specified transaction value, ignoring merchant-specific transaction distribution.",
      "grounding": {
        "tables": [
          "fees"
        ],
        "columns": [
          "fees.fixed_amount",
          "fees.rate",
          "fees.card_scheme",
          "fees.account_type",
          "fees.aci",
          "fees.merchant_category_code",
          "fees.is_credit"
        ],
        "derivation": "AVG(fixed_amount + rate * value / 10000) over fee rules matching the given characteristics for a parameter transaction value"
      },
      "modeling_pattern": "average over matching rule set at a parameterized notional"
    },
    {
      "term": "Cheapest/most expensive option selection",
      "aliases": [
        "cheapest fee",
        "most expensive fee",
        "minimum fees",
        "maximum fees",
        "which card scheme should steer traffic to"
      ],
      "kind": "operation",
      "definition": "Selecting the dimension value (card scheme, ACI, MCC, etc.) that minimizes or maximizes the computed fee for a given transaction scenario.",
      "grounding": {
        "tables": [
          "fees",
          "payments"
        ],
        "columns": [
          "fees.fixed_amount",
          "fees.rate",
          "payments.eur_amount",
          "payments.card_scheme",
          "payments.aci"
        ],
        "derivation": "argmin/argmax over candidate dimension values of the computed fee (single transaction value or merchant total), with alphabetical tie-break where specified"
      },
      "modeling_pattern": "argmin/argmax over candidate dimension with deterministic tie-break"
    },
    {
      "term": "Traffic steering scenario",
      "aliases": [
        "steer traffic to",
        "which card scheme should the merchant steer traffic",
        "incentivize shoppers to use a different interaction"
      ],
      "kind": "scenario",
      "definition": "A counterfactual in which a merchant's transactions are re-routed to a different card scheme or ACI to minimize (or maximize) total fees, holding actual transaction volume/mix fixed.",
      "grounding": {
        "tables": [
          "payments",
          "fees"
        ],
        "columns": [
          "payments.merchant",
          "payments.card_scheme",
          "payments.aci",
          "payments.eur_amount",
          "fees.fixed_amount",
          "fees.rate"
        ],
        "derivation": "for each candidate scheme/ACI, recompute total fees over merchant's transactions and pick the optimum"
      },
      "modeling_pattern": "counterfactual dimension override then re-aggregate fees"
    },
    {
      "term": "Fraud ACI re-routing scenario",
      "aliases": [
        "move fraudulent transactions towards a different ACI",
        "preferred ACI for fraud",
        "incentivize a different payment interaction"
      ],
      "kind": "scenario",
      "definition": "A counterfactual that reassigns a merchant's fraudulent transactions to a different ACI (payment interaction) to achieve the lowest possible fees.",
      "grounding": {
        "tables": [
          "payments",
          "fees"
        ],
        "columns": [
          "payments.has_fraudulent_dispute",
          "payments.aci",
          "payments.merchant",
          "fees.aci",
          "fees.fixed_amount",
          "fees.rate"
        ],
        "derivation": "restrict to fraudulent transactions; for each candidate ACI recompute fees and choose the ACI minimizing cost"
      },
      "modeling_pattern": "counterfactual override join on a filtered subset (fraud) then optimize"
    },
    {
      "term": "Fee parameter change (delta) scenario",
      "aliases": [
        "delta would <merchant> pay",
        "if the relative fee of the fee changed to X",
        "amount delta in fees"
      ],
      "kind": "scenario",
      "definition": "A counterfactual comparing actual total fees against fees recomputed after altering a fee rule parameter (e.g. its rate) or a merchant attribute, reporting the difference.",
      "grounding": {
        "tables": [
          "fees",
          "payments"
        ],
        "columns": [
          "fees.ID",
          "fees.rate",
          "fees.fixed_amount",
          "payments.eur_amount",
          "payments.merchant"
        ],
        "derivation": "delta = SUM(fee with modified parameter) - SUM(fee with original parameter) over affected transactions in period"
      },
      "modeling_pattern": "before/after override then difference (delta)"
    },
    {
      "term": "Merchant attribute change scenario",
      "aliases": [
        "imagine if the merchant had changed its MCC",
        "changed account type",
        "if the fee was only applied to account type"
      ],
      "kind": "scenario",
      "definition": "A counterfactual altering a merchant's characteristic (e.g. MCC or account type) or a fee rule's scope, then recomputing applicable fees or affected merchants.",
      "grounding": {
        "tables": [
          "merchants",
          "fees",
          "payments"
        ],
        "columns": [
          "merchants.merchant_category_code",
          "merchants.account_type",
          "fees.merchant_category_code",
          "fees.account_type",
          "fees.ID"
        ],
        "derivation": "substitute the altered attribute, recompute rule matches / total fees, compare to baseline"
      },
      "modeling_pattern": "attribute override then re-match / re-aggregate"
    },
    {
      "term": "Merchant",
      "aliases": [
        "merchant name",
        "store",
        "business"
      ],
      "kind": "entity",
      "definition": "A business partner that processes transactions, characterized by account type, MCC, capture delay and acquirers; the primary entity whose fees are analyzed.",
      "grounding": {
        "tables": [
          "merchants",
          "payments"
        ],
        "columns": [
          "merchants.merchant",
          "payments.merchant",
          "merchants.account_type",
          "merchants.merchant_category_code",
          "merchants.capture_delay",
          "merchants.acquirer"
        ],
        "derivation": "identity on merchant name; join payments.merchant = merchants.merchant"
      }
    },
    {
      "term": "Time period filter",
      "aliases": [
        "in 2023",
        "in December 2023",
        "the Nth of the year",
        "between May and June",
        "month of February",
        "in October 2023"
      ],
      "kind": "filter",
      "definition": "Temporal scoping of transactions by year, natural month, or day-of-year; monthly aggregations use natural calendar months.",
      "grounding": {
        "tables": [
          "payments"
        ],
        "columns": [
          "payments.year",
          "payments.day_of_year"
        ],
        "derivation": "filter by year and day_of_year; derive month from day_of_year for monthly windows (natural months day 1 to last day)"
      },
      "modeling_pattern": "day_of_year to calendar-month derivation; natural month windows"
    },
    {
      "term": "Issuing country",
      "aliases": [
        "issuer country",
        "issuing_country",
        "card country"
      ],
      "kind": "dimension",
      "definition": "Country that issued the card, used both to slice transactions and to determine domestic vs international routing.",
      "grounding": {
        "tables": [
          "payments"
        ],
        "columns": [
          "payments.issuing_country"
        ],
        "derivation": "payments.issuing_country"
      }
    },
    {
      "term": "Acquirer country",
      "aliases": [
        "acquiring country",
        "acquirer_country",
        "acquirer location"
      ],
      "kind": "dimension",
      "definition": "Country of the acquirer processing the transaction, compared with issuing country to establish local acquiring.",
      "grounding": {
        "tables": [
          "payments",
          "acquirer_countries"
        ],
        "columns": [
          "payments.acquirer_country",
          "acquirer_countries.acquirer",
          "acquirer_countries.country_code"
        ],
        "derivation": "payments.acquirer_country; acquirer→country via acquirer_countries"
      }
    },
    {
      "term": "Shopper interaction",
      "aliases": [
        "payment interaction",
        "Ecommerce vs POS",
        "shopper_interaction",
        "interaction type"
      ],
      "kind": "dimension",
      "definition": "Whether the transaction was Ecommerce or POS; a lever users reference when steering shoppers toward different ACIs.",
      "grounding": {
        "tables": [
          "payments"
        ],
        "columns": [
          "payments.shopper_interaction"
        ],
        "derivation": "payments.shopper_interaction (Ecommerce/POS)"
      }
    },
    {
      "term": "Average transaction value",
      "aliases": [
        "average transaction value",
        "avg amount",
        "mean transaction size"
      ],
      "kind": "measure",
      "definition": "The mean transaction amount over a scoped set of transactions, often sliced by a dimension such as issuing country.",
      "grounding": {
        "tables": [
          "payments"
        ],
        "columns": [
          "payments.eur_amount",
          "payments.issuing_country",
          "payments.merchant",
          "payments.card_scheme"
        ],
        "derivation": "AVG(eur_amount) grouped by chosen dimension over scoped transactions"
      },
      "modeling_pattern": "grouped mean of a base measure"
    },
    {
      "term": "Wildcard rule matching",
      "aliases": [
        "applies to all",
        "null means all values",
        "empty list applies to all"
      ],
      "kind": "operation",
      "definition": "Semantics for matching fee rules where a null field or empty list means the rule applies to every value of that characteristic, so matching keys on the intersection of only the constrained (non-null/non-empty) fields.",
      "grounding": {
        "tables": [
          "fees"
        ],
        "columns": [
          "fees.account_type",
          "fees.aci",
          "fees.merchant_category_code",
          "fees.capture_delay",
          "fees.monthly_fraud_level",
          "fees.monthly_volume",
          "fees.is_credit",
          "fees.intracountry",
          "fees.card_scheme"
        ],
        "derivation": "rule matches when for each field: field IS NULL or empty list, OR field contains/equals the transaction's value"
      },
      "modeling_pattern": "wildcard rows are common to all groups; expose specific + effective grains"
    }
  ]
}
