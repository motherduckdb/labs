file: fees_base.malloy
domain: payment processing fee rules
summary: >
  Base semantic source over the fee rule table (1,000 rules, grain = one fee rule per ID).
  Each rule prices transactions as fee = fixed_amount + rate * transaction_value / 10000 and
  applies only where its characteristic fields (card_scheme, account_type, capture_delay,
  monthly_fraud_level, monthly_volume, merchant_category_code, is_credit, aci, intracountry)
  match. Wildcard semantics: a NULL scalar field or an empty list field means the rule applies
  to ALL values of that field. Contains no joins; exposes wildcard flags, decoded scope labels,
  parsed numeric tier bounds, and full sum/avg/min/max aggregations of fixed_amount, rate, and
  the fee at a caller-supplied notional transaction value.
exports:
  - name: fees_base
    kind: source (parameterized)
    summary: >
      Fee rule source, grain = one rule (primary_key ID). Optional parameter
      notional::number feeds the fee_at_notional dimension and its avg/min/max/sum measures,
      supporting hypothetical "fee for a transaction value of X EUR" quotes. Wildcard-detection
      dimensions (matches_all_account_types, matches_all_mccs, matches_all_acis,
      matches_all_capture_delays, matches_all_fraud_levels, matches_all_volumes,
      matches_all_credit, matches_all_locality) expose the NULL/empty-list "applies to all"
      encoding. locality_scope ('domestic'/'international'/'any') and credit_scope
      ('credit'/'debit'/'any') decode the DOUBLE intracountry and nullable is_credit flags.
      volume_min_eur/volume_max_eur and fraud_min_pct/fraud_max_pct parse the tier strings
      into numeric bounds for matching monthly aggregates.
    usage: >
      Hypothetical fee quote: `run: fees_base(notional is 1234) -> { where: card_scheme = 'X'
      and (matches_all_acis or list_contains!boolean(aci, 'C')) and ...; aggregate:
      avg_fee_at_notional }` — apply the wildcard branch on EVERY constrained field; leave
      unconstrained fields unfiltered. Without the parameter, call plain `fees_base -> {...}`
      for rule inventory/analysis.
  - name: by_card_scheme
    kind: view
    summary: Rule count plus average fixed amount, rate, and fee-at-notional per card scheme.
    usage: >
      `run: fees_base(notional is 500) -> by_card_scheme + { where: <rule constraints> }`;
      order by avg_fee_at_notional asc/desc, limit 1 for cheapest/most-expensive scheme.
  - name: rule_detail
    kind: view
    summary: Full projection of all rule columns ordered by ID, for inspecting a specific fee rule.
    usage: "`run: fees_base -> rule_detail + { where: ID = 384 }` to read one rule's fields."
provides_for:
  - "fees.malloy / matched-fee sources: join_many fee rules against merchant+transaction attributes using the wildcard branches (matches_all_* or list_contains!boolean(...)) on every field"
  - "total-fees-paid pipelines: per-transaction fee = fixed_amount + rate * eur_amount / 10000 computed at the matched-rule grain"
  - "what-if scenarios: rate/scope overrides and choice-dimension sweeps (scheme, ACI, MCC) built on top of this rule universe"
