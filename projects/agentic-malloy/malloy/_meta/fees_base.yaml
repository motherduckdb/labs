file: fees_base.malloy
domain: Payment processing fee ruleset — the master table of fee rules keyed by ID that specify a fixed_amount + rate for combinations of merchant/transaction characteristics (card scheme, account type, capture delay, fraud band, volume band, MCC, credit flag, ACI, intracountry).
summary: >
  Base semantic source over the `fees` rule table (one row per fee rule ID).
  Exposes the fee formula (fee = fixed_amount + rate * transaction_value / 10000)
  as a parameterized notional, the fixed/variable components with the full
  aggregation set, and wildcard-detection dimensions that make the
  "null scalar / empty list = applies to all" convention explicit for every
  criteria field. Contains NO joins — matching a rule to merchants/payments is
  done in downstream sources by referencing these dimensions.
exports:
  - name: fees_base
    kind: source
    summary: >
      One row per fee rule. Parameter `transaction_value::number` sets the
      notional for the computed-fee measures/dimensions (pass a real payment
      amount or a hypothetical value; leave unset when only fixed_amount/rate
      matter). Wildcard fields: list columns (account_type, merchant_category_code,
      aci) encode "applies to all" as the EMPTY list (len=0); scalar columns
      (capture_delay, monthly_fraud_level, monthly_volume, is_credit,
      intracountry) encode it as NULL. intracountry is stored 0/1 — use the
      boolean `is_intracountry` dimension. All measures are base-grain (safe to
      sum/avg since there are no joins here).
    usage: >
      Instantiate with the notional to compute fees, e.g.
      `run: fees_base(transaction_value is 100) -> { group_by: card_scheme; aggregate: avg_fee, min_fee, max_fee }`.
      Filter matching rules by combining wildcard branches per field, e.g.
      `where: (applies_to_all_account_types or ...) and (card_scheme = 'NexPay') ...`.
      For "average fee scenario" use avg_fee over the matching subset; for
      cheapest/most-expensive order_by min_fee/max_fee and limit last-mile.
provides_for:
  - fee formula and fixed/variable fee components at a parameterizable notional
  - applicable-fee-rule matching (wildcard null-scalar / empty-list detection dimensions)
  - average / minimum / maximum / total fee across a set of matching rules
  - fee ruleset breakdowns by card scheme, capture delay, credit flag, volume band, fraud band
  - relative fee (rate) and fixed fee amount statistics
---
