file: fees_base.malloy
domain: payments
summary: |
  Base source over the `fees` table — one row per fee rule. A rule fires for a
  transaction when every criterion (card_scheme, account_type, capture_delay,
  monthly_fraud_level, monthly_volume, merchant_category_code, is_credit, aci,
  intracountry) matches. List-typed criteria use the EMPTY LIST as the
  wildcard ("applies to all"); scalar criteria use NULL. The effective fee
  for a matched transaction of value V is fixed_amount + rate * V / 10000.
exports:
  - name: fees_base
    kind: source
    summary: |
      Fee-rule catalog with derived wildcard flags, effective-fee dimensions
      (fee_on_100eur, fee_on_1000eur), and segmentation measures/views by
      card_scheme, capture_delay, monthly_volume, monthly_fraud_level,
      credit_flag, and transaction_scope. No joins.
provides_for:
  - matching transactions against fee rules (downstream source can join_many
    fees_base with on-clauses that use list_contains!boolean for list fields
    and equality-with-wildcard for scalar fields)
  - profiling the fee rulebook (rule counts, rate/fixed-amount distributions)
  - ranking rules by effective cost on a sample transaction size
