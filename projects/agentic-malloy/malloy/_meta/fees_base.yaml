file: fees_base.malloy
domain: Payment processing fee ruleset (acquirer pricing rules)
summary: >
  Base semantic layer over the `fees` rule table. Each row is a fee rule
  identified by ID that defines a two-part tariff (fixed_amount in EUR plus a
  variable rate applied as rate * transaction_value / 10000) which applies when
  a transaction/merchant matches the rule's characteristic filters. Rule filters
  use wildcard semantics: list fields (account_type, merchant_category_code,
  aci) encode "applies to all" as an EMPTY list, and scalar fields
  (capture_delay, monthly_fraud_level, monthly_volume, is_credit, intracountry)
  encode it as NULL. This file carries NO joins; it exposes the rule fields,
  wildcard-detection helpers, readable labels, and the full standard
  aggregation set over fixed_amount and rate, plus a parameterized per-rule fee
  evaluated at a hypothetical notional transaction value. Rule-to-transaction
  and rule-to-merchant matching lives in downstream sources that join this one.
exports:
  - name: fees_base
    kind: source
    summary: >
      Fee ruleset at rule (ID) grain. Parameter `notional::number` supplies a
      hypothetical transaction value in EUR used by the fee_at_notional
      dimension and its measures (fee = fixed_amount + rate * notional / 10000).
      Dimensions include wildcard flags (applies_to_all_*), readable labels
      (credit_label, intracountry_label), and constraint counts. Measures cover
      sum/avg/min/max of fixed_amount and rate plus fee_at_notional, and rule
      counts.
    usage: >
      Call unparameterized for structural questions:
      `run: fees_base -> by_card_scheme`. To compare rule pricing at a fixed
      transaction value pass the notional: `run: fees_base(notional is 100) -> {
      where: card_scheme = 'NexPay'; aggregate: avg_fee_at_notional,
      min_fee_at_notional, max_fee_at_notional }`. Filter to a rule with
      `where: ID = <id>`. Use applies_to_all_* flags or the list/scalar wildcard
      encoding when reasoning about which rules apply broadly.
provides_for:
  - Fee rule entity lookup and per-rule pricing (fixed_amount, rate)
  - Average / min / max / total fixed_amount and rate across a rule subset
  - Per-rule and average fee at a parameterized notional transaction value
  - Wildcard-aware rule inspection (empty-list / NULL = applies to all)
  - Slicing rules by card_scheme, credit vs debit, domestic vs international
  - Base layer for downstream rule-matching joins to payments and merchants
