file: fees_base.malloy
domain: payment-processing fee rulebook
summary: >
  Base semantic source over the `fees` table (1,000 fee rules, one row per rule ID).
  Each rule prices transactions matching its merchant/transaction criteria
  (card_scheme, account_type list, capture_delay bucket, monthly fraud/volume range
  strings, MCC list, is_credit, ACI list, intracountry flag). Wildcards: empty
  lists ([] for account_type / merchant_category_code / aci) and NULL scalars
  (capture_delay, monthly_fraud_level, monthly_volume, is_credit, intracountry)
  mean "applies to all values". Fee formula: fixed_amount + rate * amount / 10000.
  No joins here — rule-transaction matching lives in downstream files.
exports:
  - name: fees_base
    kind: source (parameterized; grain = one fee rule)
    summary: >
      Fee-rule source with a `notional::number` parameter (default null) driving
      `fee_at_notional` = fixed_amount + rate * notional / 10000. Dimensions:
      per-field wildcard flags (applies_all_*), intracountry_label
      (domestic/international/any), is_domestic_rule, constrained_field_count
      (specificity — use > 0 filters to restrict rankings to rules that
      distinctly participate on a field). Measures: rule_count, fee_id_count,
      and full sum/avg/min/max sets for fixed_amount, rate, and fee_at_notional.
      List-field membership tests must use list_contains!boolean(field, value)
      and emptiness via len!number(field) = 0 (never `is null`).
    usage: "run: fees_base(notional is 100) -> { where: card_scheme = 'NexPay'; aggregate: avg_fee_at_notional }  — pass `notional` by name; scope with where: on rule fields (wildcard-aware) then aggregate or order_by a fee measure."
  - name: rule_detail
    kind: view
    summary: Projection of all raw rule columns for inspecting one or a few rules by ID or filter.
    usage: "run: fees_base(notional is null) -> rule_detail + { where: ID = 384 }"
  - name: fee_stats_by_scheme
    kind: view
    summary: Per card_scheme rule counts and fee statistics (avg fixed/rate, avg/min/max fee at the supplied notional) — the base for cheapest/most-expensive scheme comparisons at a hypothetical amount.
    usage: "run: fees_base(notional is 50) -> fee_stats_by_scheme + { order_by: avg_fee_at_notional asc } — add where: filters (account_type via list_contains, is_credit, MCC) to restrict the matching-rule population before averaging."
provides_for:
  - "fees.malloy / joined models: rule-transaction applicability matching against payments+merchants (wildcard-aware join_many), total fees paid, fee deltas under rule or merchant-attribute changes"
  - "scheme steering and ACI steering scenarios (re-match transactions under a candidate scheme/ACI and compare fee aggregates)"
  - "average-scenario fee comparisons at a notional amount across schemes/ACIs/MCCs with tie handling"
