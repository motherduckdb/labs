file: fees_base.malloy
domain: payment-processing fee rules
summary: >
  Base semantic source over the fee-rules table (1 row per rule ID, 1000 rules).
  Each rule binds a card scheme plus optional matching conditions (account-type
  list, MCC list, ACI list, capture-delay bucket, monthly-fraud tier,
  monthly-volume tier, credit flag, intracountry flag) to a price:
  fee = fixed_amount + rate * transaction_value / 10000 (rate is in basis
  points). Wildcard semantics: an EMPTY list [] on a list field, or NULL on a
  scalar field, means the rule applies to ALL values of that field. This file
  contains no joins — matching against merchants/payments belongs in a
  higher-level model.
exports:
  - name: fees_base
    kind: source
    summary: >
      One row per fee rule. Dimensions expose the raw rule fields plus:
      per-field wildcard flags (applies_all_*), the domestic/international
      reading of the 0/1 intracountry column, rate as a fraction/percent, and
      parsed numeric bounds of the range-string tiers (monthly_volume_min/max_eur,
      fraud_level_min/max_pct; null max = unbounded). Measures cover rule_count
      and sum/avg/min/max of fixed_amount and rate — all at rule grain (safe to
      aggregate any way).
    usage: >
      Rule-space queries: filter with wildcard-inclusive predicates, e.g.
      `where: card_scheme = 'NexPay' and (applies_all_account_types or
      list_contains!boolean(account_type, 'H'))`, then group_by/aggregate; for
      an average scenario fee at a notional N, aggregate
      `avg(fixed_amount + rate * N / 10000)` over the filtered rules and
      order_by it to rank a dimension (scheme, ACI, MCC).
provides_for:
  - fees.malloy (rule-matching joins against payments + merchants)
  - applicable-fee-ID resolution for a merchant/transaction profile
  - average-scenario-fee ranking across schemes/ACIs/account types/MCCs
  - counterfactual rule-override (rate/MCC/ACI/scheme) fee-delta models
