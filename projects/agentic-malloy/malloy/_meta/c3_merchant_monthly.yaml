file: c3_merchant_monthly.malloy
domain: payments
summary: |
  Per-merchant × per-month aggregates over c2_payments, with the volume and
  fraud-level bucketed into the EXACT string labels used by fee rules
  (fees.monthly_volume and fees.monthly_fraud_level). This lets downstream
  fee-matching code compare bands by plain equality instead of re-deriving
  bands from raw payment rows.
exports:
  - name: c3_merchant_monthly
    kind: source
    summary: |
      One row per (merchant, calendar month). Holds monthly_total_eur,
      monthly_fraud_eur, monthly_fraud_rate_pct, plus the two band labels
      monthly_volume_band and monthly_fraud_level_band whose domains match
      the fees table exactly.
  - name: monthly_bands
    kind: view
    summary: Canonical lookup — (merchant, month) → volume band + fraud-level band.
  - name: band_distribution
    kind: view
    summary: Cross-tab of how merchant-months populate the band grid (sanity check).
  - name: by_merchant_year
    kind: view
    summary: Yearly totals per merchant (sums of monthly aggregates).
provides_for:
  - "Resolving fees.monthly_volume for any (merchant, month)"
  - "Resolving fees.monthly_fraud_level for any (merchant, month)"
  - "Per-merchant per-month volume / fraud roll-ups used by fee-matching layers"
  - "Inputs to the fact-row × fee-rule fan-out join that computes total fees paid"
