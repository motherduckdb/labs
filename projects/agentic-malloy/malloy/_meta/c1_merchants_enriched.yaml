file: c1_merchants_enriched.malloy
domain: payments-fees
summary: |
  Merchant dimension enriched with the lookups required to match a merchant
  against fee-rule conditions and to reason about its domestic / cross-border
  acquiring footprint. One row per merchant. Adds: account-type description,
  capture_delay bucketed to the fees.capture_delay vocabulary, MCC
  description (via merchant_category_codes), and the set of distinct
  acquirer countries the merchant uses (via acquirer_countries). All
  attributes are exposed as real local columns so downstream sources can
  reference them in join_many predicates without crossing more than one
  join level.
exports:
  - name: c1_merchants_enriched
    kind: source
    summary: |
      Merchant-grain source (PK merchant) with derived attributes:
      account_type_description, capture_delay_bucket, capture_delay_days,
      mcc_description, mcc_category_prefix, acquirer_country_codes (list),
      acquirer_country_count, is_multi_acquirer, is_multi_country_acquirer,
      and per-country has_acquirer_in_* booleans for FR/GB/IT/NL/US.
  - name: directory
    kind: view
    summary: Full per-merchant directory row including all enriched attributes.
  - name: by_account_type
    kind: view
    summary: Merchant count by account_type (with human-readable description).
  - name: by_mcc
    kind: view
    summary: Merchant count by MCC (with description).
  - name: by_capture_delay_bucket
    kind: view
    summary: Merchant count by capture_delay bucket aligned to fees vocabulary.
provides_for:
  - resolving a merchant's MCC description from its numeric MCC
  - mapping merchant capture_delay to the fees.capture_delay bucket vocabulary
  - human-readable account_type labels
  - per-merchant acquirer-country set used for intracountry / domestic reasoning
  - downstream fact×rule matching sources that need merchant attributes as real local columns
