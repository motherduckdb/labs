file: c1_merchant_profiles.malloy
domain: payment processing — merchant static profiles
summary: >
  Merchant-grain profile source (30 merchants) enriching merchants_base with
  (1) the MCC description lookup (merchant_category_codes.mcc is VARCHAR, joined via
  its numeric cast mcc_code), (2) per-acquirer country resolution (merchants.acquirer
  is a list; join_many fans out one row per merchant×acquirer), and (3) a primary
  (first-listed) acquirer with its country. Exposes account_type (+ human description),
  capture_delay in both raw setting ('1','2','7','immediate','manual') and fee-rule
  bucket domain ('<3','3-5','>5','immediate','manual'), MCC + description, and acquirer
  geography. This is the canonical merchant-attribute surface downstream fee-matching
  sources join onto transactions. NOTE grain: the acquirer_info join_many multiplies
  merchant rows by acquirer count — use distinct_merchant_count (fan-out-safe) rather
  than merchants_base.merchant_count when acquirer_info is touched.
exports:
  - name: merchant_profiles
    kind: source
    summary: merchants_base + mcc_info (join_one, description lookup) + primary_acquirer_info (join_one) + acquirer_info (join_many over the acquirer list). Dimensions mcc_description, primary_acquirer, primary_acquirer_country; measures distinct_merchant_count (fan-out-safe), acquirer_link_count.
    usage: "run: merchant_profiles -> { where: merchant = 'X'; select: account_type, capture_delay_bucket, merchant_category_code, mcc_description } — or filter by mcc_description ~ '%TAXICAB%' to resolve a description to codes/merchants."
  - name: profile_enriched
    kind: view
    summary: One row per merchant with all profile attributes (account type + description, MCC + description, capture delay raw + bucket, acquirer list, primary acquirer + country).
    usage: "run: merchant_profiles -> profile_enriched + { where: merchant = 'X' } for one merchant's full profile."
  - name: by_mcc_described
    kind: view
    summary: Merchant counts per MCC code with its textual description.
    usage: "run: merchant_profiles -> by_mcc_described; filter mcc_description ~ pattern to map a description to code(s)."
  - name: merchant_acquirer_countries
    kind: view
    summary: Fan-out listing — one row per merchant×acquirer with the acquirer's country (resolves local-acquiring geography).
    usage: "run: merchant_profiles -> merchant_acquirer_countries + { where: merchant = 'X' } to see which countries a merchant acquires in."
  - name: by_acquirer_country
    kind: view
    summary: Distinct merchants and acquirer links per acquiring country.
    usage: "run: merchant_profiles -> by_acquirer_country (uses fan-out-safe distinct counts)."
  - name: by_account_type_described
    kind: view
    summary: Distinct-merchant counts per account type with human-readable description.
    usage: "run: merchant_profiles -> by_account_type_described."
  - name: by_capture_delay_described
    kind: view
    summary: Distinct-merchant counts per raw capture-delay setting alongside its fee-rule bucket mapping.
    usage: "run: merchant_profiles -> by_capture_delay_described to see how merchant settings map into rule buckets."
provides_for:
  - "enriched-transaction sources: project account_type, merchant_category_code, capture_delay_bucket onto payments before fee-rule matching"
  - "MCC description→code resolution for questions that reference a category by name"
  - "counterfactual MCC/account-type override scenarios (start from profile attributes, replace one field)"
  - "local-acquiring analysis: merchant acquirer countries vs transaction issuing countries"
