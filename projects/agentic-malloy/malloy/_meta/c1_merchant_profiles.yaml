file: c1_merchant_profiles.malloy
domain: Payment processing fee optimization — the merchant entity that drives fee-rule matching.
summary: >
  Enriches the 30-row merchants table with a resolved Merchant Category Code (MCC)
  description, account-type label, and capture-delay band so that a merchant's full
  profile (account_type, MCC + description, capture_delay band, acquirer count) is
  available as real local dimensions for downstream fee-rule matching and slicing.
  Capture-delay days/band and account-type labels are inherited from merchants_base;
  this source adds only the MCC description lookup (BIGINT code cast to the catalog's
  VARCHAR mcc) and convenience views.
exports:
  - name: c1_merchant_profiles
    kind: source
    summary: >
      Merchant profile entity (one row per merchant) with account_type +
      account_type_label, merchant_category_code + mcc_description, capture_delay +
      capture_delay_band + capture_delay_days, and acquirer_count. The reusable
      grounding for "applicable fee rules", "merchants affected by a fee rule",
      and any merchant attribute-change scenario.
    usage: >
      Reference as the merchant dimension source; join transactions/fees to it by
      merchant name. Use mcc_description to answer questions phrased by category
      description (e.g. "MCC description: Taxicabs and Limousines"), and
      capture_delay_band to match merchant capture days against fee-rule bands.
  - name: profile
    kind: view
    summary: >
      Flat one-row-per-merchant listing of every fee-matching attribute
      (account type, MCC + description, capture-delay band/days, acquirer count).
    usage: >
      `run: c1_merchant_profiles -> profile` for the full roster; add
      `+ { where: merchant = 'Rafa_AI' }` to inspect a single merchant's profile.
  - name: by_mcc_description
    kind: view
    summary: Merchant counts grouped by MCC code and its resolved description.
    usage: >
      `run: c1_merchant_profiles -> by_mcc_description`; filter on mcc_description
      to find which merchants carry a given category code.
provides_for:
  - Resolving a merchant's MCC code to its textual description (and the reverse).
  - Supplying merchant-side match fields (account_type, MCC, capture_delay_band) for fee-rule applicability matching.
  - Account-type labelling (R/D/H/F/S -> Enterprise/Platform descriptions).
  - Enumerating merchants and their fee-relevant profile attributes for affected-merchant analyses.
