file: c1_merchant_profiles.malloy
domain: payments fee optimization — merchant dimension
summary: >
  Merchant dimension (30 merchants) enriched with the human-readable MCC
  description (via a numeric-cast join to the merchant_category_codes lookup)
  and the acquirer list unnested against the acquirer→country lookup. Exposes
  every merchant-side attribute the fee-rule matcher needs — account_type,
  capture_delay_bucket (concrete day settings mapped to rule buckets),
  merchant_category_code — plus acquiring-country attributes for the
  domestic/international distinction. NOTE the acquirer join is a join_many
  (one row per acquirer per merchant); base-grain counts inflate on the fanned
  grain, so use the distinct measures defined here.
exports:
  - name: merchant_profiles
    kind: source
    summary: >
      merchants_base + join_one mcc_lookup (description by numeric MCC) +
      join_many acquirer_country (list_contains membership on the acquirer
      list). Dimensions: mcc_description, acquirer_name, acquiring_country.
      Fan-out-safe measures: distinct_merchant_count, distinct_acquirer_count,
      acquiring_country_count.
    usage: "run: merchant_profiles -> profile + { where: merchant = 'Rafa_AI' } for one merchant's full rule-matching attributes; or group_by any attribute with distinct_merchant_count."
  - name: profile
    kind: view
    summary: One row per merchant with account type, MCC (code + description), capture delay (raw + rule bucket), and a nested list of acquirers with their countries.
    usage: "filter with `+ { where: merchant = '<name>' }` or by account_type / merchant_category_code; grain is one row per merchant."
  - name: by_acquiring_country
    kind: view
    summary: Distinct merchants and acquirers per acquiring country.
    usage: "run as-is; ranking by merchant presence per acquiring country."
  - name: by_acquirer
    kind: view
    summary: Distinct merchants per acquirer (with its country).
    usage: "run as-is or filter to one acquiring_country."
  - name: by_mcc
    kind: view
    summary: Distinct merchants per MCC code with description.
    usage: "run as-is; add `+ { where: mcc_description ~ '%...%' }` to resolve a business-type description to merchants."
  - name: by_account_type_profile
    kind: view
    summary: Merchant and acquiring-country counts per account type.
    usage: "run as-is for account-type composition of the merchant portfolio."
provides_for:
  - "fee-rule matching layer: supplies the merchant-side predicates (account_type, capture_delay_bucket, merchant_category_code) as one enriched dimension per merchant"
  - "enriched payment fact sources: join_one by merchant name to attach merchant attributes to transactions"
  - "MCC-description resolution: map description text to the merchants carrying that code"
  - "domestic/international analysis: acquiring_country per merchant acquirer relationship"
