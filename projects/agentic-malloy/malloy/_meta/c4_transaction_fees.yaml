file: c4_transaction_fees.malloy
domain: Payment processing fees — matching each transaction to its applicable fee rule(s) and aggregating fees paid.
summary: >
  Core fact × rule fan-out. c4_txn_enriched pins each payment to its merchant
  attributes (account_type, MCC, capture-delay band) and its merchant-month
  volume/fraud bands as real columns; c4_transaction_fees then join_many's the
  fee ruleset with fully wildcard-aware predicates (empty list len=0 or NULL
  scalar = "applies to all", on EVERY match field: card_scheme, account_type,
  capture_delay, monthly_fraud_level, monthly_volume, MCC, is_credit, aci,
  intracountry) and computes per-transaction fee = fixed_amount + rate *
  eur_amount / 10000 at the joined grain. Three optional parameters override the
  matched card_scheme / aci / MCC to answer steering, fraud-reallocation, and
  MCC-change counterfactuals. Answers "total fees paid", "applicable fee IDs",
  and "merchants affected by a fee" as thin filter+select on top. Note: payments
  contains only 5 merchants, so merchant-scoped results cover those 5.
exports:
  - name: c4_txn_enriched
    kind: source
    summary: >
      Transaction grain enriched with merchant attributes and merchant-month
      volume_band / fraud_band as real local columns (materialized via projection
      so the fee fan-out can match without reaching through a join).
    usage: >
      Base for c4_transaction_fees; query directly only to inspect the enriched
      transaction rows. Filter with `merchant`, `day_of_year`, or
      `transaction_month ? @2023-12`.
  - name: c4_transaction_fees
    kind: source (parameterized)
    summary: >
      Fan-out of transactions × applicable fee rules with wildcard-aware
      matching and per-transaction fee. Parameters card_scheme_override /
      aci_override / mcc_override (all default null = use actual value) drive
      steering, fraud-ACI reallocation, and MCC-change counterfactuals.
    usage: >
      Instantiate with overrides as needed, e.g.
      `run: c4_transaction_fees(card_scheme_override is 'NexPay') -> total_fees_by_merchant + { where: merchant = 'Golfclub_Baron_Friso' }`.
      Without overrides: `run: c4_transaction_fees -> total_fees_by_merchant + { where: merchant = 'Belles_cookbook_store' and transaction_month ? @2023-12 }`.
      txn_count = distinct transactions; total_fees = summed per-transaction fee;
      applicable_fee_id_count = distinct rules touched.
  - name: total_fees_by_merchant
    kind: view
    summary: Total / avg / min / max fee and applicable-rule count per merchant.
    usage: >
      Scope to a merchant + time window: add `where: merchant = 'X' and day_of_year = 10`
      (single day), `... transaction_month ? @2023-12` (month), or `... year 2023`
      (no time filter). For steering, instantiate with card_scheme_override and read total_fees.
  - name: applicable_fee_ids
    kind: view
    summary: Distinct fee rule IDs applied to the scoped transactions.
    usage: >
      `run: c4_transaction_fees -> applicable_fee_ids + { where: merchant = 'Rafa_AI' and transaction_month ? @2023-10 }`
      returns the comma-list of applicable Fee IDs; use overrides for counterfactual applicability.
  - name: merchants_by_fee
    kind: view
    summary: Reverse lookup — which merchants a fee rule applies to.
    usage: >
      `run: c4_transaction_fees -> merchants_by_fee + { where: fee_id = 17 }` then take
      the distinct merchant column. For "if the fee only applied to account type S",
      keep this view but pre-filter transactions to that account_type (add `where: account_type = 'S'`).
  - name: transaction_fee_detail
    kind: view
    summary: Per transaction × matched rule with fee components and fee_amount.
    usage: >
      For delta scenarios (fee rate changed): filter to the merchant + period + `fee_id = 141`,
      then compute delta = sum(new_fixed + new_rate * eur_amount / 10000) - sum(fee_amount) last-mile.
  - name: fee_by_card_scheme
    kind: view
    summary: Descriptive actual fee totals broken out by the transaction's card scheme.
    usage: >
      `run: c4_transaction_fees -> fee_by_card_scheme + { where: merchant = 'X' }`;
      for true steering (route all traffic through one scheme) use total_fees_by_merchant with card_scheme_override instead.
provides_for:
  - total fees paid by a merchant over a day / month / year
  - applicable fee IDs for a merchant in a period (union of rules matched by its transactions)
  - merchants affected by a given fee rule (reverse lookup, incl. counterfactual account-type restriction)
  - steering: total fee if a merchant routed all traffic through a card scheme (card_scheme_override)
  - fraud reallocation: fee for fraudulent transactions reassigned to a candidate ACI (aci_override + where has_fraudulent_dispute)
  - counterfactual MCC change: refee a merchant's year under a different MCC (mcc_override) and diff vs actual
  - fee-rate change delta: per-transaction fee components (transaction_fee_detail) for last-mile counterfactual arithmetic
