file: c5_fee_scenarios.malloy
domain: payments fee optimization — counterfactual (what-if) fee scenarios on top of the fact×rule matching engine
summary: >
  Counterfactual layer over the transaction×fee-rule match. One parameterized central source
  (fee_scenarios) carries a BASELINE rule join and a COUNTERFACTUAL rule join computed over
  effective (overridden) transaction attributes, so baseline, scenario, and their delta are
  computed over the same population in one query. Covers: attribute overrides (card scheme,
  ACI, merchant MCC), a one-rule rate override delta, full candidate sweeps for scheme
  steering and (fraud-)ACI steering ranked by resulting fees, and rule-change
  affected-merchant analysis. All rule matching uses wildcard semantics (empty list / NULL
  scalar = applies to all) on every field; monthly volume/fraud tiers come from
  payments_enriched's natural-month columns. Grain caution: joins fan out — only the exposed
  measures (distinct-key counts, source./join-path aggregates) are safe; never re-aggregate
  raw eur_amount over the fanned rows.
exports:
  - name: scenario_txn_base
    kind: source
    summary: payments_enriched re-projected (measures stripped) as the safe base for fanned scenario joins; transaction grain.
    usage: "Internal building block; query fee_scenarios instead."
  - name: fee_rule_aci_universe
    kind: source
    summary: Participating ACI universe — the distinct ACIs listed in at least one specific (non-wildcard) fee rule, derived from the data.
    usage: "run: fee_rule_aci_universe -> { group_by: aci_value } to list candidate ACIs."
  - name: fee_rule_aci_expanded
    kind: source
    summary: One row per (fee rule, candidate ACI); wildcard (empty-list) rules expand to EVERY candidate so per-ACI rankings include them. Grain = rule×ACI.
    usage: "Join target for ACI steering; columns are real (materialized) so it can be joined_many on local txn columns."
  - name: fee_scenarios
    kind: source (parameterized)
    summary: >
      Central counterfactual source at transaction grain with four rule joins: rules (baseline
      match), cf_rules (match on overridden scheme/ACI/MCC), scheme_steer_rules (all-scheme
      sweep), aci_steer_rules (all-ACI sweep). Params: scenario_scheme, scenario_aci,
      scenario_mcc (attribute overrides feeding cf_rules — null = keep actual, so all-null
      gives zero delta), override_rule_id + override_rule_rate (one-rule rate replacement
      feeding rate_override_delta_eur). Key measures: baseline_total_fee_eur,
      scenario_total_fee_eur, fee_delta_eur, rate_override_delta_eur,
      rate_override_total_fee_eur, scheme/aci steered totals and averages.
    usage: "Instantiate with named params, filter merchant/period with where:, then pick a view — e.g. run: fee_scenarios(scenario_mcc is 7523) -> scenario_fee_totals + { where: merchant = 'X' and txn_date ? @2023 }."
  - name: fee_scenarios.scenario_fee_totals
    kind: view
    summary: Baseline vs counterfactual total fees and the delta over the scoped transactions (one row).
    usage: "MCC-change delta: set scenario_mcc, scope where: merchant = 'X' and txn_date ? @2023; read fee_delta_eur."
  - name: fee_scenarios.scenario_fees_by_merchant
    kind: view
    summary: Per-merchant baseline/scenario fee totals, matched-txn counts, and delta.
    usage: "Scope the period; merchants with fee_delta_eur != 0 (add having:) are affected by the override."
  - name: fee_scenarios.rate_override_totals
    kind: view
    summary: Baseline total fees plus the delta if one rule's rate were replaced (delta = (new_rate − rate)·matched volume/10000).
    usage: "Set override_rule_id + override_rule_rate, scope merchant/period (e.g. txn_date ? @2023-12); read rate_override_delta_eur."
  - name: fee_scenarios.scheme_steering_ranking
    kind: view
    summary: Total/avg fee per candidate card scheme if ALL scoped traffic were routed through it, ascending by total cost.
    usage: "Scope where: merchant = 'X' and txn_date ? <period>; first row = cheapest scheme, order desc or take last for most expensive."
  - name: fee_scenarios.aci_steering_ranking
    kind: view
    summary: Total/avg fee per candidate ACI (wildcard rules included) over the scoped transactions, ascending by total cost.
    usage: "Scope merchant/period with where:; rank candidates; no current-ACI exclusion."
  - name: fee_scenarios.fraud_aci_steering_ranking
    kind: view
    summary: ACI steering restricted to fraudulent transactions and to candidates DIFFERENT from each txn's current ACI (no-op excluded); ascending by total fee — first row is the preferred ACI.
    usage: "Scope where: merchant = 'X' and txn_date ? <period>; limit 1 for the lowest-fee target ACI (+ its cost)."
  - name: fee_scenarios.affected_merchants_by_rule
    kind: view
    summary: Merchants (with account type) having ≥1 baseline-matched transaction, with matched txns/volume/fees; the reverse rule→merchant lookup and the base for rule-restriction counterfactuals.
    usage: "Refine + { where: rules.ID = <id> and txn_date ? @2023 }; for 'rule restricted to account type T' add where: merchant_account_type != 'T' — the listed merchants lose the match."
provides_for:
  - "hypothetical MCC change delta (scenario_mcc → scenario_fee_totals.fee_delta_eur)"
  - "rate-override fee delta for a given rule ID (override_rule_id/override_rule_rate → rate_override_totals)"
  - "scheme steering min/max fee (scheme_steering_ranking, order asc/desc + limit 1)"
  - "preferred ACI for fraudulent traffic (fraud_aci_steering_ranking, limit 1)"
  - "merchants affected by a fee rule or by a rule-field change (affected_merchants_by_rule, scenario_fees_by_merchant)"
  - "single-candidate what-if evaluation via scenario_scheme / scenario_aci overrides"
