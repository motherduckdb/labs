file: c5_fee_scenarios.malloy
domain: Payment processing fee optimization — counterfactual "what-if" scenarios over the transaction × fee-rule match.
summary: >
  Counterfactual scenario layer built on the c4 enriched-transaction grain and the
  wildcard-aware fact×rule match. Provides one-query answers for the routing/optimization
  questions that require fanning each transaction over a CANDIDATE dimension (every card
  scheme, every ACI) and recomputing fees, plus a parameterized single-rule rate-change
  delta. All fee amounts use the standard formula fixed_amount + rate * eur_amount / 10000,
  evaluated at the fee (joined) grain. Matching honors the empty-list/NULL = "applies to all"
  wildcard on every rule field. MCC-change deltas are covered by c4_transaction_fees'
  mcc_override (run with vs. without the override and subtract) and are intentionally not
  duplicated here.
exports:
  - name: card_scheme_universe
    kind: source
    summary: Distinct card-scheme values observed in payments; candidate axis for steering fan-out.
    usage: Referenced internally by c5_scheme_steering; run directly only to list the scheme universe.
  - name: c5_scheme_steering
    kind: source
    summary: >
      Each transaction crossed with every card-scheme candidate, re-matched to fee rules as if
      routed through that scheme (all other attributes actual), fees recomputed. Grain = (txn,
      candidate_scheme, matched_rule).
    usage: >
      run: c5_scheme_steering -> steer_by_scheme + { where: merchant = 'X' and transaction_month = @2023-02;
      order_by: total_fees asc  (minimum-fee steer)  or  desc (maximum-fee steer); limit 1 }.
      Read candidate_scheme + total_fees. For a full-year steer use where: day_of_year ? 1 to 365 or omit the time filter.
  - name: c5_aci_reallocation
    kind: source
    summary: >
      Fraudulent transactions only, crossed with every ACI candidate and re-matched to fee rules
      as if those transactions used that ACI (card_scheme actual), fees recomputed. Grain = (fraud
      txn, candidate_aci, matched_rule).
    usage: >
      run: c5_aci_reallocation -> reallocate_by_aci + { where: merchant = 'X' and transaction_month = @2023-02;
      order_by: total_fees; limit 1 }. Read candidate_aci (the ACI to steer shoppers toward) and total_fees.
  - name: c5_fee_rate_delta
    kind: source
    summary: >
      Parameterized single-rule rate-override delta. Matches transactions to all applicable rules,
      isolates the target fee ID, and reports original vs modified total fees and the signed delta
      from changing that rule's rate. Params: target_fee_id, new_rate.
    usage: >
      run: c5_fee_rate_delta(target_fee_id is 141, new_rate is 1) -> rate_change_delta
      + { where: merchant = 'Rafa_AI' and transaction_month = @2023-12 }. Read fee_delta (modified - original),
      or original_fees / modified_fees. Scope the time window in the where (day_of_year / transaction_month / full year).
provides_for:
  - "which card scheme to steer traffic to for minimum/maximum fees (argmin/argmax over schemes)"
  - "cheapest/most expensive card scheme for a merchant over a period"
  - "fraud-transaction ACI reallocation: preferred ACI for lowest fees"
  - "fee-change delta when a rule's relative fee (rate) is overridden"
  - "counterfactual routing/optimization scenarios over matched fees"
