file: c6_fee_scenarios.malloy
domain: Payment processing fees — counterfactual / what-if scenarios on the fee-rule matching join
summary: >
  What-if layer over the enriched payment facts. Three surfaces: (1) fee_scheme_steering —
  each transaction cross-fanned against every observed card scheme, rules rematched with
  card_scheme := candidate, to rank schemes by the total/avg fee the same traffic would incur;
  (2) fee_aci_steering — same sweep over observed ACIs (aci := candidate, everything else held
  fixed), with a built-in candidate <> current guard, for re-steering e.g. fraudulent traffic;
  (3) fee_scenarios — a parameterized source computing baseline and counterfactual rule matches
  SIDE BY SIDE over the same transactions: merchant-attribute overrides (alt_mcc,
  alt_account_type, alt_capture_delay_bucket) re-run the matching, price-term overrides
  (new_rate, new_fixed_amount) recompute fees on the unchanged baseline matches, and deltas are
  exposed as single measures (never two independent aggregates). All rule fields carry their
  wildcard branch (empty list / NULL = applies to all); monthly volume/fraud buckets stay at
  actual observed values in every scenario. Grain caution: the two steering sources fan base
  rows by the candidate universe and by rule matches — only match-grain fee measures and
  distinct-key counts are exposed there.
exports:
  - name: card_scheme_universe
    kind: source
    summary: Data-derived universe of card schemes observed in payments (candidate_scheme).
    usage: "Rarely queried directly; feeds the scheme-steering cross-fan."
  - name: fee_scheme_steering
    kind: source
    summary: Transaction x candidate-scheme sweep with rules rematched under each candidate scheme; fee measures at match grain (candidate_total_fee, candidate_avg_fee, min/max, matched_txn_count).
    usage: "run: fee_scheme_steering -> scheme_steering_ranking + { where: merchant = 'X' and txn_date ? @2023 } — row 1 is the cheapest scheme; use scheme_steering_ranking_desc for the most expensive; month scoping via txn_month_num or txn_date ? @2023-06."
  - name: fee_aci_steering
    kind: source
    summary: Transaction x candidate-ACI sweep (candidates from observed payment ACIs) with rules rematched under aci := candidate; ranking views exclude the current ACI (no-op guard) and tie-break alphabetically.
    usage: "run: fee_aci_steering -> aci_steering_ranking + { where: merchant = 'X' and has_fraudulent_dispute and txn_date ? @2023 } — row 1 is the preferred (lowest-fee) alternative ACI; candidate_avg_fee gives the per-transaction cost."
  - name: fee_scenarios
    kind: source
    summary: Parameterized baseline-vs-counterfactual fee comparison over one transaction population; alt_* params override merchant attributes for matching, new_rate/new_fixed_amount override a rule's price terms on baseline matches; deltas are single measures.
    usage: "MCC change: run: fee_scenarios(alt_mcc is 7523) -> scenario_fee_delta_summary + { where: merchant = 'X' and txn_date ? @2023 } and read total_fee_delta. Rate override: run: fee_scenarios(new_rate is 99) -> rule_override_delta_summary + { where: merchant = 'X' and baseline_rules.ID = 792 and txn_date ? @2023 } and read fee_delta_at_new_rate. Rule restricted to one attribute value: merchants_matching_rule + { where: baseline_rules.ID = 64 and account_type = 'S' and txn_date ? @2023 } (or matching_membership_change with the matching alt_* override)."
provides_for:
  - "Scheme steering (min or max total fees) for a merchant over any period, with the associated cost"
  - "Preferred alternative ACI (lowest fee) for a merchant's fraudulent or any filtered traffic, deterministic alphabetical tie-break"
  - "Fee delta if a specific rule's rate or fixed amount changed, over the transactions that rule matches in a period"
  - "Fee delta if a merchant's MCC / account type / capture-delay setting had been different for a period"
  - "Merchants affected by a rule, including under hypothetical restrictions of one of the rule's wildcard fields"
