file: c1_transactions.malloy
domain: Payment processing — enriched transactions
summary: >
  Enriched view of the payments fact table. Extends payments_base (which already
  derives transaction_date/transaction_month from day_of_year and the
  is_intracountry flag from issuing vs acquirer country) with merchant attributes
  (account_type, capture_delay band, merchant_category_code) via a join to
  merchants_base and the MCC text description via merchant_category_codes_base.
  This is the grain-preserving transaction surface used to group, filter and scope
  transactions by merchant characteristics for fee analysis. Fee-rule matching and
  fee computation live in downstream sources; this source supplies the enriched
  transaction attributes those need.
exports:
  - name: c1_transactions
    kind: source
    summary: >
      One row per payment transaction, enriched with the transacting merchant's
      account_type, account_type_label, capture_delay (raw + reconciled band),
      merchant_category_code and MCC description. All payments_base measures
      (transaction_count, total_amount, avg/min/max_amount, fraud_rate,
      refusal_rate, credit/debit and intracountry splits) and dimensions
      (transaction_date, transaction_month, is_intracountry, card_scheme, aci,
      issuing_country, shopper_interaction, has_fraudulent_dispute, is_credit)
      remain available.
    usage: >
      run: c1_transactions -> { where: merchant = 'X' and `year` = 2023; ... }.
      Filter transaction_date with date literals (transaction_date ? @2023-02) or
      day_of_year for a specific day; group_by any enriched dimension.
  - name: by_account_type
    kind: view
    summary: Transaction volume/value/fraud grouped by merchant account_type (+ label).
    usage: run: c1_transactions -> by_account_type (add a where: for merchant/period scope).
  - name: by_mcc
    kind: view
    summary: Transaction volume/value/fraud grouped by merchant_category_code and its description.
    usage: run: c1_transactions -> by_mcc + { where: merchant = 'X' }.
  - name: by_capture_delay_band
    kind: view
    summary: Transactions grouped by merchant capture_delay reconciled to fee-rule bands ('<3','3-5','>5','immediate','manual').
    usage: run: c1_transactions -> by_capture_delay_band.
  - name: by_intracountry
    kind: view
    summary: Transactions split by domestic (issuer==acquirer country) vs international.
    usage: run: c1_transactions -> by_intracountry + { where: merchant = 'X' }.
  - name: avg_value_by_issuing_country
    kind: view
    summary: Average transaction value by issuing_country, ascending.
    usage: >
      run: c1_transactions -> avg_value_by_issuing_country + { where: merchant = 'X'
      and card_scheme = 'NexPay' and transaction_date ? @2023-05 to @2023-07 }.
  - name: merchant_profile
    kind: view
    summary: >
      Per-merchant attribute row (account_type, merchant_category_code, capture_delay
      raw + band) for the merchants that appear in payments — the merchant side of
      fee-rule applicability matching.
    usage: run: c1_transactions -> merchant_profile (optionally where: merchant = 'X').
provides_for:
  - "applicable fee rules for a merchant (supplies merchant account_type, MCC, capture_delay band + transaction card_scheme/aci/is_credit/intracountry)"
  - "total fees paid (supplies per-transaction eur_amount + merchant/period scope + matched attributes)"
  - "average transaction value grouped by a dimension (issuing_country, card_scheme, mcc)"
  - "counterfactual MCC change (exposes merchant_category_code + mcc_description for override)"
  - "steer traffic to card scheme (supplies per-transaction card_scheme + eur_amount)"
  - "fraud reallocation to ACI (supplies has_fraudulent_dispute, aci, shopper_interaction)"
  - "monthly volume / monthly fraud band inputs (transaction_month + total/fraudulent amount per merchant)"
  - "MCC code-to-description lookup for merchants present in payments"
