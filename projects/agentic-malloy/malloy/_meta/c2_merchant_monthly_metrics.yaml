file: c2_merchant_monthly_metrics.malloy
domain: Payment processing fee optimization (Adyen-style fee-rule matching)
summary: >
  Per-merchant, per-natural-month aggregates of transaction volume and fraud rate,
  with each numeric metric mapped onto the EXACT banded threshold strings used by
  the fee-rule dataset (fees.monthly_volume and fees.monthly_fraud_level). This is
  the bridge that lets a merchant-month be matched against banded fee rules: it
  exposes monthly_volume_band ('<100k','100k-1m','1m-5m','>5m') and
  monthly_fraud_band ('<7.2%','7.2%-7.7%','7.7%-8.3%','>8.3%') as real columns.
  Months are natural calendar months (transaction_month is the month-truncated
  transaction date, carrying its year).
exports:
  - name: c2_merchant_monthly_metrics
    kind: source
    summary: >
      Grain = one row per (merchant, year, month). Carries monthly_volume_amount
      (SUM eur_amount), monthly_transaction_count, monthly_avg_amount,
      monthly_fraud_amount, monthly_fraud_volume_rate, plus the band labels
      monthly_volume_band and monthly_fraud_band aligned to the fee-rule domains.
    usage: >
      Filter to a merchant + month, e.g.
      `run: c2_merchant_monthly_metrics -> by_merchant_month + { where: merchant = 'Rafa_AI' and transaction_month ? @2023-10 }`
      to read that month's volume/fraud bands. Use the band columns as the
      monthly_volume / monthly_fraud_level inputs when matching applicable fee rules.
  - name: by_merchant_month
    kind: view
    summary: >
      Tabular per-merchant per-month report of volume, fraud, and both band labels.
    usage: >
      `run: c2_merchant_monthly_metrics -> by_merchant_month + { where: merchant = 'X' }`;
      scope with a date filter on transaction_month (`? @2023-02` for February 2023)
      to get the band strings for fee-rule matching.
provides_for:
  - "monthly volume band of a merchant in a given month"
  - "monthly fraud-level band of a merchant in a given month"
  - "natural-month volume and fraud-rate aggregates per merchant"
  - "inputs (monthly_volume / monthly_fraud_level) for fee-rule applicability matching"
