file: merchants_base.malloy
domain: payments / merchant profiles
summary: >
  Base semantic source over the merchants table (one row per merchant, 30 rows).
  Exposes the static merchant profile — account type, merchant category code (MCC),
  capture-delay setting, and acquirer list — plus the derived capture_delay_bucket
  that maps the merchant's concrete setting ('1','2','7','immediate','manual') into
  the fee-rule bucket domain ('<3','3-5','>5','immediate','manual') needed for
  fee-rule matching. No joins; join logic lives in downstream fact/rule models.
exports:
  - name: merchants_base
    kind: source
    summary: >
      One row per merchant. Dimensions: capture_delay_days (numeric days, null for
      immediate/manual), capture_delay_bucket (fee-rule bucket encoding),
      account_type_description (human-readable account type), acquirer_count and
      has_multiple_acquirers (from the list-valued acquirer column). Measures:
      merchant_count plus distinct counts of account types / MCCs / capture-delay
      settings and sum/avg/min/max of acquirer_count. All measures are merchant-grain.
    usage: "Filter with `where: merchant = 'X'` or an attribute predicate, then group_by any profile dimension + aggregate merchant_count; use capture_delay_bucket (not raw capture_delay) when comparing to fee-rule capture_delay values."
  - name: by_account_type
    kind: view
    summary: Merchant counts per account type with description.
    usage: "run: merchants_base -> by_account_type (optionally + { where: ... })"
  - name: by_mcc
    kind: view
    summary: Merchant counts per merchant category code (7 distinct MCCs in data).
    usage: "run: merchants_base -> by_mcc"
  - name: by_capture_delay
    kind: view
    summary: Merchant counts per raw capture-delay setting alongside its fee-rule bucket.
    usage: "run: merchants_base -> by_capture_delay"
  - name: by_capture_delay_bucket
    kind: view
    summary: Merchant counts per fee-rule capture-delay bucket ('<3','3-5','>5','immediate','manual').
    usage: "run: merchants_base -> by_capture_delay_bucket"
  - name: profile
    kind: view
    summary: Full merchant profile projection (raw + derived columns), one row per merchant.
    usage: "run: merchants_base -> profile + { where: merchant = 'X' } to look up a single merchant's fee-relevant attributes."
provides_for:
  - "payments fact model: join_one merchants_base with merchant to enrich each transaction with account_type, merchant_category_code, capture_delay_bucket for fee-rule matching"
  - "fee-rule matching: capture_delay_bucket is the pre-mapped value to compare against fees.capture_delay (with null-wildcard branch)"
  - "acquirer country resolution: unnest the acquirer list against an acquirer_countries lookup in a downstream model"
