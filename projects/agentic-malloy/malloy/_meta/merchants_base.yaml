file: merchants_base.malloy
domain: merchants
summary: >
  Base source over the DuckDB `merchants` registry table. Adds human-readable
  labels for account_type (Enterprise/Platform/Other segments), capture-delay
  speed buckets, MCC industry groupings, and acquirer-diversity dimensions,
  plus headline counts (merchants, distinct MCCs, multi-acquirer share,
  fast-capture share). No joins — pure single-table enrichment.
exports:
  - name: merchants_base
    kind: source
    summary: >
      Merchant registry with derived dimensions (account_type_label,
      account_segment, capture_speed, is_fast_capture, is_timely_settlement,
      acquirer_count, is_multi_acquirer, mcc_category_prefix,
      mcc_industry_group) and measures (merchant_count,
      distinct_merchant_count, distinct_mcc_count, distinct_account_type_count,
      avg_acquirer_count, total_acquirer_relationships,
      multi_acquirer_merchant_count, fast_capture_merchant_count).
provides_for:
  - merchants
  - merchant enrichment for payments
  - account_type segmentation
  - capture_delay analysis
  - MCC industry grouping
  - acquirer diversity
