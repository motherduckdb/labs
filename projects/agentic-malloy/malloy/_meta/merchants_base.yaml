file: merchants_base.malloy
domain: payments
summary: |
  Base source over the `merchants` reference table (30 rows, one per merchant).
  Adds human-readable labels for account_type (per Merchant Manual §2), a
  business-channel rollup (Enterprise vs Platform), capture-delay helpers that
  bucket raw values ('1','2','7','immediate','manual') into the vocabulary used
  by the fee rules ('<3','3-5','>5','immediate','manual'), acquirer-list helpers
  (count / has-any / is-multi using len!number, since the profile shows no NULLs
  and no empty lists), and basic count measures. No joins — downstream sources
  build join logic on top of this.
exports:
  - name: merchants_base
    kind: source
    summary: Per-merchant reference data with labels, capture-delay buckets, acquirer helpers, and count measures.
provides_for:
  - "merchant lookup and labeling (account_type → human label, business channel)"
  - "fee-rule matching keys: account_type, merchant_category_code, capture_delay_rule"
  - "merchant segmentation by channel / MCC / capture timing"
