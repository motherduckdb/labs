file: merchants_base.malloy
domain: Payment processing fee optimization — merchant profile dimension table
summary: >
  Base semantic layer over the merchants table (30 merchants). Each row is one
  merchant with the profile attributes that drive fee-rule applicability:
  account_type, merchant_category_code (MCC), capture_delay, and the acquirer
  list. Adds decoded labels, a capture_delay band reconciled to the fee-rule
  buckets ('<3','3-5','>5','immediate','manual'), and acquirer helpers. No joins
  — join to payments (by merchant name) and to fee rules downstream.
exports:
  - name: merchants_base
    kind: source
    summary: >
      Merchant dimension source. Grain = one merchant. Dimensions: merchant,
      capture_delay (raw), capture_delay_days (numeric or null for
      immediate/manual), capture_delay_band (fee-rule bucket), account_type,
      account_type_label, merchant_category_code, acquirer (list),
      acquirer_count, has_named_acquirer. Measure: merchant_count.
    usage: >
      `run: merchants_base -> { where: merchant = 'FitHub'; select: * }` to fetch
      one merchant's profile; group_by any dimension + aggregate merchant_count
      for population counts.
  - name: by_account_type
    kind: view
    summary: Merchant counts grouped by account_type with decoded label.
    usage: "`run: merchants_base -> by_account_type`"
  - name: by_merchant_category_code
    kind: view
    summary: Merchant counts grouped by MCC.
    usage: "`run: merchants_base -> by_merchant_category_code`"
  - name: by_capture_delay
    kind: view
    summary: Merchant counts grouped by raw capture_delay value.
    usage: "`run: merchants_base -> by_capture_delay`"
  - name: by_capture_delay_band
    kind: view
    summary: >
      Merchant counts grouped by capture_delay reconciled to fee-rule band
      buckets ('<3','3-5','>5','immediate','manual').
    usage: "`run: merchants_base -> by_capture_delay_band`"
provides_for:
  - "merchant profile lookup (account_type, MCC, capture_delay, acquirers)"
  - "capture_delay reconciliation to fee-rule bands for fee matching"
  - "merchant population counts by account_type / MCC / capture_delay"
  - "base for joining to payments (by merchant) and to fee rules for applicable-fee matching"
