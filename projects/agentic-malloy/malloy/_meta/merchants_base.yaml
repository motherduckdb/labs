file: merchants_base.malloy
domain: payments fee optimization — merchant dimension
summary: >
  Base source over the 30-row merchants table (one row per merchant). Exposes the
  merchant attributes needed for fee-rule matching: account_type (single letter,
  with a readable description), merchant_category_code (BIGINT MCC), the merchant's
  concrete capture_delay setting ('1','2','7','immediate','manual') plus its derived
  rule-grain bucket ('<3','3-5','>5','immediate','manual'), and the list-valued
  acquirer column. No joins; join logic lives in higher-level model files.
exports:
  - name: merchants_base
    kind: source
    summary: >
      Grain = one merchant. Key derived field is capture_delay_bucket, which maps the
      merchant's numeric-day setting into the exact range strings the fee rulebook
      uses (needed for capture_delay matching). acquirer is a VARCHAR[] list —
      never NULL/empty in this data; use list_contains!boolean for membership.
      All measures are merchant-grain (safe here; recompute before any fan-out join).
    usage: "run: merchants_base -> { where: merchant = 'Crossfit_Hanna'; select: * } or group_by any dimension + aggregate: merchant_count"
  - name: by_account_type
    kind: view
    summary: Merchant counts per account type with readable description.
    usage: "run: merchants_base -> by_account_type; refine with + { where: ... } to scope"
  - name: by_mcc
    kind: view
    summary: Merchant counts per merchant category code (7 distinct MCCs in data).
    usage: "run: merchants_base -> by_mcc"
  - name: by_capture_delay
    kind: view
    summary: Merchant counts per raw capture_delay setting and its rule-grain bucket.
    usage: "run: merchants_base -> by_capture_delay"
  - name: merchant_profile
    kind: view
    summary: One-row-per-merchant projection of all attributes incl. derived capture_delay_bucket and acquirer_count — the canonical lookup for a single merchant's fee-matching attributes.
    usage: "run: merchants_base -> merchant_profile + { where: merchant = 'Rafa_AI' }"
provides_for:
  - "join_one target (with merchant) from the payments fact source to supply rule-matching attributes (account_type, MCC, capture_delay_bucket)"
  - "capture_delay_bucket is the value to compare against fees.capture_delay (NULL rule field = wildcard)"
  - "acquirer list can be unnested/joined to the acquirer→country lookup in a higher-level model for local-acquiring analysis"
