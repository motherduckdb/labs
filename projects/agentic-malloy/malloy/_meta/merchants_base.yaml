file: merchants_base.malloy
domain: Payment processing — merchant reference dimension
summary: >
  One row per merchant (30 distinct merchants). Holds each merchant's static
  characteristics used to scope fee rules: account type, Merchant Category Code
  (MCC), capture delay, and acquirer list. Derived fields translate raw merchant
  values into the categorical bands used by the fee ruleset (e.g. numeric-day
  capture_delay → '<3'/'3-5'/'>5' bands, account_type code → description).
  No joins here — this is the reusable merchant dimension to be joined by
  fee-matching and payments layers.
exports:
  - name: merchants_base
    kind: source
    summary: >
      Merchant dimension. Grain = one merchant. Dimensions: merchant,
      account_type (+account_type_description), merchant_category_code,
      capture_delay (+capture_delay_band mapped to fee bands), acquirer list
      (+acquirer_count, has_named_acquirer). Measures: merchant_count and
      symmetric counts of populated attributes.
    usage: >
      `run: merchants_base -> { group_by: account_type; aggregate: merchant_count }`.
      Use capture_delay_band (not raw capture_delay) when matching fee rules whose
      capture_delay uses '<3'/'3-5'/'>5' categorical bands. acquirer is a list —
      test emptiness with acquirer_count (len!number), never `is null`.
  - name: by_account_type
    kind: view
    summary: Merchant counts by account type with human-readable description.
    usage: "`run: merchants_base -> by_account_type` (optionally + { where: ... })."
  - name: by_mcc
    kind: view
    summary: Merchant counts grouped by Merchant Category Code.
    usage: "`run: merchants_base -> by_mcc`; join merchant_category_code to an MCC lookup for descriptions."
  - name: by_capture_delay
    kind: view
    summary: Merchant counts by raw capture_delay and its mapped fee band.
    usage: "`run: merchants_base -> by_capture_delay`."
provides_for:
  - "Merchant profile lookup (account type, MCC, capture delay, acquirers)"
  - "Scoping/matching fee rules to merchants via account_type, capture_delay_band, merchant_category_code"
  - "Counting merchants by account type / MCC / capture delay"
  - "Base merchant dimension for joins from payments and fee-matching layers"
