file: c3_average_fee_scenarios.malloy
domain: payments-fees
summary: >
  Fees-only "average scenario" pricing surface. Computes
  fee_eur(N) = fixed_amount + rate * N / 10000 per rule, then averages
  (and finds extrema of) that quantity across the fee rules that survive
  a wildcard-aware filter on user-specified attributes. Supplies one
  rule-grain source for scalar groupings (card_scheme, is_credit,
  intracountry, capture_delay) plus three unnested companions so list
  attributes (account_type, aci, mcc) can be grouped/ranked without
  dropping wildcard rules. No payments are involved.
exports:
  - name: c3_average_fee_scenarios
    kind: source
    summary: >
      Rule-grain (extends fees_base). Parameterized notional fee
      dimensions (50/100/500/1k/4321/10k/50k EUR) plus avg/min/max
      measures; views average by card_scheme, is_credit, intracountry,
      capture_delay, and provide cheapest/most-expensive card_scheme
      argmin/argmax at common notionals. Add wildcard-aware `where:`
      filters to narrow scope.
  - name: c3_avg_fee_by_account_type
    kind: source
    summary: >
      (rule × account_type) cross-product over the account-type universe
      {R,D,H,F,S,O}. Wildcard account_type rules contribute to every
      account type. Use whenever account_type is the grouping/ranking key.
  - name: c3_avg_fee_by_aci
    kind: source
    summary: >
      (rule × aci) cross-product over the ACI universe {A..G}. Provides
      argmin/argmax ACI views (cheapest_aci_on_100, most_expensive_aci_on_100)
      with deterministic alphabetical tie-break.
  - name: c3_avg_fee_by_mcc
    kind: source
    summary: >
      (rule × mcc) cross-product over the universe of MCCs appearing in
      any rule's MCC list (plus wildcard rules contributing to every MCC).
      Joins merchant_category_codes_base for descriptions; supplies
      cheapest/most-expensive MCC views at high notionals.
provides_for:
  - average-scenario fee per card scheme at a hypothetical notional
  - cheapest / most expensive card scheme at a hypothetical notional
  - average fee by account_type / ACI / MCC at a hypothetical notional
  - argmin / argmax over ACI at a notional with alphabetical tie-break
  - argmin / argmax over MCC at a notional
  - average fee filtered by is_credit / intracountry / capture_delay
  - per-rule extrema (min/max fee) at a notional within a filter scope
  - composition with wildcard-aware filters on account_type / mcc / aci / is_credit / intracountry
